  /* ===== Kontrak bersama (CONTRACTS.md — disalin apa adanya) ===== */
  const KEY = { cust: "iulfnb:cust", pos: "iulfnb:pos", live: "iulfnb:orders-live", beat: "iulfnb:kasir-beat", seq: "iulfnb:seq", role: "iulfnb:role" };
  const SEQ_BASE = 107;
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },

  function nextOrderCode() {
    const n = Math.max(ls.get(KEY.seq, SEQ_BASE), SEQ_BASE) + 1;

    return "A-" + String(n).padStart(3, "0");

  /** Jam operasional (sama dengan halaman Pengaturan): 0 = Minggu … 6 = Sabtu */
  const HOURS = { 0: ["08:00", "22:00"], 1: ["08:00", "22:00"], 2: ["08:00", "22:00"], 3: ["08:00", "22:00"], 4: ["08:00", "22:00"], 5: ["08:00", "22:00"], 6: ["08:00", "23:00"] };
  function isCafeOpen(d = new Date()) {
    const [o, c] = HOURS[d.getDay()] || [];
    if (!o) return false;
    const m = d.getHours() * 60 + d.getMinutes(), t = (s) => +s.slice(0, 2) * 60 + +s.slice(3);
    return m >= t(o) && m < t(c);
  }
  /* A. Sesi pelanggan — localStorage["iulfnb:cust"] */
  const custEmpty = (table = "07") => ({ v: 1, table, invalid_table: null, cart: [], selected: "m1", edit_key: null, order: null, browse_only: false, force_open: false, flash: null, demo: false });

    { key: "m1|tidak pedas", menu_id: "m1", qty: 2, note: "Tidak pedas" },
    { key: "d1|es sedikit", menu_id: "d1", qty: 1, note: "Es sedikit" },
    { key: "s1|", menu_id: "s1", qty: 1, note: "" },
  ] });
  function loadCust(fallback = custEmpty) { const s = ls.get(KEY.cust, null); return s && s.v === 1 ? s : fallback(); }
  function saveCust(s) { s.updated_at = new Date().toISOString(); ls.set(KEY.cust, s); }
  const lineKey = (menuId, note) => menuId + "|" + String(note || "").trim().toLowerCase();
  /* B. Jembatan pelanggan → kasir */

    const live = ls.get(KEY.live, []).filter((x) => Date.now() - new Date(x.created_at) < 12 * 3600e3);
    live.push({ code: order.code, table: order.table, order_type: "QR", status: "MENUNGGU", payment_status: "BELUM", created_at: order.created_at,

    ls.set(KEY.live, live);
  }

  /* ===== Data tiruan (sama dengan halaman pelanggan) ===== */

  const MENUS = [
    { id: "m1", name: "Nasi Goreng Kampung", price: 32000, image_url: "https://images.unsplash.com/photo-1680674774705-90b4904b3a7f?w=640&h=640&fit=crop&auto=format&q=75", is_available: true },

    { id: "m4", name: "Rice Bowl Chicken Teriyaki", price: 36000, image_url: "https://images.unsplash.com/photo-1636401870585-a8852371e84a?w=640&h=640&fit=crop&auto=format&q=75", is_available: true },
    { id: "m5", name: "Nasi Ayam Bakar Madu", price: 38000, image_url: "https://images.unsplash.com/photo-1672856399675-8c099efbe0e2?w=640&h=640&fit=crop&auto=format&q=75", is_available: false },
    { id: "d1", name: "Kopi Susu Gula Aren", price: 22000, image_url: "https://images.unsplash.com/photo-1589985902809-39d25db22101?w=640&h=640&fit=crop&auto=format&q=75", is_available: true },

    { id: "d4", name: "Es Teh Manis", price: 10000, image_url: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=640&h=640&fit=crop&auto=format&q=75", is_available: true },
    { id: "d5", name: "Lemon Tea", price: 15000, image_url: "https://images.unsplash.com/photo-1758705206938-a196ac3ae3bb?w=640&h=640&fit=crop&auto=format&q=75", is_available: true },
    { id: "d6", name: "Jus Alpukat", price: 25000, image_url: "https://images.unsplash.com/photo-1630252595285-3bbcb51378d8?w=640&h=640&fit=crop&auto=format&q=75", is_available: false },
    { id: "s1", name: "Kentang Goreng", price: 20000, image_url: "https://images.unsplash.com/photo-1518013431117-eb1465fa5752?w=640&h=640&fit=crop&auto=format&q=75", is_available: true },
    { id: "s2", name: "Pisang Goreng Keju", price: 18000, image_url: "https://images.unsplash.com/photo-1762941904142-9d91ca413e66?w=640&h=640&fit=crop&auto=format&q=75", is_available: true },

    { id: "s4", name: "Croissant Butter", price: 24000, image_url: "https://images.unsplash.com/photo-1691480162735-9b91238080f6?w=640&h=640&fit=crop&auto=format&q=75", is_available: true },

  const TAX_RATE = SETTINGS.tax_percent / 100;
  const MAX_QTY = 50;
  const SEND_MS = 900;
  const DAYS = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

  /* ===== Util ===== */
  const $ = (part) => root.querySelector(`[data-part="${part}"]`);
  const $$ = (sel, el = root) => [...el.querySelectorAll(sel)];
  const rp = (n) => "Rp " + Math.round(n).toLocaleString("id-ID");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = (name, size = 18, cls = "") => `<iconify-icon icon="lucide:${name}" aria-hidden="true"${cls ? ` class="${cls}"` : ""} style="font-size:${size}px"></iconify-icon>`;
  const menuById = Object.fromEntries(MENUS.map((m) => [m.id, m]));
  const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const motion = (el, frames, opts = {}) => {
    if (!el?.animate || reduceMotion()) return;
    try { el.animate(frames, { duration: 280, easing: "cubic-bezier(.2,.8,.2,1)", ...opts }); } catch {}
  };
  function nextOpenLabel(now = new Date()) {
    for (let i = 0; i < 8; i++) {
      const d = new Date(now); d.setDate(now.getDate() + i);

      d.setHours(+h[0].slice(0, 2), +h[0].slice(3), 0, 0);
      if (d > now) return `${i === 0 ? "" : i === 1 ? "besok " : DAYS[d.getDay()] + " "}pukul ${h[0].replace(":", ".")}`;
    }
    return "pukul 08.00";
  }
  const totals = (lines) => {
    const sub = lines.reduce((a, l) => a + l.price * l.qty, 0);
    const tax = Math.round(sub * TAX_RATE);
    return { sub, tax, total: sub + tax, count: lines.reduce((a, l) => a + l.qty, 0) };
  };

  /* ===== Toast ===== */
  const toastEl = $("toast");
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    try { if (toastEl.matches(":popover-open")) toastEl.hidePopover(); toastEl.showPopover(); } catch {}
    motion(toastEl, [{ opacity: 0, transform: "translate(-50%, 12px)" }, { opacity: 1, transform: "translate(-50%, 0)" }], { duration: 200 });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 2400);
  }
  function hideToast() { try { if (toastEl.matches(":popover-open")) toastEl.hidePopover(); } catch {} }
  onCleanup(() => { clearTimeout(toastTimer); hideToast(); });

  /* ===== Sesi: tanpa sesi sama sekali → keranjang contoh (disimpan) agar frame kanvas tetap bermakna ===== */
  let c = loadCust(custDemo);
  if (!ls.get(KEY.cust, null)) saveCust(c);
  let sending = false, sendTimer;
  const blocked = () => !!c.browse_only || (!isCafeOpen() && !c.force_open);
  const lines = () => c.cart.filter((l) => menuById[l.menu_id]).map((l) => ({ ...l, name: menuById[l.menu_id].name, price: menuById[l.menu_id].price, image_url: menuById[l.menu_id].image_url }));

  /** Render ulang tanpa kehilangan fokus keyboard pada tombol yang diganti. */
  function keepFocus(fn) {
    const a = document.activeElement;
    const keys = ["line", "delta", "edit"];
    const sel = a && a !== document.body && root.contains(a) && a.tagName === "BUTTON"
      ? keys.filter((k) => a.dataset[k] != null).map((k) => `[data-${k}="${CSS.escape(a.dataset[k])}"]`).join("") : "";
    const idx = sel ? $$(sel).indexOf(a) : -1;
    fn();
    if (sel && !a.isConnected) {
      const next = $$(sel)[idx] || $$(sel)[0] || $$(`[data-delta="${CSS.escape(a.dataset.delta || "1")}"]`)[0] || root.querySelector(".pl-more");
      next?.focus({ preventScroll: true });
    }
  }

  function render() {
    const rows = lines(), t = totals(rows), empty = !rows.length, off = blocked();
    $("title").textContent = `Pesanan Meja ${c.table}`;
    $("sub").textContent = empty ? "Belum ada menu dipilih" : `${t.count} item dari ${rows.length} menu`;
    $("eyebrow").hidden = empty;
    $("filled").hidden = empty;
    $("empty").hidden = !empty;
    $("dock").hidden = empty;
    const track = $("empty-track");
    track.hidden = !c.order;
    if (c.order) track.innerHTML = `${icon("receipt", 15)}Lacak pesanan ${esc(c.order.code)}`;
    $("demo").hidden = !c.demo || empty;

    $("list").innerHTML = rows.map((l) => `<li class="pl-line">
        <span class="pl-thumb" aria-hidden="true"><img src="${esc(l.image_url)}" alt="" loading="lazy" decoding="async"></span>
        <div class="pl-line-info">
          <span class="pl-name">${esc(l.name)}</span>
          <button type="button" class="pl-note-btn" data-edit="${esc(l.key)}" aria-label="${l.note ? `Ubah ${esc(l.name)}, catatan: ${esc(l.note)}` : `Ubah ${esc(l.name)} atau tambah catatan`}">${l.note
            ? `${icon("sticky-note", 13)}<q>${esc(l.note)}</q> <span aria-hidden="true">·</span> <b>Ubah</b>` : "<b>+ Tambah catatan</b>"}</button>
          <span class="pl-line-price">${rp(l.price * l.qty)}${l.qty > 1 ? `<small>${l.qty} × ${rp(l.price)}</small>` : ""}</span>
        </div>
        <div class="pl-stepper" role="group" aria-label="Jumlah ${esc(l.name)}">
          <button type="button" data-line="${esc(l.key)}" data-delta="-1" aria-label="${l.qty === 1 ? "Hapus" : "Kurangi"} ${esc(l.name)}">${icon(l.qty === 1 ? "trash-2" : "minus", 14)}</button>
          <output aria-live="polite">${l.qty}</output>
          <button type="button" data-line="${esc(l.key)}" data-delta="1" aria-label="Tambah ${esc(l.name)}"${l.qty >= MAX_QTY ? " disabled" : ""}>${icon("plus", 14)}</button>
        </div>
      </li>`).join("");
    $("sum").innerHTML = `<div><span>Subtotal (${t.count} item)</span><span>${rp(t.sub)}</span></div>
      <div><span>Pajak &amp; layanan (${SETTINGS.tax_percent}%)</span><span>${rp(t.tax)}</span></div>
      <div class="pl-total"><span>Total</span><span>${rp(t.total)}</span></div>`;

    const reason = $("reason");
    reason.hidden = !off;
    if (off) reason.innerHTML = `${icon("clock", 16)}<span>Kafe sedang tutup · buka lagi ${esc(nextOpenLabel())}. Pesanan bisa dikirim saat kafe buka.</span>`;
    paintSend(t);
    document.title = `Keranjang Meja ${c.table} — Kedai Senja | IUL FnB`;
  }
  function paintSend(t = totals(lines())) {
    const btn = $("send"), off = blocked();
    btn.disabled = sending || off;
    btn.setAttribute("aria-busy", String(sending));
    if (off) btn.setAttribute("aria-describedby", "pelanggan-keranjang-reason"); else btn.removeAttribute("aria-describedby");
    btn.innerHTML = sending
      ? `${icon("loader-circle", 18, "pl-spin")}Mengirim ke kasir…`
      : `${off ? icon("lock", 16) : ""}Kirim pesanan <span class="pl-sep" aria-hidden="true">·</span> ${rp(t.total)}`;
    if (sending) motion(btn.querySelector(".pl-spin"), [{ transform: "rotate(0)" }, { transform: "rotate(360deg)" }], { duration: 800, iterations: Infinity, easing: "linear" });
  }

  /* ===== Kirim pesanan (kontrak A + B) ===== */
  function send() {
    if (sending) return;
    c = loadCust(custDemo);
    if (!lines().length) { render(); return; }
    if (blocked()) { render(); toast("Kafe sedang tutup — pesanan belum bisa dikirim"); return; }
    sending = true;
    paintSend();
    // Prototipe: meniru POST /orders (meja, item, catatan)
    sendTimer = setTimeout(() => {
      sending = false;
      c = loadCust(custDemo);
      const items = lines().map((l) => ({ menu_id: l.menu_id, name: l.name, price: l.price, qty: l.qty, note: l.note }));
      if (!items.length) { render(); return; }
      const now = new Date().toISOString();
      const order = { code: nextOrderCode(), table: c.table, created_at: now, items, ...totals(items),
        driven: kasirOnline(), times: [now, null, null, null], payment_status: "BELUM", cancelled: false };
      c.order = order;
      c.cart = [];
      c.edit_key = null;
      saveCust(c);
      pushLive(order);
      location.hash = "#/pelanggan/status";
    }, SEND_MS);
  }
  onCleanup(() => { clearTimeout(sendTimer); sending = false; });

  /* ===== Event ===== */
  root.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || !root.contains(b) || sending) return;
    const d = b.dataset;
    if (d.line != null && d.delta) {
      c = loadCust(custDemo);
      const i = c.cart.findIndex((l) => l.key === d.line);
      const l = c.cart[i];
      if (!l) { render(); return; }
      const name = menuById[l.menu_id]?.name || "Menu";
      l.qty = Math.min(MAX_QTY, l.qty + Number(d.delta));
      if (l.qty <= 0) c.cart.splice(i, 1);
      saveCust(c);
      keepFocus(render);
      if (l.qty <= 0) toast(c.cart.length ? `${name} dihapus dari keranjang` : "Keranjang kosong");
      if (!c.cart.length) $("title").focus({ preventScroll: true });
      return;
    }
    if (d.edit != null) {
      c = loadCust(custDemo);
      const l = c.cart.find((x) => x.key === d.edit);
      if (!l) { render(); return; }
      c.selected = l.menu_id;
      c.edit_key = l.key;
      saveCust(c);
      location.hash = "#/pelanggan/menu";
    }
  }, { signal });
  $("send").addEventListener("click", send, { signal });
  // Sesi diubah di tab lain → render ulang
  addEventListener("storage", (e) => {
    if (e.key !== KEY.cust && e.key !== null) return;
    c = loadCust(custDemo);
    if (!sending) keepFocus(render);
  }, { signal });

  /* ===== Mulai ===== */
  const prevTitle = document.title;
  onCleanup(() => { document.title = prevTitle; });
  render();
  scrollTo({ top: 0 });
  $("title").focus({ preventScroll: true });
  // Pesan dari halaman sebelumnya (mis. "✓ Perubahan disimpan"), tampilkan lalu hapus
  if (c.flash) { const f = c.flash; c.flash = null; saveCust(c); toast(f); }
</script>
