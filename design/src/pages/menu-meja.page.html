<style>

  .mm-ph-search { display: flex; align-items: center; gap: 7px; height: 36px; margin: 12px 12px 0; padding: 0 12px; border: var(--border-hairline) solid var(--color-border-strong); border-radius: var(--radius-control); background: var(--color-surface); font: 400 11px / 1 var(--font-ui); color: var(--color-text-muted); }

    doc.dataset.lStafPrinting = "";
    const done = () => { delete doc.dataset.lStafPrinting; area.innerHTML = ""; };
    addEventListener("afterprint", done, { once: true, signal });
    print();
  }
  const printTimers = new Set();
  function later(fn, ms) { const t = setTimeout(() => { printTimers.delete(t); fn(); }, ms); printTimers.add(t); }
  onCleanup(() => printTimers.forEach(clearTimeout));

  /* ===== Dialog ===== */
  const open = (part) => { const d = $(part); if (!d.open) d.showModal(); };
  const close = (part) => { const d = $(part); if (d.open) d.close(); };
  for (const d of $$("dialog")) {
    d.addEventListener("click", (e) => {
      if (e.target === d) d.close();
      else if (e.target.closest("[data-close]")) d.close();
    }, { signal });
  }
  onCleanup(() => { for (const d of $$("dialog").reverse()) if (d.open) d.close(); });

  /* ----- Error inline ----- */
  function setErr(part, msg) {
    const el = $(part);
    el.setAttribute("aria-invalid", "true");
    el.closest(".l-staf-affix")?.setAttribute("aria-invalid", "true");
    const er = $(part + "-err");
    er.textContent = msg;
    er.hidden = false;
    return el;
  }
  function clearErr(part) {
    const el = $(part);
    if (!el) return;
    el.removeAttribute("aria-invalid");
    el.closest(".l-staf-affix")?.removeAttribute("aria-invalid");
    const er = $(part + "-err");
    if (er) { er.hidden = true; er.textContent = ""; }
  }

  /* ===== Peran, kepala halaman & tab ===== */
  function paintActions() {
    const locked = role() === "CASHIER";
    actions?.querySelectorAll("[data-tab-action]").forEach((b) => { b.hidden = locked || b.dataset.tabAction !== S.tab; });
  }
  function applyRole() {
    const locked = role() === "CASHIER";
    $("app").hidden = locked;
    $("context").hidden = locked;
    $("locked").hidden = !locked;
    $("locked-who").textContent = USERS.CASHIER;
    if (locked) for (const d of $$("dialog")) if (d.open) d.close();
    paintActions();
  }
  function renderHead() {
    const off = S.menus.filter((m) => !m.is_available).length;
    const on = S.tables.filter((t) => t.is_active).length;
    $("context").textContent = `${S.menus.length} menu · ${off} habis · ${on} meja aktif`;
    $("cnt-menu").textContent = S.menus.length;
    $("cnt-kategori").textContent = S.categories.length;
    $("cnt-meja").textContent = S.tables.length;
  }
  function setTab(tab, focus) {
    if (!TABS.includes(tab)) tab = "menu";
    S.tab = tab;
    $$('[data-part="tabs"] [role="tab"]').forEach((b) => {
      const on = b.dataset.tab === tab;
      b.setAttribute("aria-selected", on);
      b.tabIndex = on ? 0 : -1;
    });
    $$("[data-panel]").forEach((p) => { p.hidden = p.dataset.panel !== tab; });
    paintActions();
    if (focus) root.querySelector(`#menu-meja-tab-${tab}`)?.focus();
  }

  /* ===== Tab Menu ===== */
  const mainLabel = (m) => `Ubah ${m.name}, ${rp(m.price)}${m.is_available ? "" : ", habis"}`;
  const soldChip = '<span class="l-staf-chip mm-sold" data-tone="danger">Habis</span>';
  function emptyHTML(ic, title, text, action) {
    return `<div class="l-staf-card mm-empty-card"><div class="l-staf-empty">${icon(ic, 28)}<strong>${title}</strong><span>${text}</span>${action ? `<div class="mm-empty-act">${action}</div>` : ""}</div></div>`;
  }

  function cardHTML(m) {
    const outs = outIngs(m);
    const tags = (m.tags || []).filter((t) => TAG_TONE[t]);
    const id = esc(m.id);
    return `<article class="mm-card" data-id="${id}"${m.is_available ? "" : " data-off"}>
      <button type="button" class="mm-card-main" data-act="edit-menu" data-id="${id}" aria-label="${esc(mainLabel(m))}">
        <span class="mm-tile" aria-hidden="true"><span class="mm-emo">${esc(m.image_url)}</span></span>${m.is_available ? "" : soldChip}
        <span class="mm-card-body">
          ${tags.length ? `<span class="mm-tags">${tags.map((t) => `<span class="l-staf-chip" data-tone="${TAG_TONE[t]}">${t}</span>`).join("")}</span>` : ""}
          <span class="mm-name">${esc(m.name)}</span>
          <span class="mm-desc">${esc(m.desc || "Belum ada deskripsi.")}</span>
          <span class="mm-bottom">
            ${outs.length ? `<span class="mm-warn">${icon("triangle-alert", 14)}<span>Bahan habis: ${outs.map((i) => esc(i.name)).join(", ")}</span></span>` : ""}
            <span class="mm-price">${rp(m.price)}</span>
          </span>
        </span>
      </button>
      <div class="mm-card-foot">
        <div class="mm-avail">
          <label class="l-staf-switch"><input type="checkbox" role="switch" id="menu-meja-av-${id}" data-toggle="menu" data-id="${id}"${m.is_available ? " checked" : ""} aria-label="${esc(m.name)} tersedia"><span></span></label>
          <label class="mm-avail-txt" for="menu-meja-av-${id}">${m.is_available ? "Tersedia" : "Habis"}</label>
        </div>
        <button type="button" class="l-staf-iconbtn" data-act="edit-menu" data-id="${id}" aria-label="Ubah ${esc(m.name)}" title="Ubah menu">${icon("pencil", 16)}</button>
      </div>
    </article>`;
  }
  const addTileHTML = (c) => `<button type="button" class="mm-add" data-act="add-menu" data-cat="${esc(c.id)}">
      <span class="mm-add-plus">${icon("plus", 20)}</span><strong>Tambah menu</strong><small>ke ${esc(c.name)}</small></button>`;

  function renderMenuControls() {
    if (S.cat !== "all" && !catById(S.cat)) S.cat = "all";
    const cats = sortedCats();
    const chips = [{ id: "all", name: "Semua", n: S.menus.length }].concat(cats.map((c) => ({ id: c.id, name: c.name, n: menusIn(c.id).length })));
    $("cat-seg").innerHTML = chips.map((c) =>
      `<button type="button" data-act="f-cat" data-cat="${esc(c.id)}" aria-pressed="${S.cat === c.id}">${esc(c.name)}<small>${c.n}</small></button>`).join("");

    const pool = S.cat === "all" ? S.menus : menusIn(S.cat);
    const on = pool.filter((m) => m.is_available).length;
    $("avail-seg").innerHTML = [["all", "Semua", pool.length], ["on", "Tersedia", on], ["off", "Habis", pool.length - on]]
      .map(([v, l, n]) => `<button type="button" data-act="f-avail" data-v="${v}" aria-pressed="${S.avail === v}">${l}<small>${n}</small></button>`).join("");

    // Menu yang masih bisa dipesan padahal salah satu bahannya habis
    const risky = S.menus.filter((m) => m.is_available && outIngs(m).length);
    const al = $("menu-alert");
    al.hidden = !risky.length;
    al.innerHTML = risky.length ? `<div class="l-staf-alert mm-risk" data-tone="warning">${icon("triangle-alert", 18)}
      <div class="mm-grow"><strong>${risky.length} menu masih bisa dipesan padahal bahannya habis:</strong> ${risky.map((m) => esc(m.name)).join(", ")}. Tandai habis supaya pelanggan tidak kecewa.</div>
      <button type="button" class="l-staf-btn" data-size="sm" data-act="mark-risky">Tandai habis</button></div>` : "";
  }

  function renderMenuGrid() {
    const q = S.q.trim().toLowerCase();
    const list = S.menus.filter((m) =>
      (S.cat === "all" || m.category_id === S.cat) &&
      (S.avail === "all" || (S.avail === "on") === !!m.is_available) &&
      (!q || m.name.toLowerCase().includes(q) || String(m.desc || "").toLowerCase().includes(q)));
    $("menu-meta").textContent = list.length === S.menus.length ? `${S.menus.length} menu` : `Menampilkan ${list.length} dari ${S.menus.length} menu`;

    const cats = sortedCats();
    if (!cats.length) {
      $("menu-grid").innerHTML = emptyHTML("folder-open", "Belum ada kategori", "Buat kategori dulu (mis. Makanan, Minuman), lalu tambahkan menunya.",
        '<button type="button" class="l-staf-btn" data-act="tab" data-tab="kategori">Atur kategori</button>');
      return;
    }
    const showAdd = !q && S.avail === "all";
    const html = (S.cat === "all" ? cats : cats.filter((c) => c.id === S.cat)).map((c) => {
      const items = list.filter((m) => m.category_id === c.id);
      if (!items.length && !showAdd) return "";
      return `<section class="mm-sec" aria-labelledby="menu-meja-sec-${esc(c.id)}">
        <header class="mm-sec-head"><h2 id="menu-meja-sec-${esc(c.id)}">${esc(c.name)}</h2><span>${items.length} menu</span></header>
        <div class="mm-grid">${items.map(cardHTML).join("")}${showAdd ? addTileHTML(c) : ""}</div>
      </section>`;
    }).join("");

    const reset = '<button type="button" class="l-staf-btn" data-act="reset">Reset filter</button>';
    $("menu-grid").innerHTML = html || (
      q ? emptyHTML("search-x", "Menu tidak ditemukan", `Tidak ada menu dengan kata “${esc(S.q.trim())}”. Coba kata lain, mis. “kopi” atau “nasi”.`, reset)
        : S.avail === "off" ? emptyHTML("circle-check", "Tidak ada menu yang habis", "Semua menu di pilihan ini bisa dipesan pelanggan.", reset)
          : emptyHTML("utensils", "Belum ada menu", "Ubah filter, atau tambahkan menu baru.", reset));
  }
  function renderMenuTab() { renderMenuControls(); renderMenuGrid(); }

  /** Perbarui satu kartu di tempat (switch tetap beranimasi & fokus tidak hilang) */
  function syncMenuCard(m) {
    const card = root.querySelector(".mm-card" + attr("data-id", m.id));
    if (!card) return;
    const on = !!m.is_available;
    card.toggleAttribute("data-off", !on);
    card.querySelector(".mm-avail-txt").textContent = on ? "Tersedia" : "Habis";
    const main = card.querySelector(".mm-card-main");
    main.setAttribute("aria-label", mainLabel(m));
    const b = main.querySelector(".mm-sold");
    if (on && b) b.remove();
    if (!on && !b) main.querySelector(".mm-tile").insertAdjacentHTML("afterend", soldChip);
  }
  function resetFilters() {
    S.q = ""; $("q").value = "";
    S.cat = "all"; S.avail = "all";
    renderMenuTab();
  }

  /* ===== Dialog menu ===== */
  let draft = null;
  function openMenuModal(id, presetCat) {
    const cats = sortedCats();
    if (!cats.length) { toast("Buat kategori dulu sebelum menambah menu"); setTab("kategori"); return; }
    const m = id ? menuById(id) : null;
    draft = {
      id: m ? m.id : null,
      emoji: m ? m.image_url : "🍽️",
      tags: m ? [...(m.tags || [])] : [],
      recipe: m ? recipeOf(m.id).map((r) => ({ ing: r.ingredient_id, qty: fmtNum(r.qty_used) })) : [],
    };
    $("mm-title").textContent = m ? "Ubah menu" : "Tambah menu";
    $("mm-sub").textContent = m ? "Perubahan langsung tampil di aplikasi pelanggan & layar kasir." : "Menu baru langsung tampil di aplikasi pelanggan setelah disimpan.";
    $("f-name").value = m ? m.name : "";
    $("f-cat").innerHTML = cats.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
    $("f-cat").value = m ? m.category_id
      : (presetCat && catById(presetCat)) ? presetCat
        : (S.cat !== "all" && catById(S.cat)) ? S.cat : cats[0].id;
    $("f-price").value = m ? Math.round(m.price).toLocaleString("id-ID") : "";
    $("f-desc").value = m ? (m.desc || "") : "";
    $("f-avail").checked = m ? !!m.is_available : true;
    $("mm-delete").hidden = !m;
    $("mm-save").textContent = m ? "Simpan perubahan" : "Simpan menu";
    ["f-name", "f-cat", "f-price"].forEach(clearErr);
    renderEmojiGrid(); renderTagChips(); renderRecipe(); syncPhoto(); syncDesc(); syncAvailHint();
    $("mm-body").scrollTop = 0;
    open("menu-dlg");
  }
  function renderEmojiGrid() {
    const list = EMOJIS.includes(draft.emoji) ? EMOJIS : [draft.emoji].concat(EMOJIS.slice(0, -1));
    $("emoji-grid").innerHTML = list.map((e) =>
      `<button type="button" data-act="emoji" data-emoji="${esc(e)}" aria-pressed="${e === draft.emoji}" aria-label="Pakai ikon ${esc(e)}">${esc(e)}</button>`).join("");
  }
  function renderTagChips() {
    $("tag-chips").innerHTML = TAG_LIST.map((t) =>
      `<button type="button" class="mm-chip" data-act="tag" data-tag="${t}" data-tone="${TAG_TONE[t]}" aria-pressed="${draft.tags.includes(t)}"><i aria-hidden="true"></i>${t}<iconify-icon class="mm-chk" icon="lucide:check" aria-hidden="true" style="font-size:14px"></iconify-icon></button>`).join("");
  }
  function syncPhoto() { $("photo-emoji").textContent = draft.emoji; }
  function syncDesc() { $("desc-count").textContent = $("f-desc").value.length; }
  function syncAvailHint() {
    $("avail-hint").textContent = $("f-avail").checked ? "Pelanggan bisa memesan menu ini." : "Tampil sebagai “Habis” — pelanggan tidak bisa memesannya.";
  }

  /* ----- Resep ----- */
  function recMeta(ing) {
    if (!ing) return "Pilih bahan dari daftar stok";
    const [tone, label] = STOCK[stockStatus(ing)];
    return `<span>Stok ${esc(fmtQty(ing.stock_qty, ing.unit))}</span><span aria-hidden="true">·</span><span class="mm-st" data-tone="${tone}">${label}</span>`;
  }
  function renderRecipe() {
    const opts = ingSorted();
    $("rec-list").innerHTML = draft.recipe.map((r, i) => {
      const ing = ingById(r.ing);
      return `<div class="mm-rec-row" data-i="${i}">
        <div class="mm-rec-ing">
          <select class="l-staf-select" data-rec="ing" aria-label="Bahan ke-${i + 1}" aria-describedby="menu-meja-rec-err-${i}">
            <option value="">Pilih bahan…</option>
            ${opts.map((x) => `<option value="${esc(x.id)}"${x.id === r.ing ? " selected" : ""}>${esc(x.name)}${stockStatus(x) === "HABIS" ? " (stok habis)" : ""}</option>`).join("")}
          </select>
          <span class="mm-rec-meta">${recMeta(ing)}</span>
        </div>
        <div class="l-staf-affix mm-rec-qty"><input type="text" inputmode="decimal" autocomplete="off" data-rec="qty" value="${esc(r.qty)}" placeholder="0" aria-label="Jumlah bahan ke-${i + 1} per porsi" aria-describedby="menu-meja-rec-err-${i}"><span class="mm-rec-unit">${ing ? esc(ing.unit) : "satuan"}</span></div>
        <button type="button" class="l-staf-iconbtn mm-rec-del" data-act="rec-del" aria-label="Hapus bahan ke-${i + 1}" title="Hapus bahan">${icon("trash-2", 16)}</button>
        <p class="l-staf-error mm-rec-err" id="menu-meja-rec-err-${i}" hidden></p>
      </div>`;
    }).join("");
    $("rec-head").hidden = !draft.recipe.length;
    $("rec-count").textContent = draft.recipe.length ? `${draft.recipe.length} bahan` : "Belum ada bahan";
    syncCapacity();
  }
  function clearRowErr(row) {
    row.querySelectorAll("[aria-invalid]").forEach((x) => x.removeAttribute("aria-invalid"));
    const er = row.querySelector(".mm-rec-err");
    er.hidden = true; er.textContent = "";
  }
  /** Perkiraan porsi yang masih bisa dibuat dari stok sekarang */
  function syncCapacity() {
    const el = $("rec-cap");
    const rows = draft.recipe.map((r) => ({ ing: ingById(r.ing), qty: parseQty(r.qty) })).filter((r) => r.ing && r.qty > 0);
    if (!rows.length) {
      el.dataset.tone = "";
      el.innerHTML = `${icon("sticky-note", 15)}<span>Belum ada bahan. Menu tanpa resep tidak mengurangi stok saat terjual.</span>`;
      return;
    }
    let min = Infinity, lim = null;
    rows.forEach((r) => { const n = Math.floor(r.ing.stock_qty / r.qty); if (n < min) { min = n; lim = r.ing; } });
    if (min <= 0) {
      el.dataset.tone = "danger";
      el.innerHTML = `${icon("triangle-alert", 15)}<span>Stok <b>${esc(lim.name)}</b> ${stockStatus(lim) === "HABIS" ? "habis" : "tidak cukup"} — menu ini belum bisa dibuat. Tandai habis atau catat bahan masuk di Stok Bahan.</span>`;
    } else {
      el.dataset.tone = min < 10 ? "warning" : "";
      el.innerHTML = `${icon(min < 10 ? "triangle-alert" : "package", 15)}<span>Dengan stok sekarang, cukup untuk ± <b>${min.toLocaleString("id-ID")} porsi</b> lagi (paling cepat habis: ${esc(lim.name)}).</span>`;
    }
  }

  function validateMenu() {
    ["f-name", "f-cat", "f-price"].forEach(clearErr);
    const bad = [];
    const name = $("f-name").value.trim().replace(/\s+/g, " ");
    if (!name) bad.push(setErr("f-name", "Nama menu wajib diisi."));
    else if (S.menus.some((m) => m.id !== draft.id && m.name.trim().toLowerCase() === name.toLowerCase()))
      bad.push(setErr("f-name", `Sudah ada menu bernama “${name}”. Pakai nama lain.`));
    if (!catById($("f-cat").value)) bad.push(setErr("f-cat", "Pilih kategori."));
    const price = Number(String($("f-price").value).replace(/\D/g, "")) || 0;
    if (price <= 0) bad.push(setErr("f-price", "Isi harga lebih dari Rp 0."));

    const seen = new Set();
    $$('[data-part="rec-list"] .mm-rec-row').forEach((row) => {
      clearRowErr(row);
      const r = draft.recipe[Number(row.dataset.i)];
      const q = parseQty(r.qty);
      let msg = "", field = null;
      if (!r.ing) { msg = "Pilih bahan, atau hapus baris ini."; field = row.querySelector("select"); }
      else if (seen.has(r.ing)) { msg = `${ingById(r.ing).name} sudah ada di resep — gabungkan jumlahnya di satu baris.`; field = row.querySelector("select"); }
      else if (!(q > 0)) { msg = `Isi jumlah ${ingById(r.ing).unit} per porsi (lebih dari 0).`; field = row.querySelector("input"); }
      if (r.ing) seen.add(r.ing);
      if (msg) {
        field.setAttribute("aria-invalid", "true");
        if (field.tagName === "INPUT") field.closest(".l-staf-affix").setAttribute("aria-invalid", "true");
        const er = row.querySelector(".mm-rec-err");
        er.textContent = msg; er.hidden = false;
        bad.push(field);
      }
    });
    return { bad, name, price };
  }

  function saveMenu(e) {
    e.preventDefault();
    const { bad, name, price } = validateMenu();
    if (bad.length) { bad[0].focus(); toast("Periksa lagi isian yang ditandai merah"); return; }
    const isNew = !draft.id;
    const data = {
      name, category_id: $("f-cat").value, price,
      desc: $("f-desc").value.trim(),
      image_url: draft.emoji,
      tags: TAG_LIST.filter((t) => draft.tags.includes(t)),
      is_available: $("f-avail").checked,
    };
    let m;
    if (isNew) {
      m = Object.assign({ id: uid("n") }, data, { created_at: new Date().toISOString() });
      S.menus.push(m);
      // pastikan menu baru terlihat
      S.q = ""; $("q").value = ""; S.avail = "all";
      if (S.cat !== "all" && S.cat !== m.category_id) S.cat = m.category_id;
    } else {
      m = menuById(draft.id);
      Object.assign(m, data);
    }
    // Resep: ganti seluruh baris recipe_items milik menu ini
    S.recipe = S.recipe.filter((r) => r.menu_id !== m.id);
    draft.recipe.forEach((r) => S.recipe.push({ id: uid("r"), menu_id: m.id, ingredient_id: r.ing, qty_used: parseQty(r.qty) }));

    close("menu-dlg");
    renderAll();
    const card = root.querySelector(".mm-card" + attr("data-id", m.id));
    if (card) {
      card.querySelector(".mm-card-main").focus({ preventScroll: true });
      card.scrollIntoView({ block: "nearest", behavior: reduceMotion() ? "auto" : "smooth" });
      markCurrent(card);
    }
    toast(isNew ? `“${m.name}” ditambahkan ke ${catById(m.category_id).name}` : `Perubahan “${m.name}” disimpan`);
  }

  function deleteMenu() {
    const m = draft && menuById(draft.id);
    if (!m) return;
    const n = recipeOf(m.id).length;
    confirmAction({
      title: `Hapus “${m.name}”?`,
      body: `Menu ini akan hilang dari aplikasi pelanggan dan layar kasir${n ? `, beserta resepnya (${n} bahan)` : ""}. Riwayat penjualan tetap tersimpan.<br><br><b>Hanya habis sementara?</b> Cukup matikan “Tersedia” — menu tetap tampil sebagai “Habis”.`,
      ok: "Ya, hapus menu", ico: "trash-2",
      onOk() {
        close("menu-dlg");
        S.menus = S.menus.filter((x) => x !== m);
        S.recipe = S.recipe.filter((r) => r.menu_id !== m.id);
        renderAll();
        toast(`“${m.name}” dihapus dari menu`);
      },
    });
  }

  /* ===== Tab Kategori ===== */
  function renderCatTab(markId) {
    const cats = sortedCats();
    $("cat-list").innerHTML = cats.length ? cats.map((c, i) => {
      const ms = menusIn(c.id);
      const off = ms.filter((m) => !m.is_available).length;
      const n = esc(c.name), id = esc(c.id);
      const locked = ms.length > 0;
      const why = `Masih berisi ${ms.length} menu — pindahkan atau hapus menunya dulu`;
      return `<li class="mm-cat-row" data-id="${id}">
        <span class="mm-cat-pos" aria-hidden="true">${i + 1}</span>
        <span class="l-staf-thumb" aria-hidden="true">${esc(ms[0] ? ms[0].image_url : "🍽️")}</span>
        <div class="mm-cat-info"><strong>${n}</strong><small>${ms.length ? `${ms.length} menu${off ? ` · ${off} habis` : ""}` : "Belum ada menu"}</small></div>
        <div class="mm-cat-acts">
          <button type="button" class="l-staf-iconbtn" data-act="cat-up" data-id="${id}" aria-label="Naikkan ${n}" title="Naikkan"${i === 0 ? " disabled" : ""}>${icon("arrow-up", 16)}</button>
          <button type="button" class="l-staf-iconbtn" data-act="cat-down" data-id="${id}" aria-label="Turunkan ${n}" title="Turunkan"${i === cats.length - 1 ? " disabled" : ""}>${icon("arrow-down", 16)}</button>
          <span class="mm-vsep" aria-hidden="true"></span>
          <button type="button" class="l-staf-iconbtn" data-act="edit-cat" data-id="${id}" aria-label="Ubah nama ${n}" title="Ubah nama">${icon("pencil", 16)}</button>
          <button type="button" class="l-staf-iconbtn mm-del" data-act="del-cat" data-id="${id}"${locked
            ? ` aria-disabled="true" aria-label="Hapus ${n} — tidak bisa, ${esc(why.toLowerCase())}" title="${esc(why)}"`
            : ` aria-label="Hapus ${n}" title="Hapus kategori"`}>${icon("trash-2", 16)}</button>
        </div>
      </li>`;
    }).join("") : '<li class="mm-cat-empty">Belum ada kategori. Tambahkan minimal satu supaya menu bisa dikelompokkan.</li>';
    if (markId) markCurrent(root.querySelector(".mm-cat-row" + attr("data-id", markId)));
    renderPreview();
  }

  function moveCat(id, dir) {
    const cats = sortedCats();
    const i = cats.findIndex((c) => c.id === id), j = i + dir;
    if (i < 0 || j < 0 || j >= cats.length) return;
    const tmp = cats[i].sort_order; cats[i].sort_order = cats[j].sort_order; cats[j].sort_order = tmp;
    normalizeSort();
    renderCatTab(id);
    renderMenuTab(); // urutan filter & seksi ikut berubah
    const row = root.querySelector(".mm-cat-row" + attr("data-id", id));
    if (row) {
      const same = row.querySelector(`[data-act="${dir < 0 ? "cat-up" : "cat-down"}"]`);
      const other = row.querySelector(`[data-act="${dir < 0 ? "cat-down" : "cat-up"}"]`);
      (same && !same.disabled ? same : other).focus();
    }
    toast(`Urutan disimpan — ${catById(id).name} kini di posisi ${j + 1}`);
  }

  function deleteCat(id) {
    const c = catById(id);
    if (!c) return;
    const n = menusIn(id).length;
    if (n) { toast(`“${c.name}” masih berisi ${n} menu — pindahkan atau hapus menunya dulu`); return; }
    confirmAction({
      title: `Hapus kategori “${c.name}”?`,
      body: "Kategori ini kosong, jadi aman dihapus. Tabnya akan hilang dari aplikasi pelanggan.",
      ok: "Hapus kategori", ico: "trash-2",
      onOk() {
        S.categories = S.categories.filter((x) => x !== c);
        normalizeSort();
        if (S.cat === id) S.cat = "all";
        if (S.pCat === id) S.pCat = "all";
        renderAll();
        toast(`Kategori “${c.name}” dihapus`);
      },
    });
  }

  /* ----- Pratinjau aplikasi pelanggan (meniru halaman Menu Pelanggan) ----- */
  function renderPreview() {
    const cats = sortedCats();
    if (S.pCat !== "all" && !catById(S.pCat)) S.pCat = "all";
    const tabs = [{ id: "all", name: "Semua", n: S.menus.length }].concat(cats.map((c) => ({ id: c.id, name: c.name, n: menusIn(c.id).length })));
    $("ph-tabs").innerHTML = tabs.map((t) =>
      `<button type="button" class="mm-ph-tab" data-act="p-cat" data-cat="${esc(t.id)}" aria-pressed="${S.pCat === t.id}">${esc(t.name)}<small>${t.n}</small></button>`).join("");
    const shown = S.pCat === "all" ? cats : cats.filter((c) => c.id === S.pCat);
    const html = shown.map((c) => {
      // Seperti di halaman pelanggan: menu tersedia di atas, menu habis di bawah
      const items = menusIn(c.id).sort((a, b) => b.is_available - a.is_available);
      if (!items.length) return "";
      const lim = S.pCat === "all" ? 3 : items.length;
      return `<div class="mm-ph-sec"><p class="mm-ph-h">${esc(c.name)}<span>${items.length} menu</span></p>
        ${items.slice(0, lim).map((m) => `<div class="mm-ph-item"${m.is_available ? "" : " data-off"}>
          <span class="mm-ph-thumb" aria-hidden="true">${esc(m.image_url)}</span>
          <span class="mm-ph-txt"><b>${esc(m.name)}</b><i>${rp(m.price)}</i></span>
          ${m.is_available ? `<span class="mm-ph-add" aria-hidden="true">${icon("plus", 13)}</span>` : '<span class="mm-ph-so">Habis</span>'}
        </div>`).join("")}
        ${items.length > lim ? `<p class="mm-ph-more">+${items.length - lim} menu lainnya</p>` : ""}
      </div>`;
    }).join("");
    $("ph-list").innerHTML = html || '<p class="mm-ph-empty">Belum ada menu di kategori ini.</p>';
  }

  /* ----- Dialog kategori ----- */
  let catEditId = null;
  function openCatModal(id) {
    const c = id ? catById(id) : null;
    catEditId = c ? c.id : null;
    $("ct-title").textContent = c ? "Ubah kategori" : "Tambah kategori";
    $("ct-save").textContent = c ? "Simpan" : "Tambah kategori";
    $("c-name").value = c ? c.name : "";
    clearErr("c-name");
    syncCatPreview();
    open("cat-dlg");
  }
  function syncCatPreview() {
    const name = $("c-name").value.trim() || "Nama kategori";
    const first = catEditId ? menusIn(catEditId)[0] : null;
    $("cat-prev").innerHTML = `<span class="l-staf-thumb" aria-hidden="true">${esc(first ? first.image_url : "🍽️")}</span>
      <div class="mm-grow"><span class="mm-pill-prev">${esc(name)}</span><small>Begini tampilannya di aplikasi pelanggan.</small></div>`;
  }
  function saveCat(e) {
    e.preventDefault();
    clearErr("c-name");
    const name = $("c-name").value.trim().replace(/\s+/g, " ");
    if (!name) { setErr("c-name", "Nama kategori wajib diisi.").focus(); return; }
    if (S.categories.some((c) => c.id !== catEditId && c.name.trim().toLowerCase() === name.toLowerCase())) {
      setErr("c-name", `Sudah ada kategori bernama “${name}”.`).focus(); return;
    }
    let c, msg;
    const editing = catEditId;
    if (editing) {
      c = catById(editing);
      const old = c.name;
      c.name = name;
      msg = old !== name ? `“${old}” diganti jadi “${name}”` : `Kategori “${name}” disimpan`;
    } else {
      c = { id: uid("c"), name, sort_order: Math.max(0, ...S.categories.map((x) => x.sort_order)) + 1 };
      S.categories.push(c);
      msg = `Kategori “${name}” ditambahkan di urutan terakhir`;
    }
    close("cat-dlg");
    renderHead(); renderMenuTab(); renderCatTab(c.id); renderTableTab();
    if (editing) root.querySelector(".mm-cat-row" + attr("data-id", c.id) + ' [data-act="edit-cat"]')?.focus({ preventScroll: true });
    toast(msg);
  }

  /* ===== Tab Meja & QR ===== */
  function areaList() {
    const s = new Set(AREA_ORDER);
    S.tables.forEach((t) => { if (t.area) s.add(t.area); });
    return [...s];
  }
  const tBadges = (t) => (t.is_active ? '<span class="l-staf-chip" data-tone="positive">Aktif</span>' : '<span class="l-staf-chip" data-tone="plain">Nonaktif</span>')
    + (S.needsPrint.has(t.id) ? '<span class="l-staf-chip" data-tone="warning">Belum dicetak</span>' : "");

  function tableCardHTML(t) {
    const id = esc(t.id), no = esc(t.table_number);
    return `<article class="mm-tcard" data-id="${id}"${t.is_active ? "" : " data-off"}>
      <div class="mm-tc-top">
        <div class="mm-tc-info">
          <span class="mm-tc-label">Meja</span>
          <strong class="mm-tc-no">${no}</strong>
          <span class="mm-tc-area">Area ${esc(t.area || "—")}</span>
          <span class="mm-tc-badges">${tBadges(t)}</span>
        </div>
        <button type="button" class="mm-tc-qr" data-act="qr" data-id="${id}" aria-label="Lihat QR Meja ${no}" title="Lihat QR">${fakeQR(t.qr_code, 92, true)}</button>
      </div>
      <div class="mm-tc-foot">
        <button type="button" class="l-staf-btn" data-size="sm" data-act="qr" data-id="${id}">${icon("qr-code", 16)}Lihat QR</button>
        <div class="mm-avail">
          <label class="mm-avail-txt" for="menu-meja-ta-${id}">${t.is_active ? "Aktif" : "Nonaktif"}</label>
          <label class="l-staf-switch"><input type="checkbox" role="switch" id="menu-meja-ta-${id}" data-toggle="table" data-id="${id}"${t.is_active ? " checked" : ""} aria-label="Meja ${no} aktif"><span></span></label>
        </div>
      </div>
    </article>`;
  }
  function renderTableChips() {
    const off = S.tables.filter((t) => !t.is_active).length;
    const chips = [["all", "Semua", S.tables.length]]
      .concat(areaList().map((a) => [a, a, S.tables.filter((t) => t.area === a).length]))
      .concat([["off", "Nonaktif", off]]);
    $("table-seg").innerHTML = chips.map(([v, l, n]) =>
      `<button type="button" data-act="f-table" data-v="${esc(v)}" aria-pressed="${S.tFilter === v}">${esc(l)}<small>${n}</small></button>`).join("");
  }
  function renderTableGrid(markId) {
    const f = S.tFilter;
    const list = sortedTables().filter((t) => f === "all" || (f === "off" ? !t.is_active : t.area === f));
    let html = list.map(tableCardHTML).join("");
    if (f !== "off") html += `<button type="button" class="mm-add" data-tall data-act="add-table"><span class="mm-add-plus">${icon("plus", 20)}</span><strong>Tambah meja</strong><small>QR unik dibuat otomatis</small></button>`;
    else if (!list.length) html = emptyHTML("circle-check", "Semua meja aktif", "Tidak ada meja yang sedang dinonaktifkan.", "");
    $("table-grid").innerHTML = html;
    if (markId) markCurrent(root.querySelector(".mm-tcard" + attr("data-id", markId)));
  }
  function renderTableTab(markId) { renderTableChips(); renderTableGrid(markId); }

  /* ----- Kartu QR untuk meja (tent card) ----- */
  function tentHTML(t) {
    return `<div class="mm-tent">
      <div class="mm-tent-brand"><span class="mm-tent-logo">${esc(cafeInitials())}</span>${esc(SETTINGS.cafe_name)}</div>
      <div class="mm-tent-no"><span>Meja</span>${esc(t.table_number)}</div>
      <div class="mm-tent-qr">${fakeQR(t.qr_code, 200)}</div>
      <p class="mm-tent-cta">Scan untuk lihat menu &amp; pesan</p>
      <p class="mm-tent-sub">Tanpa install aplikasi · Bayar di kasir</p>
      <p class="mm-tent-url">${esc(tableUrl(t))}</p>
    </div>`;
  }
  /** Kartu-kartu QR yang dicetak (2 per baris di A4). Gaya .mm-tent/.mm-sheet ada di CSS halaman;
      PRINT_CSS (disisipkan sementara saat mencetak) membuat area cetak mengalir normal supaya banyak kartu bisa pindah halaman. */
  const PRINT_CSS = `
    @page { size: A4; margin: 10mm; }
    @media print {
      html[data-l-staf-printing], html[data-l-staf-printing] body { background: #fff !important; }
      html[data-l-staf-printing] body *:not(:has(.mm-sheet)):not(.mm-sheet):not(.mm-sheet *) { display: none !important; }
      html[data-l-staf-printing] body *:has(.mm-sheet) { display: block !important; position: static !important; inset: auto !important; width: auto !important; height: auto !important; min-height: 0 !important; max-height: none !important; margin: 0 !important; padding: 0 !important; border: 0 !important; overflow: visible !important; background: none !important; transform: none !important; animation: none !important; }
    }`;
  const printSheet = (list) => printHTML(`<div class="mm-sheet">${list.map(tentHTML).join("")}</div>`, PRINT_CSS);

  let qrId = null;
  function openQR(id) {
    if (!tableById(id)) return;
    qrId = id;
    renderQR();
    open("qr-dlg");
  }
  function renderQR() {
    const t = tableById(qrId);
    if (!t) return;
    $("qr-title").textContent = `QR Meja ${t.table_number}`;
    $("qr-card").innerHTML = tentHTML(t);
    $("qr-token").textContent = t.qr_code;
    $("qr-open").href = tableHash(t);
    $("qr-warn").innerHTML = !t.is_active
      ? `<div class="l-staf-alert" data-tone="warning">${icon("triangle-alert", 18)}<span>Meja ini <b>nonaktif</b>. QR tetap bisa dicetak, tapi pelanggan baru bisa memesan setelah meja diaktifkan lagi.</span></div>`
      : S.needsPrint.has(t.id)
        ? `<div class="l-staf-alert">${icon("printer", 18)}<span>QR ini <b>belum dicetak</b>. Cetak, lalu ganti kartu lama di meja.</span></div>`
        : "";
  }
  function printOne() {
    const t = tableById(qrId);
    if (!t) return;
    toast(`Membuka dialog cetak — QR Meja ${t.table_number}`);
    later(() => {
      printSheet([t]);
      S.needsPrint.delete(t.id);
      renderQR();
      renderTableGrid();
    }, 120);
  }
  function printAll() {
    const list = sortedTables().filter((t) => t.is_active);
    if (!list.length) { toast("Belum ada meja aktif untuk dicetak"); return; }
    toast(`Membuka dialog cetak — ${list.length} kartu QR meja aktif`);
    later(() => {
      printSheet(list);
      list.forEach((t) => S.needsPrint.delete(t.id));
      renderTableGrid();
    }, 120);
  }
  function regenQR() {
    const t = tableById(qrId);
    if (!t) return;
    confirmAction({
      title: `Buat ulang QR Meja ${t.table_number}?`,
      body: "QR lama yang sudah tertempel di meja akan <b>langsung berhenti berfungsi</b>. Setelah ini, cetak QR baru dan ganti kartu di meja supaya pelanggan tetap bisa memesan.",
      ok: "Ya, buat QR baru", ico: "refresh-cw",
      onOk() {
        t.qr_code = newToken();
        S.needsPrint.add(t.id);
        renderQR();
        renderTableGrid();
        toast(`QR Meja ${t.table_number} diperbarui — cetak & ganti kartu lamanya`);
      },
    });
  }

  /* ----- Dialog tambah meja ----- */
  function openTableModal() {
    const nums = S.tables.map((t) => parseInt(t.table_number, 10)).filter((n) => !isNaN(n));
    $("t-no").value = String((nums.length ? Math.max(...nums) : 0) + 1).padStart(2, "0");
    const areas = areaList();
    $("t-area").innerHTML = areas.map((a) => `<option value="${esc(a)}">${esc(a)}</option>`).join("");
    $("t-area").value = areas.includes(S.tFilter) ? S.tFilter : areas[0];
    clearErr("t-no");
    syncTableHint();
    open("table-dlg");
    $("t-no").select();
  }
  function syncTableHint() {
    const v = normTableNo($("t-no").value);
    $("t-hint").textContent = v && /^[A-Z0-9-]{1,6}$/.test(v) ? `Akan tampil sebagai “Meja ${v}”. Angka otomatis jadi 2 digit.` : "Angka otomatis jadi 2 digit, mis. 7 → 07.";
  }
  function saveTable(e) {
    e.preventDefault();
    clearErr("t-no");
    const no = normTableNo($("t-no").value);
    const area = $("t-area").value;
    let msg = "";
    if (!no) msg = "Nomor meja wajib diisi.";
    else if (!/^[A-Z0-9-]{1,6}$/.test(no)) msg = "Pakai huruf, angka, atau tanda “-”, maksimal 6 karakter.";
    else if (/^0+$/.test(no)) msg = "Nomor meja tidak boleh 0.";
    else if (S.tables.some((t) => t.table_number.toUpperCase() === no)) msg = `Meja ${no} sudah ada. Pakai nomor lain.`;
    if (msg) { setErr("t-no", msg).focus(); return; }

    const t = { id: uid("t"), table_number: no, qr_code: newToken(), is_active: true, area };
    S.tables.push(t);
    S.needsPrint.add(t.id);
    if (S.tFilter !== "all" && S.tFilter !== area) S.tFilter = "all";
    close("table-dlg");
    renderHead();
    renderTableTab(t.id);
    root.querySelector(".mm-tcard" + attr("data-id", t.id))?.scrollIntoView({ block: "nearest", behavior: reduceMotion() ? "auto" : "smooth" });
    toast(`Meja ${no} ditambahkan — QR-nya siap dicetak`);
  }

  /* ===== Konfirmasi (dialog native bertumpuk di atas dialog lain) ===== */
  let cfAction = null;
  function confirmAction(o) {
    $("cf-title").textContent = o.title;
    $("cf-body").innerHTML = o.body;
    $("cf-ok").innerHTML = icon(o.ico || "triangle-alert", 16) + esc(o.ok);
    $("cf-ico").innerHTML = icon(o.ico || "triangle-alert", 20);
    cfAction = o.onOk;
    open("cf-dlg");
  }

  /* ===== Render semua ===== */
  function renderAll() {
    renderHead();
    renderMenuTab();
    renderCatTab();
    renderTableTab();
  }

  /* ===== Event ===== */
  // Kembalikan fokus ke tombol filter setelah daftar dirender ulang (pengguna keyboard)
  function refocusLike(el) {
    let s = `[data-act="${el.dataset.act}"]`;
    if (el.dataset.cat != null) s += attr("data-cat", el.dataset.cat);
    if (el.dataset.v != null) s += attr("data-v", el.dataset.v);
    root.querySelector(s)?.focus({ preventScroll: true });
  }
  function onAct(e) {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    const hadFocus = document.activeElement === el;
    switch (act) {
      case "tab": setTab(el.dataset.tab); break;

      case "add-menu": openMenuModal(null, el.dataset.cat); break;
      case "edit-menu": openMenuModal(id); break;
      case "f-cat": S.cat = el.dataset.cat; renderMenuTab(); if (hadFocus) refocusLike(el); break;
      case "f-avail": S.avail = el.dataset.v; renderMenuTab(); if (hadFocus) refocusLike(el); break;
      case "reset": resetFilters(); $("q").focus(); break;
      case "mark-risky": {
        const risky = S.menus.filter((m) => m.is_available && outIngs(m).length);
        risky.forEach((m) => { m.is_available = false; });
        renderAll();
        toast(risky.length === 1 ? `${risky[0].name} ditandai habis — pelanggan tidak bisa memesannya` : `${risky.length} menu ditandai habis`);
        break;
      }

      case "emoji":
        draft.emoji = el.dataset.emoji;
        $$('[data-part="emoji-grid"] button').forEach((b) => b.setAttribute("aria-pressed", b === el));
        syncPhoto();
        break;
      case "tag": {
        const t = el.dataset.tag;
        draft.tags = draft.tags.includes(t) ? draft.tags.filter((x) => x !== t) : draft.tags.concat(t);
        el.setAttribute("aria-pressed", draft.tags.includes(t));
        break;
      }
      case "upload": toast("Prototipe: unggah foto belum aktif — pakai ikon dulu, ya"); break;
      case "rec-add": {
        draft.recipe.push({ ing: "", qty: "" });
        renderRecipe();
        const rows = $$('[data-part="rec-list"] .mm-rec-row');
        rows[rows.length - 1].querySelector("select").focus();
        break;
      }
      case "rec-del": {
        const i = Number(el.closest(".mm-rec-row").dataset.i);
        draft.recipe.splice(i, 1);
        renderRecipe();
        const rows = $$('[data-part="rec-list"] .mm-rec-row');
        const next = rows[i] || rows[i - 1];
        if (next) next.querySelector("select").focus();
        else $("rec-add").focus();
        break;
      }

      case "add-cat": openCatModal(); break;
      case "edit-cat": openCatModal(id); break;
      case "del-cat": deleteCat(id); break;
      case "cat-up": moveCat(id, -1); break;
      case "cat-down": moveCat(id, 1); break;
      case "p-cat": S.pCat = el.dataset.cat; renderPreview(); if (hadFocus) refocusLike(el); break;

      case "f-table": S.tFilter = el.dataset.v; renderTableTab(); if (hadFocus) refocusLike(el); break;
      case "add-table": openTableModal(); break;
      case "print-all": printAll(); break;
      case "qr": openQR(id); break;
    }
  }
  root.addEventListener("click", onAct, { signal });
  actions?.addEventListener("click", onAct, { signal });

  // Switch ketersediaan menu & status meja (diperbarui di tempat)
  root.addEventListener("change", (e) => {
    const el = e.target;
    if (el.dataset.toggle === "menu") {
      const m = menuById(el.dataset.id);
      if (!m) return;
      m.is_available = el.checked;
      syncMenuCard(m);
      renderHead(); renderMenuControls(); renderCatTab();
      const outs = outIngs(m);
      toast(!m.is_available ? `${m.name} ditandai habis — pelanggan tidak bisa memesannya`
        : outs.length ? `${m.name} tersedia lagi — tapi stok ${outs[0].name} masih habis`
          : `${m.name} tersedia lagi — pelanggan bisa memesannya`);
    } else if (el.dataset.toggle === "table") {
      const t = tableById(el.dataset.id);
      if (!t) return;
      t.is_active = el.checked;
      const card = el.closest(".mm-tcard");
      card.toggleAttribute("data-off", !t.is_active);
      card.querySelector(".mm-avail-txt").textContent = t.is_active ? "Aktif" : "Nonaktif";
      card.querySelector(".mm-tc-badges").innerHTML = tBadges(t);
      renderHead(); renderTableChips();
      toast(t.is_active ? `Meja ${t.table_number} aktif — pelanggan bisa pesan lewat QR-nya` : `Meja ${t.table_number} nonaktif — QR-nya tidak bisa dipakai memesan`);
    } else if (el.dataset.rec === "ing") {
      const row = el.closest(".mm-rec-row");
      const r = draft.recipe[Number(row.dataset.i)];
      r.ing = el.value;
      const ing = ingById(r.ing);
      row.querySelector(".mm-rec-unit").textContent = ing ? ing.unit : "satuan";
      row.querySelector(".mm-rec-meta").innerHTML = recMeta(ing);
      clearRowErr(row);
      syncCapacity();
    } else if (el.dataset.part === "f-cat") clearErr("f-cat");
    else if (el.dataset.part === "f-avail") syncAvailHint();
  }, { signal });

  root.addEventListener("input", (e) => {
    const el = e.target, part = el.dataset.part;
    if (part === "q") { S.q = el.value; renderMenuGrid(); }
    else if (part === "f-name") clearErr("f-name");
    else if (part === "f-desc") syncDesc();
    else if (part === "f-price") {
      // Format ribuan saat mengetik (32000 → 32.000) tanpa membuat kursor melompat
      const pos = el.selectionStart || 0;
      const before = el.value.slice(0, pos).replace(/\D/g, "").length;
      const d = el.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "").slice(0, 9);
      el.value = d ? Number(d).toLocaleString("id-ID") : "";
      let i = 0, seen = 0;
      while (i < el.value.length && seen < before) { if (/\d/.test(el.value[i])) seen++; i++; }
      try { el.setSelectionRange(i, i); } catch {}
      clearErr("f-price");
    }
    else if (el.dataset.rec === "qty") {
      const row = el.closest(".mm-rec-row");
      draft.recipe[Number(row.dataset.i)].qty = el.value;
      clearRowErr(row);
      syncCapacity();
    }
    else if (part === "c-name") { clearErr("c-name"); syncCatPreview(); }
    else if (part === "t-no") { clearErr("t-no"); syncTableHint(); }
  }, { signal });

  // Tab: panah kiri/kanan, Home, End
  $("tabs").addEventListener("keydown", (e) => {
    const i = TABS.indexOf(S.tab);
    const map = { ArrowRight: (i + 1) % TABS.length, ArrowLeft: (i - 1 + TABS.length) % TABS.length, Home: 0, End: TABS.length - 1 };
    if (!(e.key in map)) return;
    e.preventDefault();
    setTab(TABS[map[e.key]], true);
  }, { signal });

  // Form
  $("menu-form").addEventListener("submit", saveMenu, { signal });
  $("mm-delete").addEventListener("click", deleteMenu, { signal });
  $("cat-form").addEventListener("submit", saveCat, { signal });
  $("table-form").addEventListener("submit", saveTable, { signal });
  $("qr-print").addEventListener("click", printOne, { signal });
  $("qr-regen").addEventListener("click", regenQR, { signal });
  $("cf-ok").addEventListener("click", () => { const fn = cfAction; cfAction = null; close("cf-dlg"); fn?.(); }, { signal });

  // Zona unggah foto (prototipe: hanya memberi tahu)
  const dz = $("drop");
  ["dragenter", "dragover"].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.dataset.over = ""; }, { signal }));
  ["dragleave", "drop"].forEach((ev) => dz.addEventListener(ev, (e) => {
    e.preventDefault();
    delete dz.dataset.over;
    if (ev === "drop") toast("Prototipe: unggah foto belum aktif — pakai ikon dulu, ya");
  }, { signal }));
  // Jangan biarkan berkas yang dijatuhkan di luar zona membuka tab baru
  ["dragover", "drop"].forEach((ev) => addEventListener(ev, (e) => {
    if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault();
  }, { signal }));

  // Peran berubah di tab lain (prototipe)
  addEventListener("storage", (e) => { if (e.key === KEYS.role) applyRole(); }, { signal });

  /* ===== Mulai ===== */
  $("ph-logo").textContent = cafeInitials();
  $("ph-name").textContent = SETTINGS.cafe_name;
  $("ph-addr").textContent = SETTINGS.address;
  $("q").value = S.q;
  renderAll();
  setTab(S.tab);
  applyRole();
</script>
