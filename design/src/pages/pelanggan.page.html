  .pl-tabs::-webkit-scrollbar { display: none; }
  .pl-tabs button { position: relative; flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 2px; border: 0; background: none; color: var(--color-text-muted); font: 500 15px / 1.2 var(--font-ui); letter-spacing: -0.15px; white-space: nowrap; cursor: pointer; transition: color var(--duration-fast) var(--ease-standard); }

  .pl-tabs button:focus-visible { outline-offset: -3px; border-radius: var(--radius-compact); }
  .pl-tabs button small { font: 600 var(--text-label-sm) / 1 var(--font-ui); color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
  .pl-tabs button[aria-selected="true"] { color: var(--color-text); }
  .pl-tabs button[aria-selected="true"]::after { content: ""; position: absolute; inset-inline: 0; inset-block-end: 0; height: 2px; border-radius: var(--radius-pill); background: var(--color-primary); }

  .pl-sec { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); padding: 22px var(--space-4) 10px; }

  .pl-add { position: absolute; right: var(--space-3); bottom: var(--space-3); display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: var(--border-hairline) solid var(--color-border-strong); border-radius: var(--radius-pill); background: var(--color-surface); color: var(--color-text); cursor: pointer; transition: border-color var(--duration-fast) var(--ease-standard), background-color var(--duration-fast) var(--ease-standard); }

  .pl-empty { display: grid; justify-items: center; gap: 6px; padding: 48px var(--space-6); text-align: center; font: 400 var(--text-body-sm) / 1.5 var(--font-ui); color: var(--color-text-muted); }
  .pl-empty > iconify-icon { font-size: 30px; color: var(--color-text-faint); }

  }

        <span class="pl-cb-total" aria-hidden="true" data-part="cb-total">Rp 0</span>
      </button>
    </div>

    <div class="pl-toast" popover="manual" role="status" data-part="toast"></div>
  </main>
</template>

<script>
  /* ===== Kontrak bersama (CONTRACTS.md — disalin apa adanya) ===== */
  const KEY = { cust: "iulfnb:cust", pos: "iulfnb:pos", live: "iulfnb:orders-live", beat: "iulfnb:kasir-beat", seq: "iulfnb:seq", role: "iulfnb:role" };
  const SEQ_BASE = 107;
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  function nextOrderCode() {
    const n = Math.max(ls.get(KEY.seq, SEQ_BASE), SEQ_BASE) + 1;
    ls.set(KEY.seq, n);
    return "A-" + String(n).padStart(3, "0");
  }
  const kasirOnline = () => Date.now() - ls.get(KEY.beat, 0) < 5000;
  /** Jam operasional (sama dengan halaman Pengaturan): 0 = Minggu … 6 = Sabtu */
  const HOURS = { 0: ["08:00", "22:00"], 1: ["08:00", "22:00"], 2: ["08:00", "22:00"], 3: ["08:00", "22:00"], 4: ["08:00", "22:00"], 5: ["08:00", "22:00"], 6: ["08:00", "23:00"] };
  function isCafeOpen(d = new Date()) {
    const [o, c] = HOURS[d.getDay()] || [];
    if (!o) return false;
    const m = d.getHours() * 60 + d.getMinutes(), t = (s) => +s.slice(0, 2) * 60 + +s.slice(3);
    return m >= t(o) && m < t(c);
  }
  /* A. Sesi pelanggan — localStorage["iulfnb:cust"] */
  const custEmpty = (table = "07") => ({ v: 1, table, invalid_table: null, cart: [], selected: "m1", edit_key: null, order: null, browse_only: false, force_open: false, flash: null, demo: false });
  const custDemo = () => ({ ...custEmpty("07"), demo: true, cart: [
    { key: "m1|tidak pedas", menu_id: "m1", qty: 2, note: "Tidak pedas" },
    { key: "d1|es sedikit", menu_id: "d1", qty: 1, note: "Es sedikit" },
    { key: "s1|", menu_id: "s1", qty: 1, note: "" },
  ] });
  function loadCust(fallback = custEmpty) { const s = ls.get(KEY.cust, null); return s && s.v === 1 ? s : fallback(); }
  function saveCust(s) { s.updated_at = new Date().toISOString(); ls.set(KEY.cust, s); }
  const lineKey = (menuId, note) => menuId + "|" + String(note || "").trim().toLowerCase();
  /* C. Status pesanan pelanggan */
  const STEP_KEYS = ["MENUNGGU", "DIPROSES", "SIAP", "DIANTAR"];
  const SIM_MS = [6000, 13000, 20000]; // simulasi tanpa kasir: Diproses, Siap, Diantar sejak dipesan
  /** Kembalikan { idx 0..3, cancelled, paid } dan perbarui order.times (mutasi; simpan sesi bila berubah) */
  function orderStatus(order) {
    const live = ls.get(KEY.live, []).find((x) => x.code === order.code);
    const created = Date.parse(order.created_at);
    let idx = 0;
    if (!order.driven) idx = SIM_MS.filter((ms) => Date.now() - created >= ms).length;
    if (live) idx = Math.max(idx, Math.min(3, Math.max(0, ["MENUNGGU", "DIPROSES", "SIAP", "DIANTAR", "SELESAI"].indexOf(live.status))));
    const cancelled = live?.status === "DIBATALKAN";
    const paid = live?.payment_status === "LUNAS";
    for (let i = 1; i <= idx; i++) if (!order.times[i]) order.times[i] = !order.driven && i <= SIM_MS.length ? new Date(created + SIM_MS[i - 1]).toISOString() : new Date().toISOString();
    if (live && !order.driven && live.status !== STEP_KEYS[idx] && !cancelled && !["SELESAI"].includes(live.status)) { live.status = STEP_KEYS[idx]; ls.set(KEY.live, ls.get(KEY.live, []).map((x) => x.code === live.code ? live : x)); }
    return { idx, cancelled, paid };
  }

  /* ===== Data tiruan — struktur mengikuti tabel menu_categories, menus & tables di PRD ===== */
  const SETTINGS = { cafe_name: "Kedai Senja", address: "Jl. Kaliurang Km 5, Yogyakarta", tax_percent: 10 };
  const CATEGORIES = [
    { id: "makanan", name: "Makanan", sort_order: 1 },
    { id: "minuman", name: "Minuman", sort_order: 2 },
    { id: "lainnya", name: "Camilan & Lainnya", sort_order: 3 },
  ];
  const MENUS = [
    { id: "m1", category_id: "makanan", name: "Nasi Goreng Kampung", price: 32000, image_url: "https://images.unsplash.com/photo-1680674774705-90b4904b3a7f?w=640&h=640&fit=crop&auto=format&q=75", is_available: true, tags: ["Terlaris"], desc: "Nasi goreng bumbu terasi, telur ceplok, ayam suwir, dan kerupuk udang." },
    { id: "m2", category_id: "makanan", name: "Ayam Geprek Sambal Matah", price: 35000, image_url: "https://images.unsplash.com/photo-1569058242252-623df46b5025?w=640&h=640&fit=crop&auto=format&q=75", is_available: true, tags: ["Pedas"], desc: "Ayam krispi digeprek dengan sambal matah segar dan nasi hangat." },
    { id: "m3", category_id: "makanan", name: "Mie Goreng Jawa", price: 30000, image_url: "https://images.unsplash.com/photo-1645696329525-8ec3bee460a9?w=640&h=640&fit=crop&auto=format&q=75", is_available: true, tags: [], desc: "Mie kuning dimasak di atas arang dengan sayur, telur, dan bawang goreng." },
    { id: "m4", category_id: "makanan", name: "Rice Bowl Chicken Teriyaki", price: 36000, image_url: "https://images.unsplash.com/photo-1636401870585-a8852371e84a?w=640&h=640&fit=crop&auto=format&q=75", is_available: true, tags: ["Baru"], desc: "Potongan ayam saus teriyaki, salad kol, wijen sangrai, dan nasi pulen." },
    { id: "m5", category_id: "makanan", name: "Nasi Ayam Bakar Madu", price: 38000, image_url: "https://images.unsplash.com/photo-1672856399675-8c099efbe0e2?w=640&h=640&fit=crop&auto=format&q=75", is_available: false, tags: [], desc: "Ayam bakar olesan madu, lalapan segar, dan sambal bawang." },
    { id: "d1", category_id: "minuman", name: "Kopi Susu Gula Aren", price: 22000, image_url: "https://images.unsplash.com/photo-1589985902809-39d25db22101?w=640&h=640&fit=crop&auto=format&q=75", is_available: true, tags: ["Terlaris"], desc: "Espresso, susu segar, dan gula aren asli. Tersedia panas atau dingin." },
    { id: "d2", category_id: "minuman", name: "Es Americano", price: 20000, image_url: "https://images.unsplash.com/photo-1581996323441-538096e854b9?w=640&h=640&fit=crop&auto=format&q=75", is_available: true, tags: [], desc: "Double shot espresso dengan air dingin. Ringan, bersih, tanpa gula." },
    { id: "d3", category_id: "minuman", name: "Matcha Latte", price: 28000, image_url: "https://images.unsplash.com/photo-1749280447307-31a68eb38673?w=640&h=640&fit=crop&auto=format&q=75", is_available: true, tags: ["Baru"], desc: "Matcha Jepang premium dengan susu segar yang lembut." },
    { id: "d4", category_id: "minuman", name: "Es Teh Manis", price: 10000, image_url: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=640&h=640&fit=crop&auto=format&q=75", is_available: true, tags: [], desc: "Teh melati diseduh segar setiap pagi." },
    { id: "d5", category_id: "minuman", name: "Lemon Tea", price: 15000, image_url: "https://images.unsplash.com/photo-1758705206938-a196ac3ae3bb?w=640&h=640&fit=crop&auto=format&q=75", is_available: true, tags: [], desc: "Teh hitam dengan perasan lemon segar dan sedikit madu." },
    { id: "d6", category_id: "minuman", name: "Jus Alpukat", price: 25000, image_url: "https://images.unsplash.com/photo-1630252595285-3bbcb51378d8?w=640&h=640&fit=crop&auto=format&q=75", is_available: false, tags: [], desc: "Alpukat mentega dengan susu cokelat kental manis." },
    { id: "s1", category_id: "lainnya", name: "Kentang Goreng", price: 20000, image_url: "https://images.unsplash.com/photo-1518013431117-eb1465fa5752?w=640&h=640&fit=crop&auto=format&q=75", is_available: true, tags: ["Terlaris"], desc: "Kentang goreng renyah dengan saus sambal dan mayones." },
    { id: "s2", category_id: "lainnya", name: "Pisang Goreng Keju", price: 18000, image_url: "https://images.unsplash.com/photo-1762941904142-9d91ca413e66?w=640&h=640&fit=crop&auto=format&q=75", is_available: true, tags: [], desc: "Pisang kepok goreng tepung dengan parutan keju dan susu." },
    { id: "s3", category_id: "lainnya", name: "Roti Bakar Cokelat Keju", price: 22000, image_url: "https://images.unsplash.com/photo-1693835791992-ae0c42f7074d?w=640&h=640&fit=crop&auto=format&q=75", is_available: true, tags: [], desc: "Roti tebal dipanggang mentega, isi cokelat dan keju." },
    { id: "s4", category_id: "lainnya", name: "Croissant Butter", price: 24000, image_url: "https://images.unsplash.com/photo-1691480162735-9b91238080f6?w=640&h=640&fit=crop&auto=format&q=75", is_available: true, tags: [], desc: "Croissant mentega dipanggang setiap pagi." },
    { id: "s5", category_id: "lainnya", name: "Air Mineral", price: 8000, image_url: "https://images.unsplash.com/photo-1616118132534-381148898bb4?w=640&h=640&fit=crop&auto=format&q=75", is_available: true, tags: [], desc: "Air mineral botol 600 ml." },
  ];
  /** Meja 01–12; meja 12 nonaktif (sama dengan halaman Menu & Meja) */
  const TABLES = Array.from({ length: 12 }, (_, i) => { const n = String(i + 1).padStart(2, "0"); return { table_number: n, is_active: n !== "12" }; });
  const POPULAR = ["d1", "m1", "s1", "m2"];
  const STEPS = [
    { icon: "🧾", label: "Pesanan diterima" },
    { icon: "👩‍🍳", label: "Sedang diproses" },
    { icon: "🛎️", label: "Siap diantar" },
    { icon: "🍽️", label: "Sudah diantar" },
  ];
  const TAX_RATE = SETTINGS.tax_percent / 100;
  const MAX_QTY = 50;
  const DAYS = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

  /* ===== Util ===== */
  const $ = (part) => root.querySelector(`[data-part="${part}"]`);
  const $$ = (sel, el = root) => [...el.querySelectorAll(sel)];
  const rp = (n) => "Rp " + Math.round(n).toLocaleString("id-ID");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = (name, size = 18, cls = "") => `<iconify-icon icon="lucide:${name}" aria-hidden="true"${cls ? ` class="${cls}"` : ""} style="font-size:${size}px"></iconify-icon>`;
  const menuById = Object.fromEntries(MENUS.map((m) => [m.id, m]));
  const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const motion = (el, frames, opts = {}) => {
    if (!el?.animate || reduceMotion()) return;
    try { el.animate(frames, { duration: 280, easing: "cubic-bezier(.2,.8,.2,1)", ...opts }); } catch {}
  };
  const dot = (hhmm) => hhmm.replace(":", ".");
  /** Kapan kafe buka lagi: "pukul 08.00" (hari ini), "besok pukul 08.00", atau "Senin pukul 08.00" */
  function nextOpenLabel(now = new Date()) {
    for (let i = 0; i < 8; i++) {
      const d = new Date(now); d.setDate(now.getDate() + i);
      const h = HOURS[d.getDay()];
      if (!h) continue;
      d.setHours(+h[0].slice(0, 2), +h[0].slice(3), 0, 0);
      if (d > now) return `${i === 0 ? "" : i === 1 ? "besok " : DAYS[d.getDay()] + " "}pukul ${dot(h[0])}`;
    }
    return "pukul 08.00";
  }
  /** Navigasi antarhalaman (router hash). replace = tanpa entri riwayat baru (pengalihan otomatis). */
  function go(hash, replace) {
    if (replace) { try { location.replace(hash); return; } catch {} }
    location.hash = hash;
  }

  /* ===== State halaman (bertahan saat pindah halaman) + sesi pelanggan ===== */
  const S = root.pelangganState ??= { cat: "all", q: "", searchSeen: false, restore: false, scrollY: 0, lastOpen: null, trackSig: null };
  let c = loadCust();
  const blocked = () => !!c.browse_only || (!isCafeOpen() && !c.force_open);
  const closedMsg = () => `Kafe sedang tutup · buka lagi ${nextOpenLabel()}`;

  const totals = (lines) => {
    const sub = lines.reduce((a, l) => a + l.price * l.qty, 0);
    const tax = Math.round(sub * TAX_RATE);
    return { sub, tax, total: sub + tax, count: lines.reduce((a, l) => a + l.qty, 0) };
  };
  const cartLines = () => c.cart.filter((l) => menuById[l.menu_id]).map((l) => ({ ...l, name: menuById[l.menu_id].name, price: menuById[l.menu_id].price }));
  const qtyOf = (id) => c.cart.filter((l) => l.menu_id === id).reduce((a, l) => a + l.qty, 0);

  /* ===== QR meja dari URL: ?meja= di location.search (QR asli) atau di query hash (simulasi) ===== */
  const normTable = (raw) => {
    const s = String(raw ?? "").trim().slice(0, 12);
    return /^\d{1,3}$/.test(s) ? String(Number(s)).padStart(2, "0") : s.replace(/[^\w-]/g, "").slice(0, 8);
  };
  const tableActive = (n) => TABLES.some((t) => t.table_number === n && t.is_active);
  /** Terapkan meja dari URL ke sesi. Kembalikan false bila halaman dialihkan ke "QR tidak valid". */
  function applyUrlTable() {
    const pick = (qs) => new URLSearchParams(qs || "").get("meja");
    const fromHash = pick(location.hash.split("?")[1]);
    // location.search hanya dibaca sekali per dokumen: setelah itu sesi yang berlaku
    const fromSearch = S.searchSeen ? null : pick(location.search);
    S.searchSeen = true;
    const raw = fromHash ?? fromSearch;
    if (raw == null) return true;
    // Rute tidak boleh membawa query: rapikan hash menjadi #/pelanggan (tanpa entri riwayat baru)
    if (fromHash != null) { try { history.replaceState(history.state, "", location.href.split("#")[0] + "#/pelanggan"); } catch {} }
    const n = normTable(raw);
    c = loadCust();
    if (!tableActive(n)) {
      c.invalid_table = n || "?";
      saveCust(c);
      go("#/pelanggan/tidak-valid", true);
      return false;
    }
    if (n !== c.table) {
      const had = ls.get(KEY.cust, null) && (c.cart.length || c.order);
      c = custEmpty(n); // QR meja lain → sesi baru untuk meja itu
      if (had) S.notice = `Meja ${n} · sesi pesanan baru dimulai`;
    }
    c.invalid_table = null;
    saveCust(c);
    return true;
  }
  /** Jam operasional: di luar jam buka (dan bukan mode lihat menu / paksa buka) → halaman Kafe Tutup */
  const mustClose = () => !isCafeOpen() && !c.force_open && !c.browse_only;

  /* ===== Toast ===== */
  const toastEl = $("toast");
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    try { if (toastEl.matches(":popover-open")) toastEl.hidePopover(); toastEl.showPopover(); } catch {}
    motion(toastEl, [{ opacity: 0, transform: "translate(-50%, 12px)" }, { opacity: 1, transform: "translate(-50%, 0)" }], { duration: 200 });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 2400);
  }
  function hideToast() { try { if (toastEl.matches(":popover-open")) toastEl.hidePopover(); } catch {} }
  onCleanup(() => { clearTimeout(toastTimer); hideToast(); });

  /** Render ulang tanpa kehilangan fokus keyboard pada tombol yang diganti. */
  function keepFocus(fn) {
    const a = document.activeElement;
    const keys = ["add", "open", "cat"];
    const sel = a && a !== document.body && root.contains(a) && a.tagName === "BUTTON"
      ? keys.filter((k) => a.dataset[k] != null).map((k) => `[data-${k}="${CSS.escape(a.dataset[k])}"]`).join("") : "";
    const idx = sel ? $$(sel).indexOf(a) : -1;
    fn();
    if (sel && !a.isConnected) ($$(sel)[idx] || $$(sel)[0])?.focus({ preventScroll: true });
  }

  /* ===== Render: kepala, banner tutup, menu ===== */
  function paintHeader() {
    const now = new Date(), h = now.getHours();
    const greet = h < 11 ? "Selamat pagi" : h < 15 ? "Selamat siang" : h < 18 ? "Selamat sore" : "Selamat malam";
    $("greet").textContent = `${greet} 👋`;
    $("table").textContent = c.table;
    $("table-box").setAttribute("aria-label", `Nomor meja ${c.table}`);
    const [o, cl] = HOURS[now.getDay()] || ["08:00", "22:00"];
    const hours = $("hours");
    if (c.browse_only) { hours.dataset.tone = "danger"; hours.textContent = `Tutup · buka ${nextOpenLabel().replace("pukul ", "")}`; }
    else if (!isCafeOpen()) { hours.dataset.tone = "accent"; hours.textContent = "Prototipe · jam buka diabaikan"; }
    else { hours.dataset.tone = "positive"; hours.textContent = `Buka · ${dot(o)}–${dot(cl)}`; }
    $("thesis").textContent = c.browse_only ? "Intip menu kami dulu, yuk." : "Mau pesan apa hari ini?";
    $("closed").hidden = !c.browse_only;
    $("closed-title").textContent = closedMsg();
    document.title = `${SETTINGS.cafe_name} — Meja ${c.table} | IUL FnB`;
  }
  function renderTabs() {
    const tabs = [{ id: "all", name: "Semua", n: MENUS.length }]
      .concat(CATEGORIES.map((cat) => ({ id: cat.id, name: cat.name, n: MENUS.filter((m) => m.category_id === cat.id).length })));
    $("tabs").innerHTML = tabs.map((t) =>
      `<button type="button" role="tab" data-cat="${t.id}" aria-selected="${S.cat === t.id}">${esc(t.name)}<small>${t.n}</small></button>`).join("");
  }
  function itemBody(m, compact) {
    const q = qtyOf(m.id), off = blocked();
    const tags = !compact && m.tags.length ? `<span class="pl-tags">${m.tags.map((t) => `<span class="pl-tag">${esc(t)}</span>`).join("")}</span>` : "";
    return `
      <button type="button" class="pl-item-main" data-open="${m.id}" aria-label="${esc(m.name)}, ${rp(m.price)}${m.is_available ? "" : ", habis"}${q ? `, ${q} di keranjang` : ""}. Lihat detail">
        <span class="pl-thumb" aria-hidden="true"><img src="${esc(m.image_url)}" alt="" loading="lazy" decoding="async">${q ? `<span class="pl-qty">${q}</span>` : ""}</span>
        <span class="pl-info">${tags}<span class="pl-name">${esc(m.name)}</span>${compact ? "" : `<span class="pl-desc">${esc(m.desc)}</span>`}<span class="pl-price">${rp(m.price)}</span></span>
      </button>
      ${m.is_available
        ? `<button type="button" class="pl-add" data-add="${m.id}"${off ? ` aria-disabled="true" aria-label="Tambah ${esc(m.name)} — tidak tersedia, kafe sedang tutup"` : ` aria-label="Tambah ${esc(m.name)} ke keranjang"`}>${icon("plus")}</button>`
        : `<button type="button" class="pl-chip pl-sold" data-tone="danger" data-add="${m.id}" aria-disabled="true" aria-label="${esc(m.name)} habis — tidak bisa ditambahkan">Habis</button>`}`;
  }
  function renderMenu() {
    const q = S.q.trim().toLowerCase();
    const match = (m) => !q || m.name.toLowerCase().includes(q) || m.desc.toLowerCase().includes(q);
    let html = "";
    if (S.cat === "all" && !q) {
      html += `<section aria-labelledby="pelanggan-pop-title">
        <div class="pl-sec"><h2 id="pelanggan-pop-title">Terlaris hari ini 🔥</h2><span>Favorit pelanggan</span></div>
        <div class="pl-strip">${POPULAR.map((id, i) => {
          const m = menuById[id];
          return `<div class="pl-pop"${m.is_available ? "" : " data-soldout"}><span class="pl-chip pl-rank" data-tone="dark" aria-hidden="true">#${i + 1}</span>${itemBody(m, true)}</div>`;
        }).join("")}</div></section>`;
    }
    const cats = [...CATEGORIES].sort((a, b) => a.sort_order - b.sort_order).filter((cat) => S.cat === "all" || cat.id === S.cat);
    let found = 0;
    for (const cat of cats) {
      // Menu tersedia di atas, menu habis di bawah
      const items = MENUS.filter((m) => m.category_id === cat.id && match(m)).sort((a, b) => b.is_available - a.is_available);
      if (!items.length) continue;
      found += items.length;
      html += `<section aria-labelledby="pelanggan-cat-${cat.id}">
        <div class="pl-sec"><h2 id="pelanggan-cat-${cat.id}">${esc(cat.name)}</h2><span>${items.length} menu</span></div>
        <ul class="pl-list">${items.map((m) => `<li class="pl-item"${m.is_available ? "" : " data-soldout"}>${itemBody(m, false)}</li>`).join("")}</ul>
      </section>`;
    }
    if (!found) html += `<div class="pl-empty">${icon("search-x", 30)}<strong>Menu tidak ditemukan</strong>Coba kata lain, mis. “kopi”, “nasi”, atau “teh”.</div>`;
    $("menu").innerHTML = html;
  }

  /* ===== Render: bilah keranjang ===== */
  function renderCartBar(bump) {
    const t = totals(cartLines()), off = blocked(), btn = $("open-cart");
    $("cartbar").dataset.show = String(t.count > 0);
    $("cb-count").textContent = t.count;
    btn.setAttribute("aria-disabled", String(off));
    if (off) {
      $("cb-title").textContent = "Kafe sedang tutup";
      $("cb-items").textContent = `${t.count} item · buka ${nextOpenLabel().replace("pukul ", "")}`;
      $("cb-total").innerHTML = icon("lock", 20);
      btn.setAttribute("aria-label", `Keranjang tidak bisa dibuka: ${closedMsg()}. ${t.count} item tersimpan.`);
    } else {
      $("cb-title").textContent = "Lihat keranjang";
      $("cb-items").textContent = `${t.count} item · belum termasuk pajak`;
      $("cb-total").textContent = rp(t.sub);
      btn.setAttribute("aria-label", `Lihat keranjang, ${t.count} item, ${rp(t.sub)} belum termasuk pajak`);
    }
    if (bump && t.count) motion(btn, [{ transform: "scale(1)" }, { transform: "scale(1.04)" }, { transform: "scale(1)" }], { duration: 300 });
  }
  function refresh(bump) {
    keepFocus(() => { renderMenu(); renderCartBar(bump); });
  }

  /* ===== Pil lacak pesanan (status dari kontrak C, diperbarui tiap detik + event storage) ===== */
  function renderTrack(silent) {
    const cur = loadCust();
    const o = cur.order;
    if (!o) { $("track").hidden = true; S.trackSig = null; return; }
    const before = JSON.stringify(o.times);
    const st = orderStatus(o);
    if (JSON.stringify(o.times) !== before) saveCust(cur);
    c.order = o;
    const label = st.cancelled ? "Dibatalkan kasir" : STEPS[st.idx].label + (st.paid ? " · Lunas" : "");
    const sig = `${o.code}|${st.idx}|${st.cancelled}|${st.paid}`;
    $("track").hidden = false;
    if (sig === S.trackSig) return;
    const prev = S.trackSig;
    S.trackSig = sig;
    $("track-ico").textContent = st.cancelled ? "🙏" : STEPS[st.idx].icon;
    $("track-txt").textContent = `${o.code} · ${label}`;
    $("track").setAttribute("aria-label", `Lacak pesanan ${o.code}: ${label}`);
    if (prev && prev.startsWith(o.code + "|") && !silent) {
      toast(st.cancelled ? `Pesanan ${o.code} dibatalkan kasir` : `Pesanan ${o.code}: ${label}`);
      motion($("track-ico"), [{ transform: "scale(.6)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: 300 });
    }
  }

  /* ===== Aksi ===== */
  function quickAdd(id) {
    const m = menuById[id];
    if (!m) return;
    if (!m.is_available) { toast(`Maaf, ${m.name} sedang habis`); return; }
    if (blocked()) { toast(`Kafe tutup · bisa pesan lagi ${nextOpenLabel()}`); return; }
    c = loadCust();
    const key = lineKey(m.id, "");
    const ex = c.cart.find((l) => l.key === key);
    if (ex) ex.qty = Math.min(MAX_QTY, ex.qty + 1);
    else c.cart.push({ key, menu_id: m.id, qty: 1, note: "" });
    saveCust(c);
    refresh(true);
    toast(`✓ ${m.name} masuk keranjang`);
  }
  function openDetail(id) {
    c = loadCust();
    c.selected = id;
    c.edit_key = null;
    saveCust(c);
    S.restore = true; S.scrollY = scrollY; S.lastOpen = id;
    go("#/pelanggan/menu");
  }

  root.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || !root.contains(b)) return;
    const d = b.dataset;
    if (d.cat) {
      S.cat = d.cat;
      keepFocus(() => { renderTabs(); renderMenu(); });
      const top = $("menu").getBoundingClientRect().top + scrollY - $("tabs-wrap").offsetHeight;
      if (scrollY > top) scrollTo({ top, behavior: reduceMotion() ? "auto" : "smooth" });
      const tabs = $("tabs"), sel = tabs.querySelector(`[data-cat="${d.cat}"]`);
      const tr = tabs.getBoundingClientRect(), br = sel.getBoundingClientRect();
      if (br.left < tr.left) tabs.scrollLeft -= tr.left - br.left + 16;
      else if (br.right > tr.right) tabs.scrollLeft += br.right - tr.right + 16;
      return;
    }
    if (d.add) return quickAdd(d.add);
    if (d.open) return openDetail(d.open);
  }, { signal });

  $("open-cart").addEventListener("click", () => {
    if (blocked()) { toast(`Kafe tutup · keranjang aktif lagi ${nextOpenLabel()}`); return; }
    go("#/pelanggan/keranjang");
  }, { signal });
  $("track").addEventListener("click", () => go("#/pelanggan/status"), { signal });
  $("force-open").addEventListener("click", () => {
    c = loadCust();
    c.browse_only = false; c.force_open = true;
    saveCust(c);
    paintHeader(); refresh();
    toast("Prototipe: jam operasional diabaikan — kamu bisa memesan");
    $("q").focus({ preventScroll: true });
  }, { signal });
  $("q").addEventListener("input", (e) => { S.q = e.target.value; $("clear-q").hidden = !S.q; renderMenu(); }, { signal });
  $("clear-q").addEventListener("click", (e) => {
    e.preventDefault();
    $("q").value = ""; S.q = "";
    $("clear-q").hidden = true;
    renderMenu();
    $("q").focus();
  }, { signal });

  /** Status pesanan maju tiap detik (simulasi) + perubahan dari kasir / tab lain */
  const trackTimer = setInterval(() => renderTrack(false), 1000);
  onCleanup(() => clearInterval(trackTimer));
  addEventListener("storage", (e) => {
    if (e.key !== null && e.key !== KEY.cust && e.key !== KEY.live) return;
    if (e.key !== KEY.live) { c = loadCust(); paintHeader(); refresh(); }
    renderTrack(false);
  }, { signal });
  // QR meja lain tanpa memuat ulang: #/pelanggan?meja=05
  addEventListener("hashchange", () => {
    if (!/[?&]meja=/.test(location.hash)) return;
    S.searchSeen = true;
    if (!applyUrlTable()) return;
    if (mustClose()) { go("#/pelanggan/tutup", true); return; }
    S.trackSig = null;
    paintHeader(); refresh(); renderTrack(true);
    if (S.notice) { toast(S.notice); S.notice = null; }
    scrollTo({ top: 0 });
  }, { signal });

  /* ===== Mulai ===== */
  const prevTitle = document.title;
  onCleanup(() => { document.title = prevTitle; });
  if (applyUrlTable()) {
    if (mustClose()) go("#/pelanggan/tutup", true);
    else {
      paintHeader();
      $("q").value = S.q;
      $("clear-q").hidden = !S.q;
      renderTabs();
      renderMenu();
      renderCartBar();
      S.trackSig = null;
      renderTrack(true);
      // Pesan dari halaman sebelumnya (mis. "✓ 2× Nasi Goreng masuk keranjang"), tampilkan lalu hapus
      const msg = S.notice || c.flash;
      if (c.flash) { c = loadCust(); c.flash = null; saveCust(c); }
      S.notice = null;
      if (msg) toast(msg);
      // Kembali dari detail menu → pulihkan posisi gulir & fokus pada menu yang tadi dibuka
      if (S.restore) {
        S.restore = false;
        const y = S.scrollY, id = S.lastOpen;
        requestAnimationFrame(() => {
          scrollTo({ top: y });
          root.querySelector(`.pl-item [data-open="${CSS.escape(id || "")}"]`)?.focus({ preventScroll: true });
        });
      } else scrollTo({ top: 0 });
    }
  }
</script>
