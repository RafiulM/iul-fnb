<style>
  .p-kasir { display: grid; gap: var(--space-6); align-content: start; min-height: 100vh; font-family: var(--font-ui); }
  .k-context { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); margin: calc(var(--space-4) * -1) 0 0; font: 400 var(--text-body-sm) / var(--leading-body-sm) var(--font-ui); color: var(--color-text-muted); }
  .k-context .k-reset { margin-inline-start: auto; margin-block: -6px; color: var(--color-text-muted); }
  .k-context .k-reset:hover { color: var(--color-text); }

  .k-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); }
  .k-stats .l-staf-metric > strong { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px; white-space: normal; font-variant-numeric: normal; }
  .k-stats em { white-space: nowrap; font: 500 var(--text-body-sm) / 1 var(--font-ui); font-style: normal; letter-spacing: 0; color: var(--color-text-muted); }

  .k-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); }
  .k-toolbar .l-staf-search { min-width: min(320px, 100%); }

  .k-board { display: grid; grid-template-columns: repeat(4, minmax(232px, 1fr)); gap: var(--space-3); overflow-x: auto; padding-block-end: var(--space-1); }
  .k-lane { display: flex; flex-direction: column; min-width: 0; padding: var(--space-2); border-radius: var(--radius-card); background: var(--color-surface-muted); }
  .k-lane-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-2) var(--space-3); }
  .k-lane-head h2 { margin: 0; font: 600 15px / 1.2 var(--font-ui); letter-spacing: -0.15px; }
  .k-lane-head .l-staf-chip { margin-inline-start: auto; }
  .k-lane-body { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: var(--space-2); min-height: 240px; max-height: calc(100vh - 330px); overflow-y: auto; padding: 2px; scrollbar-width: thin; }
  .k-lane-empty { padding: var(--space-6) var(--space-3); border: var(--border-hairline) dashed var(--color-border-strong); border-radius: var(--radius-image); text-align: center; font: 500 var(--text-body-sm) / var(--leading-body-sm) var(--font-ui); color: var(--color-text-muted); }

  .k-card { position: relative; padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4); border: var(--border-hairline) solid var(--color-border); border-radius: var(--radius-image); background: var(--color-surface); transition: border-color var(--duration-fast) var(--ease-standard); }
  .k-card:hover { border-color: var(--color-border-strong); }
  .k-card[data-state="new"]::before { content: ""; position: absolute; inset-block: 12px; inset-inline-start: 0; width: 3px; border-radius: var(--radius-pill); background: var(--color-accent); }
  .k-card[data-late] { border-color: var(--color-warning); }
  .k-card-head { display: flex; align-items: center; gap: var(--space-2); }
  .k-open { all: unset; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 var(--text-body-md) / 1.25 var(--font-ui); letter-spacing: -0.32px; cursor: pointer; }
  .k-open::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius-image); }
  .k-open:focus-visible::after { outline: 2px solid var(--color-focus-ring); outline-offset: 3px; }
  .k-time { flex: none; display: inline-flex; align-items: center; gap: 4px; margin-inline-start: auto; font: 500 var(--text-label-sm) / 1 var(--font-ui); color: var(--color-text-muted); white-space: nowrap; }
  .k-card[data-late] .k-time { color: var(--color-warning-text); }
  .k-src { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; font: 400 var(--text-label-sm) / var(--leading-label-sm) var(--font-ui); color: var(--color-text-muted); }
  .k-src .l-staf-chip { margin-inline-start: auto; }
  .k-items { display: grid; gap: 6px; margin: var(--space-3) 0; padding: var(--space-3) 0; border-block: var(--border-hairline) dashed var(--color-border); list-style: none; font: 400 var(--text-body-sm) / 1.4 var(--font-ui); }
  .k-items b { display: inline-block; min-width: 26px; font-weight: 600; }
  .k-note { display: flex; align-items: center; gap: 4px; margin: 2px 0 0 26px; font: 500 var(--text-label-sm) / var(--leading-label-sm) var(--font-ui); font-style: italic; color: var(--color-warning-text); }
  .k-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-3); }
  .k-total { font: 600 var(--text-body-md) / 1 var(--font-ui); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .k-act { position: relative; z-index: 1; }

  /* Detail (drawer) */
  .k-d-title { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .k-steps { display: flex; margin: 0 0 var(--space-6); padding: 0; list-style: none; }
  .k-step { position: relative; flex: 1; display: grid; justify-items: center; gap: 6px; font: 500 var(--text-label-sm) / 1.2 var(--font-ui); color: var(--color-text-muted); text-align: center; }
  .k-step i { z-index: 1; display: grid; place-items: center; width: 24px; height: 24px; border: 2px solid var(--color-border-strong); border-radius: var(--radius-pill); background: var(--color-surface); color: var(--color-on-primary); font-style: normal; }
  .k-step::before { content: ""; position: absolute; inset-block-start: 11px; inset-inline: -50% 50%; height: 2px; background: var(--color-border); }
  .k-step:first-child::before { display: none; }
  .k-step[data-state="done"] { color: var(--color-text); }
  .k-step[data-state="done"] i { border-color: var(--color-primary); background: var(--color-primary); }
  .k-step[data-state="done"]::before, .k-step[data-state="current"]::before { background: var(--color-primary); }
  .k-step[data-state="current"] { color: var(--color-text); font-weight: 600; }
  .k-step[data-state="current"] i { border-color: var(--color-accent); box-shadow: 0 0 0 4px var(--color-accent-soft); }
  .k-sec { margin: var(--space-6) 0 var(--space-3); font: 600 var(--text-label-sm) / var(--leading-label-sm) var(--font-ui); color: var(--color-text-muted); }
  .k-d-items { display: grid; gap: var(--space-3); margin: 0; padding: 0; list-style: none; }
  .k-d-item { display: flex; align-items: flex-start; gap: var(--space-3); }
  .k-d-item > div { flex: 1; min-width: 0; }
  .k-d-item strong { display: block; font: 600 var(--text-body-sm) / 1.35 var(--font-ui); }
  .k-d-item small { font: 400 var(--text-label-sm) / var(--leading-label-sm) var(--font-ui); color: var(--color-text-muted); }
  .k-d-item .k-note { margin: 4px 0 0; }
  .k-sum { display: grid; gap: 6px; margin-top: var(--space-4); padding-top: var(--space-4); border-block-start: var(--border-hairline) dashed var(--color-border-strong); font: 400 var(--text-body-sm) / 1.4 var(--font-ui); color: var(--color-text-muted); }
  .k-sum div { display: flex; justify-content: space-between; gap: var(--space-3); }
  .k-sum span:last-child { font-variant-numeric: tabular-nums; }
  .k-sum .k-sum-total { padding-top: var(--space-1); font: 600 17px / 1.3 var(--font-ui); color: var(--color-text); }
  .k-paybox { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-4); padding: var(--space-3) var(--space-4); border: var(--border-hairline) solid var(--color-border); border-radius: var(--radius-image); background: var(--color-surface-subtle); }
  .k-paybox > iconify-icon { flex: none; font-size: 22px; color: var(--color-warning-text); }
  .k-paybox[data-paid] > iconify-icon { color: var(--color-positive); }
  .k-paybox strong { display: block; font: 600 var(--text-body-sm) / 1.3 var(--font-ui); }
  .k-paybox small { font: 400 var(--text-label-sm) / var(--leading-label-sm) var(--font-ui); color: var(--color-text-muted); }
  .k-meta { display: grid; grid-template-columns: auto 1fr; gap: 6px var(--space-4); margin: 0; font: 400 var(--text-body-sm) / 1.4 var(--font-ui); }
  .k-meta dt { color: var(--color-text-muted); }
  .k-meta dd { margin: 0; font-weight: 500; text-align: end; }
  .k-row { display: flex; flex-wrap: wrap; gap: var(--space-2); width: 100%; }
  .k-row > .l-staf-btn { flex: 1; }
  .k-drawer-foot { display: grid; justify-content: stretch; gap: var(--space-2); }

  .k-reasons { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
  .k-dlg-text { margin: 0; font: 400 var(--text-body-sm) / var(--leading-body-sm) var(--font-ui); color: var(--color-text-muted); }
  .k-dlg-list { display: grid; gap: 6px; margin: var(--space-4) 0 0; padding: 0; list-style: none; font: 400 var(--text-body-sm) / 1.4 var(--font-ui); }
  .k-dlg-list li { display: flex; align-items: flex-start; gap: var(--space-2); }
  .k-dlg-list iconify-icon { flex: none; margin-top: 2px; color: var(--color-text-muted); }

  @media (max-width: 1180px) {
    .k-board { grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: visible; }
    .k-lane-body { max-height: none; min-height: 120px; }
  }
  @media (max-width: 1100px) {
    .k-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 560px) {
    .k-board { grid-template-columns: minmax(0, 1fr); }
    .k-stats { grid-template-columns: minmax(0, 1fr); }
  }
</style>

<script>
  /* ===== Data tiruan (struktur mengikuti skema PRD §6) ===== */
  const SETTINGS = { cafe_name: "Kedai Senja", address: "Jl. Kaliurang Km 5, Yogyakarta", phone: "0812-2700-1234", tax_percent: 10, footer: "Terima kasih, sampai jumpa lagi!" };
  const MENUS = [
    ["m1", "makanan", "Nasi Goreng Kampung", 32000, "🍳", true], ["m2", "makanan", "Ayam Geprek Sambal Matah", 35000, "🍗", true],
    ["m3", "makanan", "Mie Goreng Jawa", 30000, "🍜", true], ["m4", "makanan", "Rice Bowl Chicken Teriyaki", 36000, "🍱", true],
    ["m5", "makanan", "Nasi Ayam Bakar Madu", 38000, "🍖", false], ["d1", "minuman", "Kopi Susu Gula Aren", 22000, "☕", true],
    ["d2", "minuman", "Es Americano", 20000, "🧊", true], ["d3", "minuman", "Matcha Latte", 28000, "🍵", true],
    ["d4", "minuman", "Es Teh Manis", 10000, "🥤", true], ["d5", "minuman", "Lemon Tea", 15000, "🍋", true],
    ["d6", "minuman", "Jus Alpukat", 25000, "🥑", false], ["s1", "lainnya", "Kentang Goreng", 20000, "🍟", true],
    ["s2", "lainnya", "Pisang Goreng Keju", 18000, "🍌", true], ["s3", "lainnya", "Roti Bakar Cokelat Keju", 22000, "🍞", true],
    ["s4", "lainnya", "Croissant Butter", 24000, "🥐", true], ["s5", "lainnya", "Air Mineral", 8000, "💧", true],
  ].map(([id, category_id, name, price, image_url, is_available]) => ({ id, category_id, name, price, image_url, is_available }));
  const menuById = Object.fromEntries(MENUS.map((m) => [m.id, m]));
  const MENU_WEIGHT = { m1: 9, m2: 7, m3: 5, m4: 5, m5: 3, d1: 12, d2: 6, d3: 5, d4: 8, d5: 4, d6: 2, s1: 8, s2: 4, s3: 4, s4: 3, s5: 4 };
  const TABLES = Array.from({ length: 12 }, (_, i) => ({ table_number: String(i + 1).padStart(2, "0"), is_active: i !== 11, area: i < 8 ? "Dalam" : "Teras" }));
  const USERS = { OWNER: "Iul Rahman", CASHIER: "Rina Kartika" };

  /* ===== Kontrak data lintas halaman (CONTRACTS.md — salinan apa adanya) ===== */
  const KEY = { cust: "iulfnb:cust", pos: "iulfnb:pos", live: "iulfnb:orders-live", beat: "iulfnb:kasir-beat", seq: "iulfnb:seq", role: "iulfnb:role" };
  const SEQ_BASE = 107;
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  function nextOrderCode() {
    const n = Math.max(ls.get(KEY.seq, SEQ_BASE), SEQ_BASE) + 1;
    ls.set(KEY.seq, n);
    return "A-" + String(n).padStart(3, "0");
  }
  function posSeed() {
    const ago = (m) => new Date(Date.now() - m * 60000).toISOString();
    const L = (id, qty, note = "") => { const m = menuById[id]; return { menu_id: id, name: m.name, image_url: m.image_url, price: m.price, qty, note }; };
    const base = { customer: null, payment_status: "BELUM", payment_method: null, payment_channel: null, paid_amount: null, cashier: null, paid_at: null, completed_at: null, cancel_reason: null, live: false };
    return [
      { ...base, code: "A-101", order_type: "QR", table: "05", items: [L("m3", 1), L("d2", 1), L("s5", 1)], status: "DIANTAR", created_at: ago(38) },
      { ...base, code: "A-102", order_type: "QR", table: "02", items: [L("m4", 2), L("d5", 2)], status: "DIANTAR", created_at: ago(31) },
      { ...base, code: "A-103", order_type: "QR", table: "09", items: [L("d1", 2, "1 panas, 1 dingin"), L("s1", 1)], status: "SIAP", created_at: ago(19) },
      { ...base, code: "A-104", order_type: "MANUAL", table: null, customer: "Budi", items: [L("m1", 1, "Dibungkus"), L("d4", 1)], status: "DIPROSES", payment_status: "LUNAS", payment_method: "NON_CASH", payment_channel: "QRIS", paid_amount: 46200, cashier: "Rina Kartika", paid_at: ago(13), created_at: ago(14) },
      { ...base, code: "A-105", order_type: "QR", table: "07", items: [L("m2", 1, "Ekstra pedas"), L("d4", 2)], status: "DIPROSES", created_at: ago(17) },
      { ...base, code: "A-106", order_type: "QR", table: "03", items: [L("m1", 2, "Tidak pedas"), L("d3", 1), L("s2", 1)], status: "MENUNGGU", created_at: ago(3) },
      { ...base, code: "A-107", order_type: "QR", table: "10", items: [L("d1", 1, "Es sedikit"), L("s4", 1)], status: "MENUNGGU", created_at: ago(1) },
    ];
  }
  function loadPos() {
    let p = ls.get(KEY.pos, null);
    if (!p || p.v !== 1 || Date.now() - Date.parse(p.seeded_at) > 12 * 3600e3) {
      p = { v: 1, seeded_at: new Date().toISOString(), orders: posSeed(), done: [], pay_code: null, manual_draft: null, flash: null };
      ls.set(KEY.pos, p);
      ls.set(KEY.seq, Math.max(ls.get(KEY.seq, SEQ_BASE), SEQ_BASE));
    }
    return p;
  }
  const savePos = (p) => ls.set(KEY.pos, p);
  /** Tarik pesanan QR dari jembatan yang belum ada di pos.orders/pos.done (mutasi p, kembalikan yang baru) */
  function pullLive(p) {
    const known = new Set([...p.orders, ...p.done].map((o) => o.code)), added = [];
    for (const l of ls.get(KEY.live, [])) {
      if (known.has(l.code) || Date.now() - Date.parse(l.created_at) > 12 * 3600e3 || ["SELESAI", "DIBATALKAN"].includes(l.status)) continue;
      const o = { code: l.code, order_type: "QR", table: l.table, customer: null, live: true, status: l.status || "MENUNGGU", payment_status: l.payment_status || "BELUM",
        payment_method: null, payment_channel: null, paid_amount: null, cashier: null, created_at: l.created_at, paid_at: null, completed_at: null, cancel_reason: null,
        items: l.items.map((i) => ({ menu_id: i.menu_id, name: i.name, image_url: menuById[i.menu_id]?.image_url || "🍽️", price: i.price, qty: i.qty, note: i.note || "" })) };
      p.orders.push(o); added.push(o);
    }
    return added;
  }
  /** Setelah status/pembayaran pesanan live berubah, tulis balik ke jembatan */
  function syncLive(o) {
    if (!o.live) return;
    ls.set(KEY.live, ls.get(KEY.live, []).map((x) => x.code === o.code ? { ...x, status: o.status, payment_status: o.payment_status, updated_at: Date.now() } : x));
  }
  /** Pindahkan pesanan ke done saat SELESAI/DIBATALKAN */
  function finishOrder(p, o, status) {
    o.status = status; o.completed_at = new Date().toISOString();
    p.orders = p.orders.filter((x) => x.code !== o.code);

  /* ===== Util ===== */
  const $ = (part) => root.querySelector(`[data-part="${part}"]`);
  const $$ = (sel, el = root) => [...el.querySelectorAll(sel)];
  const rp = (n) => "Rp " + Math.round(n).toLocaleString("id-ID");
  const rpShort = (n) => n >= 1e6 ? "Rp " + (n / 1e6).toLocaleString("id-ID", { maximumFractionDigits: 1 }) + " jt" : n >= 1e3 ? "Rp " + Math.round(n / 1e3) + " rb" : rp(n);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const hhmm = (d) => new Date(d).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
  const longDate = (d) => new Date(d).toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

  const me = USERS[ls.get(KEY.role, "OWNER") === "CASHIER" ? "CASHIER" : "OWNER"];
  const totals = (items) => {

  const line = (id, qty, note = "") => { const m = menuById[id]; return { menu_id: id, name: m.name, image_url: m.image_url, price: m.price, qty, note }; };

  /** Riwayat hari ini (deterministik, sama dengan halaman Penjualan) untuk ringkasan */
  function todayHistory() {
    let seed = 20261011;
    const r = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const pool = MENUS.flatMap((m) => Array(MENU_WEIGHT[m.id]).fill(m));
    const hourPool = [0, 0, 0, 0, 0, 0, 0, 0, 3, 4, 5, 7, 10, 9, 6, 5, 6, 8, 10, 9, 7, 5, 3, 0].flatMap((w, h) => Array(w).fill(h));
    const today = new Date(); today.setHours(0, 0, 0, 0);
    let done = 0, sales = 0;
    for (let d = 59; d >= 0; d--) {
      const day = new Date(today); day.setDate(today.getDate() - d);
      const weekend = day.getDay() === 0 || day.getDay() === 6;
      const n = Math.round((weekend ? 58 : 40) * (1 + (60 - d) / 60 * 0.12) * (0.85 + r() * 0.3));
      const times = Array.from({ length: n }, () => { const t = new Date(day); t.setHours(hourPool[Math.floor(r() * hourPool.length)], Math.floor(r() * 60), Math.floor(r() * 60)); return t; })
        .filter((t) => t <= Date.now()).sort((a, b) => a - b);
      for (const _ of times) {
        const lines = {};
        const k = 1 + Math.floor(r() * r() * 4);
        for (let j = 0; j < k; j++) { const m = pool[Math.floor(r() * pool.length)]; lines[m.id] = lines[m.id] || { price: m.price, qty: 0 }; lines[m.id].qty += r() < .8 ? 1 : 2; }
        // Urutan pengambilan angka acak harus sama dengan genTransactions (meja, metode, kasir)
        const qr = r() < .7;
        const cancelled = r() < .02;
        if (qr || r() < .5) r();
        if (!cancelled) r();
        r();
        if (d === 0 && !cancelled) { done++; sales += totals(Object.values(lines)).total; }
      }
    }
    return { done, sales };
  }

  /* ===== State: pesanan di localStorage (iulfnb:pos), tampilan di root ===== */
  const stored = ls.get(KEY.pos, null);

  const S = root.kasirState;
  const dayKey = new Date().toDateString();

  const save = () => savePos(p);

  const FLOW = ["MENUNGGU", "DIPROSES", "SIAP", "DIANTAR", "SELESAI"];

  const LANES = [
    { key: "MENUNGGU", title: "Baru masuk", empty: "Belum ada pesanan baru" },
    { key: "DIPROSES", title: "Diproses", empty: "Tidak ada yang sedang dibuat" },

  const find = (code) => p.orders.find((o) => o.code === code) || p.done.find((o) => o.code === code);

  const isLate = (o) => (o.status === "MENUNGGU" && minsSince(o.created_at) >= 5) || (o.status === "DIPROSES" && minsSince(o.created_at) >= 15);
  const shortAgo = (d) => { const m = minsSince(d); return m < 1 ? "Baru" : m < 60 ? m + " mnt" : Math.floor(m / 60) + " j " + (m % 60) + " m"; };
  const payChip = (o) => o.payment_status === "LUNAS" ? `<span class="l-staf-chip" data-tone="positive">Lunas</span>` : `<span class="l-staf-chip" data-tone="warning">Belum bayar</span>`;
  function nextAction(o) {

  /* ===== Toast ===== */
  const toastEl = $("toast");

  const beat = () => ls.set(KEY.beat, Date.now());

  /* ===== Notifikasi ===== */
  let actx;
  function chime() {

  onCleanup(() => { for (const t of freshTimers) clearTimeout(t); });

  /* ===== Render ===== */
  function renderStats() {

  function renderDrawer() {

    const t = totals(o.items), [stLabel, stTone] = STATUS[o.status], a = isActive(o) ? nextAction(o) : null, idx = FLOW.indexOf(o.status), paid = o.payment_status === "LUNAS";
    $("d-title").textContent = whereLabel(o);
    $("d-status").dataset.tone = stTone;

      : o.payment_method === "CASH" ? `Tunai ${rp(o.paid_amount)} · kembali ${rp(o.paid_amount - t.total)}` : `Non-tunai${o.payment_channel ? " · " + esc(o.payment_channel) : ""}`;

  }

  /* ===== Aksi pesanan (setiap aksi disimpan ke iulfnb:pos) ===== */
  function advance(code) {
    const o = find(code);
    if (!o || !isActive(o) || o.status === "DIANTAR") return;
    o.status = FLOW[FLOW.indexOf(o.status) + 1];
    if (o.status === "DIANTAR" && o.payment_status === "LUNAS") { complete(o); return; }
    syncLive(o);
    save();
    render();
    toast({ DIPROSES: `${o.code} diterima — mulai dibuat`, SIAP: `${o.code} siap — antar ke ${whereLabel(o).toLowerCase()}`, DIANTAR: `${o.code} sudah diantar — menunggu pembayaran` }[o.status]);
  }
  function complete(o) {

  function openDetail(code) { S.openCode = code; renderDrawer(); open("drawer"); }
  /** Pembayaran & struk ada di halaman sendiri: simpan kode lalu pindah ke #/kasir/bayar */

  const REASONS = ["Pelanggan batal", "Menu habis", "Pesanan ganda", "Salah input"];

  function simulateQR() {
    const r = Math.random, pick = (a) => a[Math.floor(r() * a.length)];
    const avail = MENUS.filter((m) => m.is_available).sort(() => r() - .5);
    const NOTES = { makanan: ["Tidak pedas", "Ekstra pedas"], minuman: ["Es sedikit", "Tanpa gula", "Gula sedikit"], lainnya: ["Saus terpisah"] };
    const busy = new Set(p.orders.map((o) => o.table));
    const free = TABLES.filter((t) => t.is_active && !busy.has(t.table_number));
    const o = {
      code: nextOrderCode(), order_type: "QR", table: pick(free.length ? free : TABLES.filter((t) => t.is_active)).table_number, customer: null,
      items: avail.slice(0, 1 + Math.floor(r() * 3)).map((m) => line(m.id, r() < .75 ? 1 : 2, r() < .4 ? pick(NOTES[m.category_id]) : "")),
      status: "MENUNGGU", payment_status: "BELUM", payment_method: null, payment_channel: null, paid_amount: null, cashier: null,
      created_at: new Date().toISOString(), paid_at: null, completed_at: null, cancel_reason: null, live: false,

  // Prototipe: satu pesanan QR tiruan masuk 7 detik setelah data demo baru dibuat
  let demoTimer;

  onCleanup(() => clearTimeout(demoTimer));

  /* ===== Event ===== */
  root.addEventListener("click", (e) => {

  }, { signal });
  $("cx-confirm").addEventListener("click", confirmCancel, { signal });
  $("rs-confirm").addEventListener("click", resetDemo, { signal });

  actions?.querySelector('[data-action="manual"]')?.addEventListener("click", () => { location.hash = "#/kasir/manual"; }, { signal });
  actions?.querySelector('[data-action="simulate"]')?.addEventListener("click", simulateQR, { signal });
  const soundBtn = actions?.querySelector('[data-action="sound"]');
  const paintSound = () => {
    if (!soundBtn) return;
    soundBtn.setAttribute("aria-pressed", S.sound);
    soundBtn.innerHTML = icon(S.sound ? "bell" : "bell-off");
  };
  soundBtn?.addEventListener("click", () => { S.sound = !S.sound; paintSound(); toast(S.sound ? "Suara notifikasi aktif" : "Suara notifikasi dimatikan"); }, { signal });

  /* ===== Mulai ===== */
  scrollTo(0, 0); // halaman baru selalu dibuka dari atas
  const pulled = pullLive(p);
  if (pulled.length) { save(); for (const o of pulled) markFresh(o.code); }
  $("q").value = S.filter.q;
  paintSound();
  renderClock();
  render();
  if (p.flash) { const msg = p.flash; p.flash = null; save(); toast(msg); }
  const tick = setInterval(() => { renderClock(); renderStats(); renderBoard(); }, 20000);
  onCleanup(() => clearInterval(tick));
  if (justSeeded) scheduleDemo();
</script>
