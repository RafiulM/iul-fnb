<script>
  /* ===== Data tiruan (struktur mengikuti skema PRD §6 settings) ===== */
  const SETTINGS = {
    cafe_name: "Kedai Senja", address: "Jl. Kaliurang Km 5, Yogyakarta", phone: "0812-2700-1234",
    open_hour: "08:00", close_hour: "22:00", tax_percent: 10, service_percent: 0,
    receipt: { show_logo: true, show_address: true, show_table: true, show_cashier: true, show_notes: true, header: "", footer: "Terima kasih, sampai jumpa lagi!" },
  };
  const MENUS = {
    m1: { name: "Nasi Goreng Kampung", price: 32000, image_url: "🍳", desc: "Nasi goreng bumbu terasi, telur ceplok, ayam suwir, dan kerupuk udang." },
    d1: { name: "Kopi Susu Gula Aren", price: 22000, image_url: "☕", desc: "Espresso, susu segar, dan gula aren asli. Tersedia panas atau dingin." },
    s1: { name: "Kentang Goreng", price: 20000, image_url: "🍟", desc: "Kentang goreng renyah dengan saus sambal dan mayones." },
  };
  const DAYS = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu", "Minggu"];
  const SECTION_LABEL = { profil: "Profil kafe", jam: "Jam operasional", pajak: "Pajak & layanan", struk: "Format struk" };
  const SECTION_KEYS = { profil: ["cafe_name", "address", "phone", "instagram"], jam: ["hours"], pajak: ["tax_percent", "service_percent", "tax_inclusive"], struk: ["receipt"] };

  /* ===== Util ===== */
  const $ = (part, el = root) => el.querySelector(`[data-part="${part}"]`);
  const $$ = (sel, el = root) => [...el.querySelectorAll(sel)];
  const rp = (n) => "Rp " + Math.round(n).toLocaleString("id-ID");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const hhmm = (d) => new Date(d).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
  const tgl = (d, opt) => new Date(d).toLocaleDateString("id-ID", opt);
  const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
  const initials = (name) => name.split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const icon = (name, size = 18) => `<iconify-icon icon="lucide:${name}" aria-hidden="true" style="font-size:${size}px"></iconify-icon>`;
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const dotTime = (t) => String(t || "").replace(":", ".");
  const pct = (v) => Number(v).toLocaleString("id-ID", { maximumFractionDigits: 2 });
  const num = (n) => Math.round(n).toLocaleString("id-ID");
  const todayIdx = () => (new Date().getDay() + 6) % 7; // 0 = Senin
  const nowHM = () => { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
  const oneLine = (s) => String(s || "").trim().replace(/\s*\n\s*/g, ", ");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const scrollBehavior = reduceMotion ? "auto" : "smooth";

  /* ===== Draf = salinan SETTINGS + field khusus halaman ===== */
  function fromSettings(s) {
    const hours = Array.isArray(s.hours) && s.hours.length === 7
      ? s.hours.map((h) => ({ open: !!h.open, from: String(h.from || ""), to: String(h.to || "") }))
      : DAYS.map((_, i) => ({ open: true, from: s.open_hour || "08:00", to: i === 5 ? "23:00" : (s.close_hour || "22:00") }));
    const R = s.receipt || {};
    return {
      cafe_name: String(s.cafe_name ?? ""), address: String(s.address ?? ""), phone: String(s.phone ?? ""), instagram: String(s.instagram ?? "kedaisenja.jogja"),
      tax_percent: Number(s.tax_percent) || 0, service_percent: Number(s.service_percent) || 0, tax_inclusive: !!s.tax_inclusive,
      hours,
      receipt: {
        show_logo: R.show_logo !== false, show_address: R.show_address !== false, show_table: R.show_table !== false,
        show_cashier: R.show_cashier !== false, show_notes: R.show_notes !== false,
        header: String(R.header ?? ""), footer: String(R.footer ?? ""), paper_mm: R.paper_mm === 58 ? 58 : 80,
      },
    };
  }
  /* State bertahan saat pindah halaman (draf yang belum disimpan tidak hilang) */
  const S = root.pengaturanState ??= (() => { const saved = fromSettings(SETTINGS); return { saved, draft: clone(saved), touched: new Set(), preview: "pelanggan" }; })();

  /** Contoh pesanan untuk pratinjau & struk uji */
  const line = (id, qty, note) => ({ menu_id: id, name: MENUS[id].name, price: MENUS[id].price, qty, note });
  const SAMPLE = {
    code: "A-027", order_type: "QR", table: "07", items: [line("m1", 2, "Tidak pedas"), line("d1", 1, "")],
    status: "SELESAI", payment_status: "LUNAS", payment_method: "NON_CASH", payment_channel: "QRIS", cashier: "Rina Kartika",
  };

  /* ===== Elemen formulir ===== */
  const F = Object.fromEntries($$("[data-f]").map((el) => [el.dataset.f, el]));

  /* ===== Validasi ===== */
  const pctErr = (v) => Number.isFinite(v) && v >= 0 && v <= 100 ? "" : "Masukkan angka 0–100. Isi 0 bila tidak dipakai.";
  const hourErr = (h) => {
    if (!h.open) return "";
    if (!h.from || !h.to) return "Isi jam buka dan jam tutup.";
    if (h.to <= h.from) return "Jam tutup harus setelah jam buka.";
    return "";
  };
  const RULES = {
    name: () => S.draft.cafe_name.trim() ? "" : "Nama kafe wajib diisi.",
    phone: () => { const v = S.draft.phone.trim(); return !v || /^\+?[0-9][0-9\s-]{5,18}$/.test(v) ? "" : "Gunakan angka saja, boleh dengan spasi, tanda + atau -."; },
    ig: () => !S.draft.instagram || /^[A-Za-z0-9._]{1,30}$/.test(S.draft.instagram) ? "" : "Hanya huruf, angka, titik, dan garis bawah.",
    tax: () => pctErr(S.draft.tax_percent),
    service: () => pctErr(S.draft.service_percent),
  };
  function paintErr(errEl, msg) {
    if (!errEl) return;
    errEl.textContent = msg || "";
    errEl.hidden = !msg;
  }
  function showErr(input, msg) {
    input.setAttribute("aria-invalid", msg ? "true" : "false");
    input.closest(".l-staf-affix")?.toggleAttribute("data-invalid", !!msg);
    paintErr(root.querySelector(`[id="${input.dataset.err}"]`), msg);
  }
  /** Tampilkan error hanya bila field sudah disentuh; selalu hapus error yang sudah beres */
  function checkField(key) {
    const msg = RULES[key]();
    if (S.touched.has(key) || !msg) showErr(F[key], msg);
    return !msg;
  }
  function checkHour(i) {
    const row = root.querySelector(`.pg-hrow[data-i="${i}"]`);
    if (!row) return true;
    const h = S.draft.hours[i], msg = hourErr(h);
    const show = S.touched.has("h" + i) ? msg : "";
    row.querySelector('[data-k="from"]').setAttribute("aria-invalid", show && h.open && !h.from ? "true" : "false");
    row.querySelector('[data-k="to"]').setAttribute("aria-invalid", show && (!h.to || h.from) ? "true" : "false");
    paintErr(row.querySelector(".l-staf-error"), show);
    return !msg;
  }

  /* ===== Isi formulir dari draf ===== */
  function fillForm() {
    const D = S.draft;
    F.name.value = D.cafe_name; F.address.value = D.address; F.phone.value = D.phone; F.ig.value = D.instagram;
    F.tax.value = Number.isFinite(D.tax_percent) ? D.tax_percent : "";
    F.service.value = Number.isFinite(D.service_percent) ? D.service_percent : "";
    F.incl.checked = D.tax_inclusive;
    F.header.value = D.receipt.header; F.footer.value = D.receipt.footer;
    $$("[data-rc]").forEach((el) => { el.checked = !!D.receipt[el.dataset.rc]; });
    setPaper(D.receipt.paper_mm);
    renderHours();
    Object.keys(RULES).forEach(checkField);
  }

  /* ===== Jam operasional ===== */
  function renderHours() {
    const ti = todayIdx();
    $("hours").innerHTML = S.draft.hours.map((h, i) => `
      <li class="pg-hrow" data-i="${i}"${h.open ? "" : " data-closed"}>
        <div class="pg-hday"><span>${DAYS[i]}</span>${i === ti ? `<span class="l-staf-chip" data-tone="accent">Hari ini</span>` : ""}</div>
        <label class="pg-htoggle">
          <span class="l-staf-switch"><input type="checkbox" role="switch" data-k="open"${h.open ? " checked" : ""} aria-label="Buka hari ${DAYS[i]}"><span></span></span>
          <span class="pg-hstate" aria-hidden="true">${h.open ? "Buka" : "Tutup"}</span>
        </label>
        <div class="pg-htimes">
          <input type="time" class="l-staf-input" data-k="from" value="${esc(h.from)}" aria-label="Jam buka ${DAYS[i]}" aria-describedby="pengaturan-err-h${i}"${h.open ? "" : " disabled"}>
          <span class="pg-hdash" aria-hidden="true">–</span>
          <input type="time" class="l-staf-input" data-k="to" value="${esc(h.to)}" aria-label="Jam tutup ${DAYS[i]}" aria-describedby="pengaturan-err-h${i}"${h.open ? "" : " disabled"}>
        </div>
        <p class="l-staf-error" id="pengaturan-err-h${i}" hidden></p>
      </li>`).join("");
    S.draft.hours.forEach((_, i) => checkHour(i));
  }
  function syncRow(i) {
    const row = root.querySelector(`.pg-hrow[data-i="${i}"]`), h = S.draft.hours[i];
    row.toggleAttribute("data-closed", !h.open);
    row.querySelector(".pg-hstate").textContent = h.open ? "Buka" : "Tutup";
    row.querySelectorAll('input[type="time"]').forEach((inp) => { inp.disabled = !h.open; });
  }
  function onHours(e) {
    const row = e.target.closest(".pg-hrow"), k = e.target.dataset.k;
    if (!row || !k) return;
    const i = Number(row.dataset.i);
    if (k === "open") { S.draft.hours[i].open = e.target.checked; syncRow(i); }
    else S.draft.hours[i][k] = e.target.value;
    S.touched.add("h" + i);
    checkHour(i);
    update();
  }
  function nextOpen(i) {
    for (let k = 1; k <= 7; k++) {
      const j = (i + k) % 7, h = S.draft.hours[j];
      if (h.open && !hourErr(h)) return ` · buka lagi ${k === 1 ? "besok" : k === 7 ? DAYS[j] + " depan" : DAYS[j]} pukul ${dotTime(h.from)}`;
    }
    return " · belum ada hari buka";
  }
  let lastStatus = "";
  function renderStatus() {
    const i = todayIdx(), h = S.draft.hours[i], cur = nowHM();
    let tone, text;
    if (hourErr(h)) { tone = "warn"; text = `jam hari ${DAYS[i]} belum lengkap`; }
    else if (!h.open) { tone = "off"; text = `Tutup hari ini (${DAYS[i]})` + nextOpen(i); }
    else if (cur < h.from) { tone = "off"; text = `Belum buka · buka pukul ${dotTime(h.from)}`; }
    else if (cur < h.to) { tone = "ok"; text = `Buka · tutup pukul ${dotTime(h.to)}`; }
    else { tone = "off"; text = "Sudah tutup" + nextOpen(i); }
    const html = `<i class="pg-dot" data-tone="${tone}" aria-hidden="true"></i><span><b>Sekarang:</b> ${esc(text)}</span>`;
    if (html !== lastStatus || !$("now").innerHTML) { $("now").innerHTML = html; lastStatus = html; }
  }

  /* ===== Pajak: contoh tagihan ===== */
  function renderCalc() {
    const box = $("calc"), t = S.draft.tax_percent, s = S.draft.service_percent;
    if (pctErr(t) || pctErr(s)) {
      box.innerHTML = `<div class="pg-calc-head"><span>Contoh tagihan</span></div><p class="pg-calc-sum">Lengkapi angka pajak dan biaya layanan untuk melihat contohnya.</p>`;
      return;
    }
    const base = 100000, incl = S.draft.tax_inclusive;
    const svc = Math.round(base * s / 100);
    const tax = incl ? Math.round(base - base / (1 + t / 100)) : Math.round(base * t / 100);
    const total = base + svc + (incl ? 0 : tax);
    const steps = [
      { k: "Contoh tagihan", v: rp(base), d: incl ? "termasuk pajak" : "harga menu" },
      { k: `Pajak ${pct(t)}%`, v: (incl ? "" : "+ ") + rp(tax), d: incl ? "sudah di harga" : "ditambahkan" },
      { k: `Layanan ${pct(s)}%`, v: "+ " + rp(svc), d: s ? "ditambahkan" : "tidak dipungut" },
      { k: "Total dibayar", v: rp(total), d: "oleh pelanggan", total: true },
    ];
    box.innerHTML = `
      <div class="pg-calc-head"><span>Contoh tagihan</span><span class="l-staf-chip" data-tone="plain">${incl ? "Harga termasuk pajak" : "Pajak ditambahkan"}</span></div>
      <div class="pg-calc-flow">${steps.map((x) => `<div class="pg-cstep"${x.total ? " data-total" : ""}><small>${esc(x.k)}</small><strong>${esc(x.v)}</strong><em>${esc(x.d)}</em></div>`).join("")}</div>
      <p class="pg-calc-sum">Untuk pesanan senilai <b>${rp(base)}</b>, pelanggan membayar <b>${rp(total)}</b>${incl && t ? `, dan ${rp(tax)} di antaranya adalah pajak` : ""}.</p>`;
  }

  /* ===== Pratinjau ===== */
  const safePct = (v) => (pctErr(v) ? 0 : v);
  function previewSettings() {
    const D = S.draft;
    return {
      cafe_name: D.cafe_name.trim() || "Nama kafe", address: oneLine(D.address), phone: D.phone.trim(),
      tax_percent: D.tax_inclusive ? 0 : safePct(D.tax_percent), service_percent: safePct(D.service_percent), receipt: D.receipt,
    };
  }
  function receiptHTML(o, s) {
    const R = s.receipt;
    const sub = sum(o.items, (i) => i.price * i.qty), tax = Math.round(sub * s.tax_percent / 100), service = Math.round(sub * s.service_percent / 100), total = sub + tax + service;
    const d = new Date();
    const incl = S.draft.tax_inclusive && !pctErr(S.draft.tax_percent) && S.draft.tax_percent > 0
      ? `<div class="rc-row rc-incl"><span>Termasuk pajak ${esc(pct(S.draft.tax_percent))}%</span><span>${num(sub - sub / (1 + S.draft.tax_percent / 100))}</span></div>` : "";
    return `<div class="l-staf-receipt"${R.paper_mm === 58 ? ' data-paper="58"' : ""}>
      ${R.show_logo ? `<div class="rc-logo">${esc(initials(s.cafe_name) || "?")}</div>` : ""}
      <div class="rc-c"><div class="rc-name">${esc(s.cafe_name)}</div>${R.show_address ? `${esc(s.address)}${s.address && s.phone ? "<br>" : ""}${esc(s.phone)}` : ""}${R.header ? `<div style="margin-top:6px">${esc(R.header)}</div>` : ""}</div>
      <div class="rc-sep"></div>
      <div class="rc-row"><span>${esc(o.code)}</span><span>${tgl(d, { day: "2-digit", month: "2-digit", year: "numeric" })} ${hhmm(d)}</span></div>
      ${R.show_table ? `<div class="rc-row"><span>${o.table ? "Meja " + esc(o.table) : "Bawa pulang"}</span><span>${o.order_type === "MANUAL" ? "Kasir" : "QR"}</span></div>` : ""}
      ${R.show_cashier ? `<div class="rc-row"><span>Kasir</span><span>${esc(o.cashier)}</span></div>` : ""}
      <div class="rc-sep"></div>
      ${o.items.map((i) => `<div class="rc-item"><div>${esc(i.name)}</div><div class="rc-row"><span>${i.qty} x ${num(i.price)}</span><span>${num(i.price * i.qty)}</span></div>${R.show_notes && i.note ? `<div class="rc-note">* ${esc(i.note)}</div>` : ""}</div>`).join("")}
      <div class="rc-sep"></div>
      <div class="rc-row"><span>Subtotal</span><span>${num(sub)}</span></div>
      ${s.tax_percent ? `<div class="rc-row"><span>Pajak ${pct(s.tax_percent)}%</span><span>${num(tax)}</span></div>` : ""}
      ${s.service_percent ? `<div class="rc-row"><span>Layanan ${pct(s.service_percent)}%</span><span>${num(service)}</span></div>` : ""}
      <div class="rc-row rc-total"><span>TOTAL</span><span>${num(total)}</span></div>${incl}
      <div class="rc-row"><span>Non-tunai (${esc(o.payment_channel)})</span><span>${num(total)}</span></div>
      <div class="rc-c" style="margin-top:6px;font-weight:700">** LUNAS **</div>
      <div class="rc-sep"></div>
      <div class="rc-c">${esc(R.footer)}</div>
    </div>`;
  }
  const receiptFor = () => receiptHTML(SAMPLE, previewSettings());

  $("pv-list").innerHTML = ["m1", "d1", "s1"].map((id) => MENUS[id]).map((m) => `
    <div class="pg-c-item"><span class="pg-c-thumb">${m.image_url}</span>
      <span class="pg-c-info"><b>${esc(m.name)}</b><small>${esc(m.desc)}</small><strong>${rp(m.price)}</strong></span>
      <span class="pg-c-add">${icon("plus", 18)}</span></div>`).join("");

  function renderCustomer() {
    const D = S.draft, name = D.cafe_name.trim(), ini = (name && initials(name)) || "?";
    $("pv-logo").textContent = ini;
    $("logo-tile").textContent = ini;
    $("pv-name").textContent = name || "Nama kafe";
    const addr = oneLine(D.address), a = $("pv-addr");
    a.textContent = addr || "Alamat belum diisi";
    a.toggleAttribute("data-empty", !addr);
    $("pv-clock").textContent = hhmm(Date.now());
    const h = D.hours[todayIdx()], bad = !!hourErr(h), pill = $("pv-hours");
    pill.dataset.tone = !h.open ? "danger" : bad ? "warning" : "positive";
    pill.textContent = !h.open ? "Tutup hari ini" : bad ? "Jam belum lengkap" : `Buka · ${dotTime(h.from)}–${dotTime(h.to)}`;
    const ig = $("pv-ig");
    ig.hidden = !D.instagram;
    ig.innerHTML = D.instagram ? `Ikuti kami di Instagram <b>@${esc(D.instagram)}</b>` : "";
  }
  function renderReceipt() {
    $("pv-receipt").innerHTML = receiptFor();
    $("pv-rc-meta").textContent = `Contoh pesanan Meja 07 · dibayar QRIS · kertas ${S.draft.receipt.paper_mm} mm`;
  }

  /* Tab pratinjau */
  const pvTabs = $$('[data-part="pv-tabs"] [role="tab"]');
  function setPreview(which) {
    S.preview = which;
    pvTabs.forEach((t) => {
      const on = t.dataset.pv === which;
      t.setAttribute("aria-selected", String(on));
      t.tabIndex = on ? 0 : -1;
    });
    $$("[data-panel]").forEach((p) => { p.hidden = p.dataset.panel !== which; });
  }
  pvTabs.forEach((t, i) => {
    t.addEventListener("click", () => setPreview(t.dataset.pv), { signal });
    t.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      e.preventDefault();
      const n = pvTabs[(i + (e.key === "ArrowRight" ? 1 : pvTabs.length - 1)) % pvTabs.length];
      setPreview(n.dataset.pv);
      n.focus();
    }, { signal });
  });
  // Saat mengubah isian, tampilkan pratinjau yang paling relevan
  $$("[data-sec][data-preview]").forEach((sec) => {
    const go = () => setPreview(sec.dataset.preview);
    sec.addEventListener("input", go, { signal });
    sec.addEventListener("change", go, { signal });
  });

  /* ===== Penghitung karakter ===== */
  function updateCounters() {
    const h = F.header.value.length, f = F.footer.value.length;
    $("header-count").textContent = `${h}/60`;
    $("footer-count").textContent = `${f}/80`;
    $("header-count").toggleAttribute("data-near", h >= 52);
    $("footer-count").toggleAttribute("data-near", f >= 70);
  }

  /* ===== Status perubahan ===== */
  const toastEl = $("toast");
  const saveState = actions?.querySelector('[data-part="save-state"]');
  let dirty = false;
  function renderDirty() {
    const changed = Object.keys(SECTION_KEYS).filter((sec) => SECTION_KEYS[sec].some((k) => !same(S.draft[k], S.saved[k])));
    $$(".pg-secnav a[data-nav]").forEach((a) => {
      const on = changed.includes(a.dataset.nav);
      a.toggleAttribute("data-changed", on);
      a.querySelector("[data-chg]").textContent = on ? " (ada perubahan)" : "";
    });
    dirty = changed.length > 0;
    $("sb-detail").textContent = dirty ? "Diubah: " + changed.map((s) => SECTION_LABEL[s]).join(", ") : "";
    $("savebar").toggleAttribute("data-show", dirty);
    toastEl.toggleAttribute("data-raised", dirty);
    if (saveState) {
      saveState.dataset.tone = dirty ? "warning" : "positive";
      saveState.textContent = dirty ? "Belum disimpan" : "Semua tersimpan";
    }
  }
  function update() {
    renderCustomer();
    renderReceipt();
    renderStatus();
    renderCalc();
    updateCounters();
    renderDirty();
  }

  /* ===== Toast & cetak ===== */
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    try { if (toastEl.matches(":popover-open")) toastEl.hidePopover(); toastEl.showPopover(); } catch {}
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { try { toastEl.hidePopover(); } catch {} }, 2600);
  }
  onCleanup(() => { clearTimeout(toastTimer); try { toastEl.hidePopover(); } catch {} });
  function printHTML(html) {
    const area = $("print");
    area.innerHTML = html;
    const doc = document.documentElement;
    doc.dataset.lStafPrinting = "";
    const done = () => { delete doc.dataset.lStafPrinting; area.innerHTML = ""; };
    addEventListener("afterprint", done, { once: true, signal });
    print();
  }

  /* ===== Event formulir ===== */
  const toNum = (s) => String(s).trim() === "" ? NaN : Number(String(s).replace(",", "."));
  const SETTERS = {
    name: (v) => { S.draft.cafe_name = v; },
    address: (v) => { S.draft.address = v; },
    phone: (v) => { S.draft.phone = v; },
    ig: (v) => { const clean = v.replace(/^@+/, "").replace(/\s+/g, ""); if (clean !== v) F.ig.value = clean; S.draft.instagram = clean; },
    tax: (v) => { S.draft.tax_percent = toNum(v); },
    service: (v) => { S.draft.service_percent = toNum(v); },
    header: (v) => { S.draft.receipt.header = v; },
    footer: (v) => { S.draft.receipt.footer = v; },
  };
  const LIVE = new Set(["tax", "service"]);
  root.addEventListener("input", (e) => {
    const el = e.target, key = el.dataset.f;
    if (key && SETTERS[key]) {
      SETTERS[key](el.value);
      if (LIVE.has(key)) S.touched.add(key);
      if (RULES[key]) checkField(key);
      update();
    } else if (el.type === "time" && el.closest('[data-part="hours"]')) onHours(e);
  }, { signal });
  root.addEventListener("change", (e) => {
    const el = e.target;
    if (el.dataset.f === "incl") { S.draft.tax_inclusive = el.checked; update(); }
    else if (el.dataset.rc) { S.draft.receipt[el.dataset.rc] = el.checked; update(); }
    else if (el.closest('[data-part="hours"]')) onHours(e);
  }, { signal });
  root.addEventListener("focusout", (e) => {
    const key = e.target.dataset?.f;
    if (key && RULES[key]) { S.touched.add(key); checkField(key); }
  }, { signal });

  $("same-all").addEventListener("click", () => {
    const mon = S.draft.hours[0];
    if (hourErr(mon)) { S.touched.add("h0"); checkHour(0); toast("Perbaiki dulu jam hari Senin"); return; }
    S.draft.hours = S.draft.hours.map(() => ({ ...mon }));
    for (let i = 1; i < 7; i++) S.touched.delete("h" + i);
    renderHours();
    setPreview("pelanggan");
    update();
    toast(mon.open ? `Semua hari kini buka ${dotTime(mon.from)}–${dotTime(mon.to)}` : "Semua hari diatur tutup, sama seperti Senin");
  }, { signal });

  function setPaper(mm) { $$('[data-part="paper-seg"] button').forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.mm) === mm))); }
  $("paper-seg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-mm]");
    if (!b) return;
    S.draft.receipt.paper_mm = Number(b.dataset.mm) === 58 ? 58 : 80;
    setPaper(S.draft.receipt.paper_mm);
    setPreview("struk");
    update();
  }, { signal });
  $("test-print").addEventListener("click", () => { setPreview("struk"); printHTML(receiptFor()); }, { signal });

  /* Logo (prototipe) */
  const dz = $("logo-drop");
  const logoMsg = () => toast("Unggah logo belum aktif di prototipe — sementara pakai inisial");
  dz.addEventListener("click", logoMsg, { signal });
  ["dragenter", "dragover"].forEach((t) => dz.addEventListener(t, (e) => { e.preventDefault(); dz.setAttribute("data-drag", ""); }, { signal }));
  ["dragleave", "drop"].forEach((t) => dz.addEventListener(t, (e) => {
    e.preventDefault();
    dz.removeAttribute("data-drag");
    if (t === "drop") logoMsg();
  }, { signal }));

  /* ===== Simpan & batalkan ===== */
  const mainEl = root.querySelector(".p-pengaturan");
  const focusMain = () => mainEl.focus({ preventScroll: true });
  function save() {
    const D = S.draft;
    Object.keys(RULES).forEach((k) => S.touched.add(k));
    D.hours.forEach((_, i) => S.touched.add("h" + i));
    Object.keys(RULES).forEach(checkField);
    D.hours.forEach((_, i) => checkHour(i));
    const firstBad = root.querySelector('.pg-forms [aria-invalid="true"]');
    if (firstBad) {
      firstBad.focus({ preventScroll: true });
      firstBad.scrollIntoView({ behavior: scrollBehavior, block: "center" });
      toast("Ada isian yang perlu diperbaiki dulu");
      return;
    }
    // Rapikan spasi di awal/akhir teks sebelum disimpan
    D.cafe_name = D.cafe_name.trim(); D.address = D.address.trim(); D.phone = D.phone.trim();
    D.receipt.header = D.receipt.header.trim(); D.receipt.footer = D.receipt.footer.trim();
    F.name.value = D.cafe_name; F.address.value = D.address; F.phone.value = D.phone;
    F.header.value = D.receipt.header; F.footer.value = D.receipt.footer;
    S.saved = clone(D); // prototipe: tersimpan di memori sesi ini
    update();
    focusMain();
    toast("Pengaturan disimpan — halaman pelanggan & struk ikut diperbarui");
  }
  function cancel() {
    S.draft = clone(S.saved);
    S.touched.clear();
    $$("[data-err]").forEach((el) => showErr(el, ""));
    fillForm();
    update();
    focusMain();
    toast("Perubahan dibatalkan");
  }
  $("save").addEventListener("click", save, { signal });
  $("cancel").addEventListener("click", cancel, { signal });
  document.addEventListener("keydown", (e) => {
    if (!locked && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
      e.preventDefault();
      if (dirty) save(); else toast("Belum ada perubahan untuk disimpan");
    }
  }, { signal });
  addEventListener("beforeunload", (e) => {
    if (!dirty || locked) return;
    e.preventDefault();
    e.returnValue = "";
  }, { signal });

  /* ===== Navigasi bagian + scroll-spy (wadah gulir = window) ===== */
  const navLinks = $$(".pg-secnav a[data-nav]");
  const secs = $$("[data-sec]");
  let spyLockUntil = 0;
  const navIn = root.querySelector(".pg-secnav-in");
  let activeKey = null;
  function setActive(key) {
    navLinks.forEach((a) => a.setAttribute("aria-current", a.dataset.nav === key ? "true" : "false"));
    if (key === activeKey) return;
    activeKey = key;
    // Jaga tautan aktif tetap terlihat di bilah navigasi yang bisa digeser (layar sempit)
    const a = navLinks.find((x) => x.dataset.nav === key), box = navIn.getBoundingClientRect(), r = a?.getBoundingClientRect();
    if (!r || navIn.scrollWidth <= navIn.clientWidth) return;
    if (r.left < box.left) navIn.scrollLeft -= box.left - r.left + 8;
    else if (r.right > box.right) navIn.scrollLeft += r.right - box.right + 8;
  }
  function spy() {
    if (Date.now() < spyLockUntil || locked) return;
    const line = matchMedia("(max-width: 720px)").matches ? 200 : 140;
    let cur = secs[0].dataset.sec;
    secs.forEach((s) => { if (s.getBoundingClientRect().top <= line) cur = s.dataset.sec; });
    const atBottom = scrollY > 0 && innerHeight + scrollY >= document.documentElement.scrollHeight - 4;
    if (atBottom && matchMedia("(min-width: 901px)").matches) cur = secs[secs.length - 1].dataset.sec;
    setActive(cur);
  }
  let spyRaf = 0;
  addEventListener("scroll", () => { cancelAnimationFrame(spyRaf); spyRaf = requestAnimationFrame(spy); }, { passive: true, signal });
  addEventListener("resize", spy, { signal });
  onCleanup(() => cancelAnimationFrame(spyRaf));
  root.querySelector(".pg-secnav").addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (!a) return;
    e.preventDefault(); // jangan ubah hash router
    const target = a.dataset.nav ? root.querySelector(`[data-sec="${a.dataset.nav}"]`) : $("preview");
    if (!target) return;
    if (a.dataset.nav) { setActive(a.dataset.nav); spyLockUntil = Date.now() + 900; }
    target.scrollIntoView({ behavior: scrollBehavior, block: "start" });
    target.focus({ preventScroll: true });
  }, { signal });

  /* ===== Gerbang peran: kasir tidak bisa membuka halaman khusus pemilik (prototipe) ===== */
  let locked = false;
  function applyRole() {
    let role = "OWNER";
    try { role = JSON.parse(localStorage.getItem("iulfnb:role")) === "CASHIER" ? "CASHIER" : "OWNER"; } catch {}
    locked = role === "CASHIER";
    $("locked").hidden = !locked;
    $("body").hidden = locked;
    if (actions) for (const el of actions.children) el.hidden = locked;
    if (locked) $("locked-text").innerHTML = `Akun <b>Rina Kartika</b> (Kasir) tidak punya akses ke <b>Pengaturan</b>. Minta pemilik mengubah hak akses di menu Akun &amp; Staf.`;
    else spy();
  }
  addEventListener("storage", (e) => { if (e.key === "iulfnb:role") applyRole(); }, { signal });

  /* ===== Mulai ===== */
  fillForm();
  update();
  setPreview(S.preview);
  applyRole();
  // Status "Sekarang: Buka/Tutup" & jam di pratinjau ikut berjalan
  const tick = setInterval(() => { renderStatus(); renderCustomer(); }, 30000);
  onCleanup(() => clearInterval(tick));
</script>
