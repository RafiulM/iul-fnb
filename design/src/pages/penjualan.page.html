<style>
  /* Penjualan — grafik memakai oranye primer (--color-accent) saja; elemen di luar grafik tetap netral.
     - Sorotan: batang lampau = oranye muda --pj-mute (accent 32%); batang berjalan = accent penuh.
       Relief: label langsung, tooltip, tampilan tabel.
     - Dua seri (porsi): --pj-a (accent penuh) vs --pj-split (accent 32%); legenda bernilai.
     - Peta jam: ramp sekuensial accent 16/34/58/100% lalu accent-text (monoton makin gelap). */
  .p-penjualan {
    --pj-a: var(--color-accent);
    --pj-mute: color-mix(in srgb, var(--color-accent) 32%, var(--color-surface));
    --pj-mute-on: color-mix(in srgb, var(--color-accent) 52%, var(--color-surface));
    --pj-split: color-mix(in srgb, var(--color-accent) 32%, var(--color-surface));
    --pj-h1: color-mix(in srgb, var(--color-accent) 16%, var(--color-surface));
    --pj-h2: color-mix(in srgb, var(--color-accent) 34%, var(--color-surface));
    --pj-h3: color-mix(in srgb, var(--color-accent) 58%, var(--color-surface));
    --pj-h4: var(--color-accent);
    --pj-h5: var(--color-accent-text);
    display: grid; gap: var(--space-6); align-content: start; min-height: 100vh; font-family: var(--font-ui);
  }
  .pj-body { display: grid; gap: var(--space-6); align-content: start; min-width: 0; }
  .pj-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .pj-period { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--space-2); margin: calc(var(--space-4) * -1) 0 0; font: 400 var(--text-body-sm) / var(--leading-body-sm) var(--font-ui); color: var(--color-text-muted); }
  .pj-period iconify-icon { font-size: 16px; }
  .pj-period b { font-weight: 600; color: var(--color-text); }

  /* KPI */
  .pj-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); }
  .pj-kpis .l-staf-metric > strong { font-variant-numeric: normal; }
  .pj-kpis .l-staf-metric > strong.pj-kpi-name { font: 500 20px / 34.5px var(--font-ui); letter-spacing: -0.4px; }
  .pj-kpis .l-staf-metric > small { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; }
  .pj-dir { display: inline-flex; align-items: center; gap: 2px; font-weight: 600; color: var(--color-text); font-variant-numeric: tabular-nums; }
  .pj-dir iconify-icon { align-self: center; font-size: 15px; }
  .pj-dir[data-dir="up"] iconify-icon { color: var(--color-positive); }
  .pj-dir[data-dir="down"] iconify-icon { color: var(--color-danger); }
  .pj-dir[data-dir="flat"] iconify-icon { color: var(--color-text-muted); }
  .pj-kpis small b { font-weight: 600; color: var(--color-text); }

  .pj-row2 { display: grid; grid-template-columns: minmax(0, 1.85fr) minmax(0, 1fr); gap: var(--space-4); }
  .pj-row3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr); gap: var(--space-4); }

  /* Kartu grafik */
  .pj-tools { display: flex; align-items: center; gap: var(--space-2); }
  .pj-seg-sm button { min-height: 32px; padding: 4px 12px; }
  .pj-toggle[aria-pressed="true"] { border-color: var(--color-text); color: var(--color-text); background: var(--color-surface-muted); }
  .pj-chart-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px var(--space-4); margin-bottom: var(--space-2); font: 400 var(--text-body-sm) / 1.4 var(--font-ui); color: var(--color-text-muted); }
  .pj-chart-meta b { font-weight: 600; color: var(--color-text); }
  .pj-dot-sep { margin: 0 6px; }
  .pj-keys { display: flex; flex-wrap: wrap; gap: var(--space-4); }
  .pj-key { display: inline-flex; align-items: center; gap: 6px; font: 500 var(--text-label-sm) / 1 var(--font-ui); color: var(--color-text-muted); }
  .pj-key i { width: 10px; height: 10px; border-radius: 3px; }
  .pj-chart-box { position: relative; }
  .pj-plot { border-radius: var(--radius-compact); touch-action: pan-y; outline: 0; }
  .pj-plot:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 6px; }
  .pj-cx { display: block; width: 100%; height: auto; overflow: visible; }
  .pj-cx text { font-family: var(--font-ui); font-size: 11px; font-weight: 500; fill: var(--color-text-muted); font-variant-numeric: tabular-nums; }
  .pj-cx .xlab.cur, .pj-cx .xsub.cur { fill: var(--color-text); font-weight: 700; }
  .pj-cx .xlab.fut { font-weight: 400; }
  .pj-cx .grid { stroke: var(--color-border); stroke-width: 1; }
  .pj-cx .grid.base { stroke: color-mix(in srgb, var(--color-text) 24%, transparent); }
  .pj-cx .bar { fill: var(--pj-mute); transition: fill var(--duration-fast) var(--ease-standard); }
  .pj-cx .bar.cur { fill: var(--color-accent); }
  .pj-cx .bar.on { fill: var(--pj-mute-on); }
  .pj-cx .bar.cur.on { fill: var(--color-accent-text); }
  .pj-cx .hband { fill: color-mix(in srgb, var(--color-text) 5%, transparent); }
  .pj-cx .dl { font-weight: 600; fill: var(--color-text); paint-order: stroke; stroke: var(--color-surface); stroke-width: 3px; stroke-linejoin: round; }

  .pj-tip { position: absolute; inset-inline-start: 0; inset-block-start: 0; z-index: 5; padding: 9px 12px 10px; border-radius: var(--radius-compact); background: var(--color-primary); color: var(--color-on-primary); box-shadow: var(--shadow-sm); font: 400 12px / 1.4 var(--font-ui); white-space: nowrap; pointer-events: none; transform: translate(-50%, calc(-100% - 10px)); }
  .pj-tip .tt { margin-bottom: 5px; font-weight: 500; color: rgb(255 255 255 / 76%); }
  .pj-tip .tr { display: flex; align-items: center; gap: 7px; }
  .pj-tip .tr + .tr { margin-top: 2px; }
  .pj-tip .tr b { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pj-tip .tr span { color: rgb(255 255 255 / 76%); }
  .pj-tip .tr.sub { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgb(255 255 255 / 16%); }
  .pj-tip .k { flex: none; width: 12px; height: 3px; border-radius: 2px; background: transparent; }

  .pj-chart-table { max-height: 300px; overflow: auto; border: var(--border-hairline) solid var(--color-border); border-radius: var(--radius-image); }
  .pj-chart-table thead th { position: sticky; top: 0; z-index: 1; background: var(--color-surface); }
  .pj-chart-table tfoot td { padding: 12px 16px; border-top: var(--border-hairline) solid var(--color-border-strong); background: var(--color-surface-subtle); font-weight: 600; }
  .pj-chart-table tfoot td:first-child { padding-inline-start: var(--spacing-20); }
  .pj-chart-table tfoot td:last-child { padding-inline-end: var(--spacing-20); }
  .pj-chart-table tr[data-cur] td { background: var(--color-surface-subtle); }
  .pj-chart-table td .l-staf-chip { margin-inline-start: 6px; }
  .p-penjualan .l-staf-empty h3 { margin: 0; font: 600 var(--text-body-md) / 1.3 var(--font-ui); color: var(--color-text); }
  .p-penjualan .l-staf-empty p { margin: 0; max-width: 36ch; }
  .pj-chart-empty { padding-block: 56px; }

  /* Menu terlaris */
  .pj-top-card { display: flex; flex-direction: column; }
  .pj-top { display: grid; align-content: start; gap: var(--space-4); margin: 0; padding: var(--space-4) var(--spacing-20) var(--spacing-20); list-style: none; }
  .pj-top > li { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: var(--space-3); }
  .pj-top .l-staf-thumb { width: 40px; height: 40px; font-size: 20px; }
  .pj-tm-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
  .pj-tm-head strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 var(--text-body-sm) / 1.3 var(--font-ui); }
  .pj-tm-head span { flex: none; font: 400 var(--text-label-sm) / 1.3 var(--font-ui); color: var(--color-text-muted); }
  .pj-tm-head span b { font-size: var(--text-body-sm); font-weight: 600; color: var(--color-text); font-variant-numeric: tabular-nums; }
  .pj-tm-bar { height: 6px; margin: 7px 0 5px; border-radius: 3px; background: var(--color-surface-muted); }
  .pj-tm-bar i { display: block; height: 100%; min-width: 2px; border-radius: 0 3px 3px 0; background: var(--color-accent); }
  .pj-tm-foot { font: 400 var(--text-label-sm) / 1.3 var(--font-ui); color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
  .pj-top > li.pj-top-empty { display: block; }

  /* Porsi */
  .pj-share-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2); }
  .pj-share-head strong { font: 400 var(--text-heading-md) / 1.1 var(--font-ui); letter-spacing: var(--tracking-heading); }
  .pj-share-head span { font: 500 var(--text-body-sm) / 1.3 var(--font-ui); color: var(--color-text-muted); }
  .pj-stack { display: flex; gap: 2px; height: 14px; margin: var(--space-4) 0; }
  .pj-stack i { display: block; height: 100%; min-width: 3px; }
  .pj-stack i:first-child { border-radius: 4px 0 0 4px; }
  .pj-stack i:last-child { border-radius: 0 4px 4px 0; }
  .pj-stack i:only-child { border-radius: 4px; }
  .pj-legend { display: grid; gap: var(--space-3); margin: 0; padding: 0; list-style: none; }
  .pj-legend li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
  .pj-sw { width: 12px; height: 12px; border-radius: 3px; }
  .pj-nm { min-width: 0; font: 600 var(--text-body-sm) / 1.3 var(--font-ui); }
  .pj-nm small, .pj-vl small { display: block; font: 400 var(--text-label-sm) / 1.35 var(--font-ui); color: var(--color-text-muted); }
  .pj-vl { text-align: end; font-variant-numeric: tabular-nums; }
  .pj-vl b { display: block; font: 600 var(--text-body-sm) / 1.3 var(--font-ui); }
  .pj-note { display: flex; align-items: flex-start; gap: var(--space-2); margin: var(--space-4) 0 0; padding-top: var(--space-3); border-top: var(--border-hairline) solid var(--color-border); font: 400 var(--text-label-sm) / 1.45 var(--font-ui); color: var(--color-text-muted); }
  .pj-note > iconify-icon { flex: none; margin-top: 1px; font-size: 15px; }
  .pj-note b { font-weight: 600; color: var(--color-text); }
  .pj-note .pj-dir { font-size: var(--text-label-sm); }
  .pj-card-empty { padding-block: var(--space-6); }

  /* Peta jam */
  .pj-scale { display: flex; align-items: center; gap: 3px; font: 500 var(--text-label-sm) / 1 var(--font-ui); color: var(--color-text-muted); }
  .pj-scale i { width: 14px; height: 10px; border-radius: 2px; }
  .pj-scale span { margin: 0 4px; }
  .pj-heat-wrap { position: relative; border-radius: var(--radius-compact); outline: 0; }
  .pj-heat-wrap:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 6px; }
  .pj-heat { display: grid; grid-template-columns: 34px repeat(15, minmax(0, 1fr)); align-items: center; gap: 2px; }
  .pj-heat[data-one] { grid-template-columns: 56px repeat(15, minmax(0, 1fr)); }
  .pj-heat .rl { font: 500 11px / 1 var(--font-ui); color: var(--color-text-muted); white-space: nowrap; }
  .pj-heat .hc { height: 18px; border-radius: 4px; background: var(--color-surface-muted); transition: box-shadow var(--duration-fast) var(--ease-standard); }
  .pj-heat .hx { margin-top: 4px; font: 500 11px / 1 var(--font-ui); color: var(--color-text-muted); text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pj-heat .hc.na { background: transparent; box-shadow: inset 0 0 0 1px var(--color-border); }
  .pj-heat .hc.on { box-shadow: 0 0 0 2px var(--color-surface), 0 0 0 3.5px var(--color-text); }
  .b1 { background: var(--pj-h1) !important; } .b2 { background: var(--pj-h2) !important; } .b3 { background: var(--pj-h3) !important; }
  .b4 { background: var(--pj-h4) !important; } .b5 { background: var(--pj-h5) !important; }
  .pj-heat-note { margin-top: var(--space-4); font: 400 var(--text-body-sm) / 1.45 var(--font-ui); color: var(--color-text-muted); }
  .pj-heat-note b { font-weight: 600; color: var(--color-text); }

  /* Riwayat transaksi */
  .pj-tx-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .pj-tx-tools .l-staf-search { width: 280px; min-width: 0; }
  .pj-tx-tools .l-staf-select { width: auto; min-width: 168px; min-height: 44px; padding-block: 8px; border-radius: var(--radius-control); font-size: 15px; }
  .pj-tx-wrap { margin-top: var(--spacing-20); border-top: var(--border-hairline) solid var(--color-border); }
  .pj-tx-table { min-width: 900px; }
  .pj-tx-table td { white-space: nowrap; }
  .pj-tx-table td.items { width: 32%; max-width: 0; white-space: normal; }
  .pj-tx-table td.items span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text-muted); }
  .pj-tx-table tbody tr[data-i] { cursor: pointer; }
  .pj-tx-table tbody tr[data-i]:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: -2px; }
  .pj-tx-table tr[data-void] .tot { color: var(--color-text-muted); text-decoration: line-through; }
  .pj-tx-table .tot { font-weight: 600; }
  .pj-tx-table .pm, .pj-tx-table .src { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
  .pj-tx-table .pm iconify-icon, .pj-tx-table .src iconify-icon { font-size: 16px; color: var(--color-text-muted); }
  .pj-tx-table .when b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pj-tx-table .when span { margin-inline-start: 6px; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
  .pj-tx-table .code { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pj-muted { color: var(--color-text-muted); }
  .pj-tx-all { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; border-radius: 4px; color: var(--color-text); font: 600 var(--text-body-sm) / 1.4 var(--font-ui); text-decoration: underline; text-decoration-color: var(--color-border-strong); text-underline-offset: 3px; transition: color var(--duration-fast) var(--ease-standard); }
  .pj-tx-all:hover { color: var(--color-accent-text); text-decoration-color: currentColor; }
  .pj-tx-all:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 3px; }
  .pj-tx-all iconify-icon { font-size: 16px; }
  .pj-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--spacing-20); border-top: var(--border-hairline) solid var(--color-border); font: 400 var(--text-body-sm) / 1.4 var(--font-ui); color: var(--color-text-muted); }
  .pj-foot b { font-weight: 600; color: var(--color-text); font-variant-numeric: tabular-nums; }
  .pj-pager { display: flex; align-items: center; gap: var(--space-2); font-weight: 500; font-variant-numeric: tabular-nums; }
  .pj-pager .l-staf-iconbtn { width: 36px; height: 36px; }
  .pj-pager .l-staf-iconbtn:disabled { cursor: not-allowed; background: var(--color-surface-muted); color: var(--color-text-faint); }

  /* Dialog struk */
  .pj-st-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--space-4); }
  .pj-st-alert { margin-bottom: var(--space-4); }
  .pj-paper { padding: var(--spacing-20) var(--space-3) var(--space-6); border-radius: var(--radius-image); background: var(--color-surface-muted); }

  /* Dialog unduh */
  .pj-dl { display: grid; gap: var(--spacing-20); }
  .pj-fs { display: grid; gap: var(--space-2); min-width: 0; margin: 0; padding: 0; border: 0; }
  .pj-fs legend { margin-bottom: var(--space-2); padding: 0; font: 600 var(--text-body-sm) / var(--leading-body-sm) var(--font-ui); }
  .pj-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
  .pj-opt { position: relative; display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-4); border: var(--border-hairline) solid var(--color-border-strong); border-radius: var(--radius-image); background: var(--color-surface); cursor: pointer; transition: border-color var(--duration-fast) var(--ease-standard); }
  .pj-opt:hover { border-color: var(--color-text); }
  .pj-opt input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .pj-opt > iconify-icon { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-compact); background: var(--color-surface-muted); color: var(--color-text); font-size: 17px; }
  .pj-opt strong { display: block; font: 600 var(--text-body-sm) / 1.3 var(--font-ui); }
  .pj-opt small { display: block; margin-top: 2px; font: 400 var(--text-label-sm) / 1.4 var(--font-ui); color: var(--color-text-muted); }
  .pj-opt:has(input:checked) { border-color: var(--color-primary); box-shadow: inset 0 0 0 1px var(--color-primary); }
  .pj-opt:has(input:focus-visible) { outline: 2px solid var(--color-focus-ring); outline-offset: 3px; }
  .pj-sum { padding: var(--space-3) var(--space-4); border: var(--border-hairline) solid var(--color-border); border-radius: var(--radius-image); background: var(--color-surface-subtle); }
  .pj-sum h3 { margin: 0 0 var(--space-3); font: 600 var(--text-label-sm) / var(--leading-label-sm) var(--font-ui); color: var(--color-text-muted); }
  .pj-sum dl { display: grid; gap: var(--space-2); margin: 0; }
  .pj-sum dl div { display: flex; justify-content: space-between; gap: var(--space-4); font: 400 var(--text-body-sm) / 1.4 var(--font-ui); }
  .pj-sum dt { flex: none; color: var(--color-text-muted); }
  .pj-sum dd { min-width: 0; margin: 0; font-weight: 600; text-align: end; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .pj-sum dd small { font-weight: 400; color: var(--color-text-muted); }
  .pj-sum .fname { font: 500 12px / 1.4 var(--font-mono); }
  .pj-sum .l-staf-error { margin-top: var(--space-3); }

  /* Terkunci (akun kasir) */
  .pj-locked .l-staf-empty { padding-block: var(--space-12); }
  .pj-locked .l-staf-empty p { max-width: 46ch; }
  .pj-locked .l-staf-btn { margin-top: var(--space-3); }

  @media (prefers-reduced-motion: reduce) {
    .pj-cx .bar, .pj-heat .hc, .pj-opt { transition: none; }
  }
  @media (max-width: 1180px) {
    .pj-row3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pj-row3 .pj-heat-card { grid-column: 1 / -1; }
    .pj-heat .hc { height: 22px; }
  }
  @media (max-width: 1100px) {
    .pj-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pj-row2 { grid-template-columns: minmax(0, 1fr); }
    .pj-top { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--space-8); }
  }
  @media (max-width: 980px) {
    .pj-tx-tools { width: 100%; }
    .pj-tx-tools .l-staf-search { flex: 1 1 220px; width: auto; }
  }
  @media (max-width: 720px) {
    [data-part="range-seg"] { display: flex; flex: 1 1 100%; }
    [data-part="range-seg"] button { flex: 1; }
    [data-action="download"] { flex: 1 1 100%; }
    .pj-row3 { grid-template-columns: minmax(0, 1fr); }
    .pj-top { grid-template-columns: minmax(0, 1fr); }
    .pj-heat .hc { height: 18px; }
    .pj-tx-tools .l-staf-search { flex: 1 1 100%; }
    .pj-tx-tools .l-staf-select { flex: 1; min-width: 0; padding-inline: 14px 34px; background-position: right 12px center; font-size: var(--text-body-sm); }
  }
  @media (max-width: 560px) {
    .pj-kpis { grid-template-columns: minmax(0, 1fr); }
    .pj-opts { grid-template-columns: minmax(0, 1fr); }
    .pj-scale { display: none; }
  }
</style>

<template data-slot="header-actions">
  <div class="l-staf-seg" role="group" aria-label="Rentang waktu" data-part="range-seg">
    <button type="button" data-range="today" aria-pressed="false">Hari ini</button>
    <button type="button" data-range="7d" aria-pressed="true">7 hari</button>
    <button type="button" data-range="30d" aria-pressed="false">30 hari</button>
  </div>
  <button class="l-staf-btn" data-variant="primary" type="button" data-action="download"><iconify-icon icon="lucide:download" aria-hidden="true"></iconify-icon>Unduh laporan</button>
</template>

<template data-slot="content">
  <main aria-label="Penjualan" class="p-penjualan" data-node-id="penjualan">

<script>
  /* ===== Data tiruan (struktur mengikuti skema PRD §6, sama dengan halaman lain) ===== */
  const SETTINGS = {
    cafe_name: "Kedai Senja", address: "Jl. Kaliurang Km 5, Yogyakarta", phone: "0812-2700-1234",
    open_hour: "08:00", close_hour: "22:00", tax_percent: 10, service_percent: 0,
    receipt: { show_logo: true, show_address: true, show_table: true, show_cashier: true, show_notes: true, header: "", footer: "Terima kasih, sampai jumpa lagi!" },
  };
  const MENUS = [
    ["m1", "makanan", "Nasi Goreng Kampung", 32000, "🍳"], ["m2", "makanan", "Ayam Geprek Sambal Matah", 35000, "🍗"],
    ["m3", "makanan", "Mie Goreng Jawa", 30000, "🍜"], ["m4", "makanan", "Rice Bowl Chicken Teriyaki", 36000, "🍱"],
    ["m5", "makanan", "Nasi Ayam Bakar Madu", 38000, "🍖"], ["d1", "minuman", "Kopi Susu Gula Aren", 22000, "☕"],
    ["d2", "minuman", "Es Americano", 20000, "🧊"], ["d3", "minuman", "Matcha Latte", 28000, "🍵"],
    ["d4", "minuman", "Es Teh Manis", 10000, "🥤"], ["d5", "minuman", "Lemon Tea", 15000, "🍋"],
    ["d6", "minuman", "Jus Alpukat", 25000, "🥑"], ["s1", "lainnya", "Kentang Goreng", 20000, "🍟"],
    ["s2", "lainnya", "Pisang Goreng Keju", 18000, "🍌"], ["s3", "lainnya", "Roti Bakar Cokelat Keju", 22000, "🍞"],
    ["s4", "lainnya", "Croissant Butter", 24000, "🥐"], ["s5", "lainnya", "Air Mineral", 8000, "💧"],
  ].map(([id, category_id, name, price, image_url]) => ({ id, category_id, name, price, image_url }));
  const MENU_WEIGHT = { m1: 9, m2: 7, m3: 5, m4: 5, m5: 3, d1: 12, d2: 6, d3: 5, d4: 8, d5: 4, d6: 2, s1: 8, s2: 4, s3: 4, s4: 3, s5: 4 };
  const TABLES = Array.from({ length: 12 }, (_, i) => ({ table_number: String(i + 1).padStart(2, "0") }));
  const CASHIERS = ["Rina Kartika", "Dimas Pratama"];
  const USERS = { OWNER: { name: "Iul Rahman", role: "Pemilik" }, CASHIER: { name: "Rina Kartika", role: "Kasir" } };
  const ORDER_STATUS = { SELESAI: { label: "Selesai", tone: "positive" }, DIBATALKAN: { label: "Dibatalkan", tone: "danger" } };
  const PAY_METHOD = { CASH: "Tunai", NON_CASH: "Non-tunai" };
  const KEYS = { role: "iulfnb:role", pos: "iulfnb:pos" };

  /* ===== Util ===== */
  const $ = (part, el = root) => el.querySelector(`[data-part="${part}"]`);
  const $$ = (sel, el = root) => [...el.querySelectorAll(sel)];
  const rp = (n) => "Rp " + Math.round(n).toLocaleString("id-ID");
  const rpShort = (n) => n >= 1e6 ? "Rp " + (n / 1e6).toLocaleString("id-ID", { maximumFractionDigits: 1 }) + " jt" : n >= 1e3 ? "Rp " + Math.round(n / 1e3) + " rb" : rp(n);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const hhmm = (d) => new Date(d).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
  const tgl = (d, opt = { day: "numeric", month: "short", year: "numeric" }) => new Date(d).toLocaleDateString("id-ID", opt);
  const tglPanjang = (d) => new Date(d).toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const sum = (arr, f = (x) => x) => arr.reduce((a, x) => a + f(x), 0);
  const initials = (name) => name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const icon = (name, size = 18) => `<iconify-icon icon="lucide:${name}" aria-hidden="true" style="font-size:${size}px"></iconify-icon>`;
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } } };
  const menuById = Object.fromEntries(MENUS.map((m) => [m.id, m]));

  /** RNG deterministik (mulberry32) supaya data tiruan konsisten tiap muat ulang */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function orderTotals(items, s = SETTINGS) {
    const sub = sum(items, (i) => i.price * i.qty);
    const tax = Math.round(sub * s.tax_percent / 100);
    const service = Math.round(sub * s.service_percent / 100);
    return { sub, tax, service, total: sub + tax + service, count: sum(items, (i) => i.qty) };
  }
  /** Riwayat transaksi tiruan (deterministik, sama dengan prototipe) untuk `days` hari ke belakang, termasuk hari ini s.d. sekarang */
  function genTransactions(days = 60) {
    const r = rng(20261011);
    const pool = MENUS.flatMap((m) => Array(MENU_WEIGHT[m.id] || 1).fill(m));
    const pickMenu = () => pool[Math.floor(r() * pool.length)];
    const hourPool = [0, 0, 0, 0, 0, 0, 0, 0, 3, 4, 5, 7, 10, 9, 6, 5, 6, 8, 10, 9, 7, 5, 3, 0].flatMap((w, h) => Array(w).fill(h));
    const out = [];
    const today = new Date(); today.setHours(0, 0, 0, 0);
    for (let d = days - 1; d >= 0; d--) {
      const day = new Date(today); day.setDate(today.getDate() - d);
      const weekend = day.getDay() === 0 || day.getDay() === 6;
      const trend = 1 + (days - d) / days * 0.12;
      const n = Math.round((weekend ? 58 : 40) * trend * (0.85 + r() * 0.3));
      const times = Array.from({ length: n }, () => {
        const t = new Date(day);
        t.setHours(hourPool[Math.floor(r() * hourPool.length)], Math.floor(r() * 60), Math.floor(r() * 60));
        return t;
      }).filter((t) => t <= Date.now()).sort((a, b) => a - b);
      times.forEach((t, i) => {
        const lines = {};
        const k = 1 + Math.floor(r() * r() * 4);
        for (let j = 0; j < k; j++) {
          const m = pickMenu();
          lines[m.id] = lines[m.id] || { menu_id: m.id, name: m.name, image_url: m.image_url, price: m.price, qty: 0, note: "" };
          lines[m.id].qty += r() < .8 ? 1 : 2;
        }
        const items = Object.values(lines);
        const qr = r() < .7;
        const cancelled = r() < .02;
        out.push({
          code: "A-" + String(i + 1).padStart(3, "0"), created_at: t, order_type: qr ? "QR" : "MANUAL",
          table: qr || r() < .5 ? TABLES[Math.floor(r() * 11)].table_number : null,
          items, ...orderTotals(items),
          status: cancelled ? "DIBATALKAN" : "SELESAI", payment_status: cancelled ? "BELUM" : "LUNAS",
          payment_method: cancelled ? null : r() < .4 ? "CASH" : "NON_CASH",
          cashier: CASHIERS[Math.floor(r() * 2)],
        });
      });
    }
    return out.sort((a, b) => b.created_at - a.created_at);
  }

  /** Transaksi sesi kasir hari ini (localStorage "iulfnb:pos" → p.done), hanya dibaca — tidak di-seed bila belum ada */
  function sessionTx() {
    const p = store.get(KEYS.pos, null);
    if (!p || p.v !== 1 || !Array.isArray(p.done) || !(Date.now() - Date.parse(p.seeded_at) <= 12 * 3600e3)) return [];
    const seen = new Set();
    return p.done.filter((o) => o && o.code && (o.status === "SELESAI" || o.status === "DIBATALKAN") && !isNaN(Date.parse(o.created_at)) && !seen.has(o.code) && seen.add(o.code)).map((o) => {
      const items = (Array.isArray(o.items) ? o.items : []).map((i) => ({ menu_id: i.menu_id, name: i.name || menuById[i.menu_id]?.name || "Menu", image_url: i.image_url || menuById[i.menu_id]?.image_url || "🍽️", price: +i.price || 0, qty: +i.qty || 0, note: i.note || "" }));
      const cancelled = o.status === "DIBATALKAN";
      return {
        code: String(o.code), created_at: new Date(o.created_at), order_type: o.order_type === "MANUAL" ? "MANUAL" : "QR", table: o.table || null,
        items, ...orderTotals(items), status: o.status, payment_status: cancelled ? "BELUM" : "LUNAS",
        payment_method: cancelled ? null : o.payment_method === "CASH" ? "CASH" : "NON_CASH", cashier: o.cashier || "-",
        paid_amount: typeof o.paid_amount === "number" ? o.paid_amount : null, session: true,
      };
    });
  }

  /* ===== Waktu acuan. Pratinjau keadaan pagi: #/penjualan?jam=07:30 ===== */
  let NOW_D = new Date();
  const jamParam = new URLSearchParams(location.hash.split("?")[1] || "").get("jam") || new URLSearchParams(location.search).get("jam") || "";
  const sim = /^(\d{1,2})[.:](\d{2})$/.exec(jamParam);
  if (sim) {
    const d = new Date(NOW_D);
    d.setHours(Math.min(23, +sim[1]), Math.min(59, +sim[2]), 0, 0);
    if (d < NOW_D) NOW_D = d;
  }
  const NOWT = +NOW_D;
  const TX = [...genTransactions(60), ...sessionTx()].filter((t) => +t.created_at <= NOWT).sort((a, b) => b.created_at - a.created_at); // terbaru dulu; + transaksi sesi kasir
  TX.forEach((t, i) => { t._i = i; });

  const sod = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const TODAY = sod(NOW_D);
  const pad = (n) => String(n).padStart(2, "0");
  const nf = (n) => Math.round(n).toLocaleString("id-ID");
  const nf1 = (n) => n.toLocaleString("id-ID", { maximumFractionDigits: 1 });
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dShort = (d) => tgl(d, { day: "numeric", month: "short" });
  const dLong = (d) => tgl(d, { weekday: "long", day: "numeric", month: "short" });
  const dCsv = (d) => tgl(d, { day: "2-digit", month: "2-digit", year: "numeric" });
  const wdName = (dow, style) => tgl(addDays(TODAY, dow - TODAY.getDay()), { weekday: style });
  const isDone = (t) => t.status === "SELESAI";
  const inRange = (t, s, e) => { const v = +t.created_at; return v >= s && v <= e; };
  const HOURS = Array.from({ length: 15 }, (_, k) => 8 + k); // 08–22
  const itemsText = (t, x = "×") => t.items.map((i) => `${i.qty}${x} ${i.name}`).join(", ");
  const live = (msg) => { $("live").textContent = msg; };

  /* ===== State (bertahan saat pindah halaman) ===== */
  const PER_PAGE = 15;
  const S = root.penjualanState ??= { range: "7d", metric: "rev", tableView: false, q: "", method: "", status: "", page: 1 };
  const T = { p: null, buckets: null, hasData: false, geo: null, active: null, drawnW: 0, heat: null, hAct: null, struk: null };

  /* ===== Rentang waktu ===== */
  const RANGE = { today: { days: 1, label: "Hari ini" }, "7d": { days: 7, label: "7 hari terakhir" }, "30d": { days: 30, label: "30 hari terakhir" }, month: { label: "Bulan ini" } };
  /** Periode berjalan + periode pembanding yang sama panjang (dipotong di jam yang sama) */
  function period(key) {
    const start = key === "month" ? new Date(TODAY.getFullYear(), TODAY.getMonth(), 1) : addDays(TODAY, -(RANGE[key].days - 1));
    const shift = key === "today" ? 7 : RANGE[key].days; // Hari ini → hari yang sama minggu lalu

  /* ===== Baris periode + KPI ===== */

  /* ===== Grafik penjualan ===== */
  function chartBuckets(p) {

    });

  function niceStep(raw) {
    if (!(raw > 0)) return 1;

  const axisFmt = (v, metric) => metric === "cnt" ? nf(v) : !v ? "0" : v >= 1e6 ? "Rp " + (v / 1e6).toLocaleString("id-ID", { maximumFractionDigits: 2 }) + " jt" : "Rp " + nf(v / 1e3) + " rb";
  const valFmt = (v, metric) => metric === "cnt" ? nf(v) + " pesanan" : rpShort(v);
  const valFull = (v, metric) => metric === "cnt" ? nf(v) + " pesanan" : rp(v);
  /** Batang: ujung data membulat 4px, alas persegi di garis dasar */
  const barPath = (x, y, w, h) => { const r = Math.min(4, w / 2, h); return `M${x},${y + h}V${y + r}A${r},${r} 0 0 1 ${x + r},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${y + h}Z`; };
  const validIdx = () => (T.buckets || []).map((b, i) => b.future ? -1 : i).filter((i) => i >= 0);
  const metricName = () => S.metric === "rev" ? "Penjualan" : "Jumlah pesanan";
  const bestOf = (B, metric) => { const valid = B.filter((b) => !b.future); return valid.reduce((a, b) => b[metric] > a[metric] ? b : a, valid[0]); };

  function chartSummary() {
    const B = T.buckets, metric = S.metric, isHour = S.range === "today";
    const best = bestOf(B, metric), cur = B.find((b) => b.current);
    return `${metricName()} per ${isHour ? "jam" : "hari"}, ${periodText(T.p.start, T.p.end)}. ${isHour ? "Jam" : "Hari"} tersibuk ${best.short}: ${valFull(best[metric], metric)}.` +
      (cur ? ` ${isHour ? "Jam ini" : "Hari ini"} (masih berjalan): ${valFull(cur[metric], metric)}.` : "");
  }
  function drawChart() {
    const plot = $("plot"), B = T.buckets;
    const W = Math.floor(plot.clientWidth);
    if (!W || !B || !B.length || !T.hasData) return;
    T.drawnW = W;
    const metric = S.metric, mode = S.range;
    const vals = B.map((b) => b.future ? 0 : b[metric]);
    const max = Math.max(0, ...vals);
    const step = metric === "cnt" ? Math.max(1, niceStep(max / 4)) : niceStep(Math.max(max, 4000) / 4);
    const yMax = Math.max(step, Math.ceil(max / step) * step);
    const ticks = [];
    for (let k = 0; k * step <= yMax; k++) ticks.push(k * step);
    const tl = ticks.map((v) => axisFmt(v, metric));
    const two = mode === "7d";
    const M = { t: 24, r: 4, b: two ? 42 : 28, l: Math.max(26, Math.ceil(Math.max(...tl.map((s) => s.length)) * 6.3) + 12) };
    const H = W < 520 ? 240 : 300;
    const pw = W - M.l - M.r, ph = H - M.t - M.b, y0 = M.t + ph;
    const Y = (v) => y0 - v / yMax * ph;
    const band = pw / B.length;
    const bw = Math.max(2, Math.min(24, band * (B.length > 20 ? 0.62 : 0.56)));

    B.forEach((b, i) => {

      if (b.sub) s += `<text class="xsub${cls}" x="${cx(i)}" y="${y0 + 33}" text-anchor="middle">${esc(b.sub)}</text>`;

    });

    plot.setAttribute("aria-label", `Grafik ${metricName().toLowerCase()}. Tekan panah kiri atau kanan untuk membaca tiap batang.`);

  function tipHTML(b) {

  const tipText = (b) => `${b.title}${b.current ? ", masih berjalan" : ""}: penjualan ${rp(b.rev)}, ${nf(b.cnt)} pesanan.`;
  function setActive(i, announce) {
    T.active = i;

    if (!svg) { tip.hidden = true; return; }
    svg.querySelectorAll(".bar.on").forEach((el) => el.classList.remove("on"));
    const hb = svg.querySelector(".hband");

    const g = T.geo, b = T.buckets[i];

  function renderChartMeta() {

  /* ===== Menu terlaris ===== */

  /* ===== Porsi: metode pembayaran & sumber pesanan (oranye penuh vs oranye muda) ===== */
  function split(a, b) { const t = a + b; if (!t) return [0, 0]; const x = Math.round(a / t * 100); return [x, 100 - x]; }

  function renderPay(m, pm, p) {

  /* ===== Peta jam tersibuk (ramp oranye) ===== */
  function heatData(p) {
    const done = TX.filter((t) => isDone(t) && inRange(t, p.start, p.end));
    const cnt = new Map();
    done.forEach((t) => { const k = +sod(t.created_at) + "|" + t.created_at.getHours(); cnt.set(k, (cnt.get(k) || 0) + 1); });
    const days = [];
    for (let d = new Date(p.start); +d <= NOWT; d = addDays(d, 1)) days.push(d);
    const rows = p.key === "today"
      ? [{ label: "Hari ini", full: "Hari ini", days }]
      : [1, 2, 3, 4, 5, 6, 0].map((dw) => ({ label: wdName(dw, "short"), full: wdName(dw, "long"), days: days.filter((d) => d.getDay() === dw) }));
    let max = 0, best = null;
    rows.forEach((r) => {
      r.cells = HOURS.map((h) => {
        const avail = r.days.filter((d) => { const s = new Date(d); s.setHours(h, 0, 0, 0); return +s <= NOWT; });
        if (!avail.length) return { h, v: null };
        const v = sum(avail, (d) => cnt.get(+d + "|" + h) || 0) / avail.length;
        if (v > max) { max = v; best = { r, h, v }; }
        return { h, v, k: avail.length };
      });
    });
    return { rows, max, best };
  }
  const heatVal = (v) => S.range === "30d" ? nf1(v) : nf(v);
  function renderHeat(p) {
    const hd = T.heat = heatData(p);
    T.hAct = null;
    $("heat-tip").hidden = true;
    const isToday = p.key === "today";
    $("heat-sub").textContent = isToday ? "Pesanan per jam, hari ini" : p.key === "7d" ? "Pesanan per jam di tiap hari, 7 hari terakhir" : "Rata-rata pesanan per jam di tiap hari, 30 hari terakhir";
    const wrap = $("heat-wrap");
    if (!hd.max) { wrap.hidden = true; $("heat-note").innerHTML = cardEmpty("clock", "Belum ada data jam ramai", "Peta ini terisi dari pesanan yang selesai."); return; }
    wrap.hidden = false;
    const bin = (v) => v == null ? "na" : v <= 0 ? "" : "b" + Math.min(5, Math.max(1, Math.ceil(v / hd.max * 5)));
    let g = "";
    hd.rows.forEach((r, ri) => {
      g += `<div class="rl">${esc(r.label)}</div>`;
      r.cells.forEach((c, ci) => { g += `<div class="hc ${bin(c.v)}" data-r="${ri}" data-c="${ci}"></div>`; });
    });
    g += "<div></div>" + HOURS.map((h) => `<div class="hx">${h % 2 === 0 ? pad(h) : ""}</div>`).join("");
    const b = hd.best, when = `${pad(b.h)}.00–${pad(b.h)}.59`;
    const noteTxt = isToday ? `Paling ramai hari ini: <b>pukul ${when}</b> · ${nf(b.v)} pesanan`
      : `Paling ramai: <b>${esc(b.r.full)}, pukul ${when}</b> · ${heatVal(b.v)} pesanan${p.key === "30d" ? " rata-rata" : ""}`;
    const heat = $("heat");
    heat.innerHTML = g;
    heat.toggleAttribute("data-one", isToday);
    heat.setAttribute("aria-label", noteTxt.replace(/<[^>]+>/g, ""));
    wrap.setAttribute("aria-label", "Peta jam tersibuk. Tekan tombol panah untuk membaca tiap jam.");
    $("heat-note").innerHTML = noteTxt;
  }
  function heatTip(ri, ci) {
    const r = T.heat.rows[ri], c = r.cells[ci];
    const when = `${r.full} · ${pad(c.h)}.00–${pad(c.h)}.59`;
    if (c.v == null) return { html: `<div class="tt">${esc(when)}</div><div class="tr"><span>Belum berjalan</span></div>`, text: `${when}, belum berjalan.` };
    const avg = S.range === "30d";
    return {
      html: `<div class="tt">${esc(when)}</div><div class="tr"><b>${heatVal(c.v)}</b><span>${avg ? "pesanan rata-rata" : "pesanan"}</span></div>` + (avg ? `<div class="tr sub"><span>dari ${c.k} hari ${esc(r.full)}</span></div>` : ""),
      text: `${when}: ${heatVal(c.v)} pesanan${avg ? " rata-rata" : ""}.`,

  }
  function setHeatActive(pos, announce) {

  /** Unduh CSV (dipisah titik koma agar rapi di Excel lokal Indonesia) */
  function downloadCSV(filename, rows) {
    const cell = (v) => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const csv = "\uFEFF" + rows.map((r) => r.map(cell).join(";")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = filename;
    a.hidden = true;
    root.querySelector(".p-penjualan").append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  /* ===== Dialog unduh laporan ===== */
  function dlData() {
    const key = $("dl-period").value;
    const fmt = root.querySelector('input[name="penjualan-dl-fmt"]:checked').value;
    const p = period(key);
    const list = TX.filter((t) => inRange(t, p.start, p.end)).reverse(); // terlama dulu
    const done = list.filter(isDone);
    const rev = sum(done, (t) => t.total);
    let rows, lines;
    if (fmt === "tx") {
      rows = [["Tanggal", "Jam", "No. Pesanan", "Tipe", "Meja", "Item", "Subtotal", "Pajak", "Total", "Metode", "Kasir", "Status"],
        ...list.map((t) => [dCsv(t.created_at), hhmm(t.created_at), t.code, t.order_type === "QR" ? "QR" : "Kasir",
          t.table ? "Meja " + t.table : "Bawa pulang", itemsText(t, "x"), t.sub, t.tax, t.total,
          t.payment_method ? PAY_METHOD[t.payment_method] : "-", t.cashier, ORDER_STATUS[t.status].label])];
      lines = list.length;
    } else {
      const days = [];
      for (let d = new Date(p.start); +d <= NOWT; d = addDays(d, 1)) days.push(d);
      const body = days.map((d) => {
        const a = done.filter((t) => +sod(t.created_at) === +d), r = sum(a, (t) => t.total);
        return [dCsv(d), a.length, r, sum(a.filter((t) => t.payment_method === "CASH"), (t) => t.total), sum(a.filter((t) => t.payment_method === "NON_CASH"), (t) => t.total), a.length ? Math.round(r / a.length) : 0];
      });
      rows = [["Tanggal", "Jumlah Pesanan", "Penjualan", "Tunai", "Non-tunai", "Rata-rata"], ...body,
        ["Total", done.length, rev, sum(body, (x) => x[3]), sum(body, (x) => x[4]), done.length ? Math.round(rev / done.length) : 0]];
      lines = body.length;
    }
    return { fmt, p, list, done, rev, rows, lines, fname: `laporan-penjualan-kedai-senja-${ymd(NOW_D)}.csv` };
  }

  const heatWrap = $("heat-wrap");
  heatWrap.addEventListener("pointerover", (e) => { const c = e.target.closest(".hc"); if (c) setHeatActive({ r: +c.dataset.r, c: +c.dataset.c }); }, { signal });
  heatWrap.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse" && !heatWrap.matches(":focus-visible")) setHeatActive(null); }, { signal });
  heatWrap.addEventListener("focus", () => {
    if (T.hAct || !heatWrap.matches(":focus-visible") || !T.heat?.best) return;
    const b = T.heat.best;
    setHeatActive({ r: T.heat.rows.indexOf(b.r), c: HOURS.indexOf(b.h) }, true);
  }, { signal });
  heatWrap.addEventListener("blur", () => setHeatActive(null), { signal });
  heatWrap.addEventListener("keydown", (e) => {
    if (!T.heat?.max) return;
    const rows = T.heat.rows.length, cols = HOURS.length;
    let { r, c } = T.hAct || { r: 0, c: 0 };
    if (e.key === "ArrowRight") c = Math.min(cols - 1, c + 1);
    else if (e.key === "ArrowLeft") c = Math.max(0, c - 1);
    else if (e.key === "ArrowDown") r = Math.min(rows - 1, r + 1);
    else if (e.key === "ArrowUp") r = Math.max(0, r - 1);
    else if (e.key === "Home") c = 0;
    else if (e.key === "End") c = cols - 1;
    else if (e.key === "Escape" && T.hAct) { setHeatActive(null); return; }
    else return;
    e.preventDefault();
    setHeatActive({ r, c }, true);
  }, { signal });

  // Gambar ulang grafik saat lebar berubah
  let raf = 0;
  const redraw = () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const w = Math.floor(plot.clientWidth);
      if (w && w !== T.drawnW && T.hasData && !S.tableView) drawChart();
      if (T.hAct) setHeatActive(T.hAct);
    });
  };
  const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(redraw) : null;
  ro?.observe($("chart-box"));
  addEventListener("resize", redraw, { signal });
  onCleanup(() => { ro?.disconnect(); cancelAnimationFrame(raf); });

  // Riwayat transaksi
  $("tx-q").addEventListener("input", (e) => { S.q = e.target.value; S.page = 1; renderTx(); }, { signal });
  $("tx-method").addEventListener("change", (e) => { S.method = e.target.value; S.page = 1; renderTx(); }, { signal });
  $("tx-status").addEventListener("change", (e) => { S.status = e.target.value; S.page = 1; renderTx(); }, { signal });
  $("tx-prev").addEventListener("click", () => { S.page--; renderTx(); }, { signal });
  $("tx-next").addEventListener("click", () => { S.page++; renderTx(); }, { signal });
  $("tx-body").addEventListener("click", (e) => { const tr = e.target.closest("tr[data-i]"); if (tr) openStruk(TX[+tr.dataset.i]); }, { signal });
  $("tx-body").addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-i]")) { e.preventDefault(); openStruk(TX[+e.target.dataset.i]); }
  }, { signal });

  // Struk
  $("st-print").addEventListener("click", () => {
    const t = T.struk;
    if (!t || t.status === "DIBATALKAN") return;
    printHTML(receiptHTML(t));
    toast(`Struk ${t.code} dikirim ke printer`);
  }, { signal });

  // Unduh laporan
  $("dl-period").addEventListener("change", renderDlSum, { signal });
  $("dl-fmt").addEventListener("change", renderDlSum, { signal });
  $("dl-go").addEventListener("click", () => {
    const d = dlData();
    if (!d.list.length) return;
    downloadCSV(d.fname, d.rows);
    closeDlg("unduh");
    toast(d.fmt === "tx" ? `Laporan diunduh · ${nf(d.lines)} transaksi` : `Ringkasan harian diunduh · ${nf(d.lines)} hari`);
  }, { signal });

  /* ===== Mulai ===== */
  $("tx-q").value = S.q;
  $("tx-method").value = S.method;
  $("tx-status").value = S.status;
  paintRange();
  paintMetric();
  if (!applyRole()) renderAll();
</script>
