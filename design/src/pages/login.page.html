          </div>
          <div class="lg-field">
            <label for="login-pw">Kata sandi</label>
            <div class="lg-affix">
              <iconify-icon icon="lucide:lock" aria-hidden="true"></iconify-icon>
              <input id="login-pw" name="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required aria-required="true" aria-describedby="login-pw-err" data-err="pw-err" data-part="pw">
              <button type="button" class="lg-pw-toggle" aria-label="Tampilkan kata sandi" aria-pressed="false" aria-controls="login-pw" title="Tampilkan kata sandi" data-part="pw-toggle"><iconify-icon icon="lucide:eye" aria-hidden="true"></iconify-icon></button>
            </div>
            <p class="lg-err" id="login-pw-err" data-part="pw-err" hidden></p>
          </div>
          <div class="lg-row">
            <label class="lg-check"><input type="checkbox" name="remember">Ingat saya</label>
            <button type="button" class="lg-link" aria-haspopup="dialog" data-part="forgot">Lupa kata sandi?</button>
          </div>
          <button type="submit" class="lg-btn lg-submit" data-variant="primary" data-size="lg" data-block data-part="submit">Masuk</button>
        </form>

        <div class="lg-divider" aria-hidden="true">atau</div>

        <section class="lg-demo" aria-labelledby="login-demo-title" data-node-id="login.demo">
          <div class="lg-demo-head"><span class="lg-chip" data-tone="warning">Prototipe</span><h2 id="login-demo-title">Masuk cepat (demo prototipe)</h2></div>
          <p>Tanpa kata sandi, hanya untuk mencoba tampilan tiap peran.</p>
          <div class="lg-demo-btns" data-part="demo"></div>
        </section>

        <a class="lg-cust" href="#/pelanggan" data-route-link><iconify-icon icon="lucide:qr-code" aria-hidden="true"></iconify-icon>Lihat halaman pelanggan (QR)</a>
      </div>
      <p class="lg-foot">Didukung oleh <strong>IUL FnB</strong></p>
    </div>

    <!-- Lupa kata sandi -->
    <dialog class="lg-dialog" aria-labelledby="login-f-title" aria-describedby="login-f-desc" data-part="forgot-dlg" data-node-id="login.forgot">
      <form class="lg-dialog-form" novalidate data-part="forgot-form">
        <div class="lg-dialog-head">
          <div><h2 id="login-f-title">Atur ulang kata sandi</h2><p id="login-f-desc">Masukkan email akunmu. Kami kirim tautan untuk membuat kata sandi baru.</p></div>
          <button type="button" class="lg-iconbtn" data-close aria-label="Tutup"><iconify-icon icon="lucide:x" aria-hidden="true"></iconify-icon></button>
        </div>
        <div class="lg-dialog-body">
          <div class="lg-field">
            <label for="login-f-email">Email akun</label>
            <input class="lg-input" id="login-f-email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="nama@kedaisenja.id" autofocus aria-describedby="login-f-email-err login-f-hint" data-err="f-email-err" data-part="f-email">
            <p class="lg-err" id="login-f-email-err" data-part="f-email-err" hidden></p>
            <p class="lg-hint" id="login-f-hint">Belum menerima email dalam 5 menit? Cek folder spam atau minta bantuan pemilik kafe.</p>
          </div>
        </div>
        <div class="lg-dialog-foot">
          <button type="button" class="lg-btn" data-variant="ghost" data-close>Batal</button>
          <button type="submit" class="lg-btn" data-variant="primary" data-part="f-submit">Kirim tautan</button>
        </div>
      </form>
    </dialog>

    <div class="lg-toast" popover="manual" role="status" data-part="toast"></div>
  </main>
</template>

<script>
  /* PROTOTIPE: tidak ada autentikasi sungguhan. Kata sandi tidak pernah dibaca isinya,
     disimpan, dicatat, atau dikirim ke mana pun — hanya dicek "sudah diisi" lalu dikosongkan. */

  /* ===== Data tiruan (sama dengan halaman Akun & Staf) ===== */
  const STAFF = [
    { id: "u1", name: "Iul Rahman", email: "iul@kedaisenja.id", role: "OWNER", is_active: true },
    { id: "u2", name: "Rina Kartika", email: "rina@kedaisenja.id", role: "CASHIER", is_active: true },
    { id: "u3", name: "Dimas Pratama", email: "dimas@kedaisenja.id", role: "CASHIER", is_active: true },
    { id: "u4", name: "Sari Wulandari", email: "sari@kedaisenja.id", role: "CASHIER", is_active: false },
  ];
  const ROLE_LABEL = { OWNER: "Pemilik", CASHIER: "Kasir" };
  const KEYS = { role: "iulfnb:role" };
  const DEST = { OWNER: "#/penjualan", CASHIER: "#/kasir" };
  const DEST_LABEL = { OWNER: "Penjualan", CASHIER: "layar Pesanan" };
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  /* ===== Util ===== */
  const $ = (part) => root.querySelector(`[data-part="${part}"]`);
  const $$ = (sel, el = root) => [...el.querySelectorAll(sel)];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = (name, size = 18, cls = "") => `<iconify-icon icon="lucide:${name}" aria-hidden="true"${cls ? ` class="${cls}"` : ""} style="font-size:${size}px"></iconify-icon>`;
  const initials = (name) => name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const spin = (el) => { if (!el?.animate || reduceMotion()) return; try { el.animate([{ transform: "rotate(0)" }, { transform: "rotate(360deg)" }], { duration: 800, iterations: Infinity }); } catch {} };

  /* ===== Toast ===== */
  const toastEl = $("toast");
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    try { if (toastEl.matches(":popover-open")) toastEl.hidePopover(); toastEl.showPopover(); } catch {}
    if (toastEl.animate && !reduceMotion()) toastEl.animate([{ opacity: 0, transform: "translate(-50%, 12px)" }, { opacity: 1, transform: "translate(-50%, 0)" }], { duration: 200, easing: "ease" });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 2600);
  }
  function hideToast() { try { if (toastEl.matches(":popover-open")) toastEl.hidePopover(); } catch {} }
  onCleanup(() => { clearTimeout(toastTimer); hideToast(); });

  /* ===== Dialog ===== */
  for (const d of $$("dialog")) {
    d.addEventListener("click", (e) => {
      if (e.target === d || e.target.closest("[data-close]")) d.close();
    }, { signal });
  }
  onCleanup(() => { for (const d of $$("dialog")) if (d.open) d.close(); });

  /* ===== Formulir masuk ===== */
  const form = $("form"), email = $("email"), pw = $("pw"), toggle = $("pw-toggle"), submit = $("submit"), alertBox = $("alert");
  let tried = false, busy = false, checkTimer, navTimer, fTimer;
  onCleanup(() => { clearTimeout(checkTimer); clearTimeout(navTimer); clearTimeout(fTimer); });

  function setErr(input, msg) {
    input.setAttribute("aria-invalid", msg ? "true" : "false");
    input.closest(".lg-affix")?.toggleAttribute("data-invalid", !!msg);
    const err = $(input.dataset.err);
    err.innerHTML = msg ? `${icon("circle-alert", 14)}<span>${esc(msg)}</span>` : "";
    err.hidden = !msg;
  }
  function showAlert(msg) {
    alertBox.innerHTML = msg ? `${icon("triangle-alert", 18)}<div>${esc(msg)}</div>` : "";
    alertBox.hidden = !msg;
  }
  const emailMsg = (v) => !v ? "Masukkan email kamu." : !EMAIL_RE.test(v) ? "Format email belum benar, contoh: nama@kedaisenja.id" : "";
  const pwMsg = () => pw.value ? "" : "Masukkan kata sandi.";
  const isInvalid = (el) => el.getAttribute("aria-invalid") === "true";

  email.addEventListener("input", () => {
    showAlert("");
    if (tried || isInvalid(email)) setErr(email, emailMsg(email.value.trim()));
  }, { signal });
  email.addEventListener("blur", () => { if (email.value.trim()) setErr(email, emailMsg(email.value.trim())); }, { signal });
  pw.addEventListener("input", () => {
    showAlert("");
    if (tried || isInvalid(pw)) setErr(pw, pwMsg());
  }, { signal });

  /* Tampilkan / sembunyikan kata sandi */
  function paintToggle(show) {
    toggle.setAttribute("aria-pressed", String(show));
    toggle.title = show ? "Sembunyikan kata sandi" : "Tampilkan kata sandi";
    toggle.innerHTML = icon(show ? "eye-off" : "eye");
  }
  toggle.addEventListener("click", () => {
    const show = toggle.getAttribute("aria-pressed") !== "true";
    pw.type = show ? "text" : "password";
    paintToggle(show);
  }, { signal });
  function forgetPassword() {
    pw.value = "";
    pw.type = "password";
    paintToggle(false);
  }

  /* Masuk */
  function setBusy(on) {
    busy = on;
    submit.disabled = on;
    submit.setAttribute("aria-busy", String(on));
    delete submit.dataset.state;
    submit.innerHTML = on ? `${icon("loader-circle", 18, "lg-spin")}Memeriksa…` : "Masuk";
    if (on) spin(submit.querySelector(".lg-spin"));
    $$(".lg-demo-btn").forEach((b) => { b.disabled = on; });
  }
  function signIn(user) {
    busy = true;
    forgetPassword();
    store.set(KEYS.role, user.role);
    submit.disabled = true;
    submit.removeAttribute("aria-busy");
    submit.dataset.state = "done";
    submit.innerHTML = `${icon("check")}Berhasil masuk`;
    $$(".lg-demo-btn").forEach((b) => { b.disabled = true; });
    toast(`Halo, ${user.name.split(" ")[0]}! Membuka ${DEST_LABEL[user.role]}…`);
    navTimer = setTimeout(() => { location.hash = DEST[user.role]; }, 500);
  }
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (busy) return;
    tried = true;
    showAlert("");
    const addr = email.value.trim();
    const eMsg = emailMsg(addr), pMsg = pwMsg();
    setErr(email, eMsg);
    setErr(pw, pMsg);
    if (eMsg || pMsg) { (eMsg ? email : pw).focus(); return; }
    setBusy(true);
    checkTimer = setTimeout(() => {
      const user = STAFF.find((s) => s.email.toLowerCase() === addr.toLowerCase());
      if (!user) {
        setBusy(false);
        setErr(email, "Email belum terdaftar. Minta pemilik menambahkan akunmu.");
        email.focus();
        return;
      }
      if (!user.is_active) {
        setBusy(false);
        showAlert("Akun ini sudah dinonaktifkan pemilik.");
        email.focus();
        return;
      }
      signIn(user);
    }, 700);
  }, { signal });

  /* Masuk cepat (demo, tanpa kata sandi) */
  $("demo").innerHTML = ["u1", "u2"].map((id) => STAFF.find((s) => s.id === id)).filter(Boolean).map((u) => `
    <button type="button" class="lg-demo-btn" data-uid="${esc(u.id)}">
      <span class="lg-avatar" aria-hidden="true">${esc(initials(u.name))}</span>
      <span class="lg-grow"><strong>Masuk sebagai ${esc(ROLE_LABEL[u.role])} · ${esc(u.name)}</strong>
        <small>${u.role === "OWNER" ? "Penjualan, menu, stok, staf &amp; pengaturan" : "Layar pesanan, pembayaran &amp; stok bahan"}</small></span>
      ${icon("chevron-right", 16)}
    </button>`).join("");
  $("demo").addEventListener("click", (e) => {
    const b = e.target.closest("[data-uid]");
    if (!b || busy) return;
    const user = STAFF.find((s) => s.id === b.dataset.uid);
    if (user) signIn(user);
  }, { signal });

  /* ===== Lupa kata sandi (simulasi) ===== */
  const fDlg = $("forgot-dlg"), fEmail = $("f-email"), fSubmit = $("f-submit");
  let fBusy = false;
  const fMsg = (v) => emailMsg(v).replace("email kamu", "email akunmu");
  $("forgot").addEventListener("click", () => {
    setErr(fEmail, "");
    const v = email.value.trim();
    fEmail.value = EMAIL_RE.test(v) ? v : "";
    if (!fDlg.open) fDlg.showModal();
  }, { signal });
  fEmail.addEventListener("input", () => { if (isInvalid(fEmail)) setErr(fEmail, fMsg(fEmail.value.trim())); }, { signal });
  $("forgot-form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (fBusy) return;
    const v = fEmail.value.trim();
    const msg = fMsg(v);
    setErr(fEmail, msg);
    if (msg) { fEmail.focus(); return; }
    fBusy = true;
    fSubmit.disabled = true;
    fSubmit.innerHTML = `${icon("loader-circle", 18, "lg-spin")}Mengirim…`;
    spin(fSubmit.querySelector(".lg-spin"));
    fTimer = setTimeout(() => {
      fBusy = false;
      fSubmit.disabled = false;
      fSubmit.textContent = "Kirim tautan";
      fDlg.close();
      toast(`Tautan atur ulang dikirim ke ${v}`);
    }, 650);
  }, { signal });
  onCleanup(() => { fBusy = false; fSubmit.disabled = false; fSubmit.textContent = "Kirim tautan"; });

  /* ===== Mulai: setiap kali halaman dibuka, formulir kembali bersih ===== */
  tried = false;
  forgetPassword();
  setBusy(false);
  setErr(email, "");
  setErr(pw, "");
  showAlert("");
  // Fokus otomatis ke email hanya di layar lebar (di ponsel keyboard akan menutupi layar)
  if (matchMedia("(min-width: 900px)").matches) email.focus({ preventScroll: true });
</script>
