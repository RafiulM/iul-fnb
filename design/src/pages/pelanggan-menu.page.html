  const MAX_QTY = 50;
  const NOTE_MAX = 120;
  const DAYS = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

  /* ===== Util ===== */
  const $ = (part) => root.querySelector(`[data-part="${part}"]`);
  const $$ = (sel, el = root) => [...el.querySelectorAll(sel)];
  const rp = (n) => "Rp " + Math.round(n).toLocaleString("id-ID");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = (name, size = 18, cls = "") => `<iconify-icon icon="lucide:${name}" aria-hidden="true"${cls ? ` class="${cls}"` : ""} style="font-size:${size}px"></iconify-icon>`;
  const menuById = Object.fromEntries(MENUS.map((m) => [m.id, m]));
  const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const motion = (el, frames, opts = {}) => {
    if (!el?.animate || reduceMotion()) return;
    try { el.animate(frames, { duration: 280, easing: "cubic-bezier(.2,.8,.2,1)", ...opts }); } catch {}
  };
  function nextOpenLabel(now = new Date()) {
    for (let i = 0; i < 8; i++) {
      const d = new Date(now); d.setDate(now.getDate() + i);
      const h = HOURS[d.getDay()];
      if (!h) continue;
      d.setHours(+h[0].slice(0, 2), +h[0].slice(3), 0, 0);
      if (d > now) return `${i === 0 ? "" : i === 1 ? "besok " : DAYS[d.getDay()] + " "}pukul ${h[0].replace(":", ".")}`;
    }
    return "pukul 08.00";
  }

  /* ===== Toast ===== */
  const toastEl = $("toast");
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    try { if (toastEl.matches(":popover-open")) toastEl.hidePopover(); toastEl.showPopover(); } catch {}
    motion(toastEl, [{ opacity: 0, transform: "translate(-50%, 12px)" }, { opacity: 1, transform: "translate(-50%, 0)" }], { duration: 200 });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 2400);
  }
  function hideToast() { try { if (toastEl.matches(":popover-open")) toastEl.hidePopover(); } catch {} }
  onCleanup(() => { clearTimeout(toastTimer); hideToast(); });

  /* ===== State draf (dibangun ulang dari sesi tiap kali halaman tampil) ===== */
  let c, m, editLine, qty, blocked;
  /** Baca sesi: menu terpilih (default m1) dan baris keranjang yang sedang diubah (bila ada) */
  function load() {
    c = loadCust();
    m = menuById[c.selected] || menuById.m1;
    editLine = c.edit_key ? c.cart.find((l) => l.key === c.edit_key && l.menu_id === m.id) || null : null;
    qty = editLine ? Math.min(MAX_QTY, Math.max(1, editLine.qty)) : 1;
    blocked = !!c.browse_only || (!isCafeOpen() && !c.force_open);
  }
  const orderable = () => m.is_available && !blocked;
  const backHash = () => (c.edit_key ? "#/pelanggan/keranjang" : "#/pelanggan");

  function render() {
    const cat = CATEGORIES.find((x) => x.id === m.category_id);
    const back = $("back");
    back.setAttribute("href", backHash());
    back.setAttribute("aria-label", c.edit_key ? "Kembali ke keranjang" : "Kembali ke menu");
    $("bar-title").textContent = editLine ? "Ubah pesanan" : cat ? cat.name : "Detail menu";
    $("bar-table").textContent = `Meja ${c.table}`;
    $("photo").src = m.image_url;
    $("photo").alt = `Foto ${m.name}`;
    $("hero").toggleAttribute("data-soldout", !m.is_available);
    $("hero-sold").hidden = m.is_available;
    $("tags").innerHTML = m.tags.map((t) => `<span class="pl-tag">${esc(t)}</span>`).join("");
    $("tags").hidden = !m.tags.length;
    $("name").textContent = m.name;
    $("desc").textContent = m.desc;
    $("price").textContent = rp(m.price);
    // Sudah ada di keranjang (saat menambah, bukan mengubah)
    const inCart = c.cart.filter((l) => l.menu_id === m.id).reduce((a, l) => a + l.qty, 0);
    $("incart").hidden = !inCart || !!editLine;
    $("incart").innerHTML = `${icon("shopping-bag", 15)}Sudah ${inCart} di keranjang`;

    const ok = orderable();
    $("stepper").hidden = !ok;
    $("note-area").hidden = !ok;
    $("note").value = editLine ? editLine.note : "";
    $("chips").innerHTML = (NOTE_CHIPS[m.category_id] || []).map((ch) =>
      `<button type="button" class="pl-nchip" data-chip="${esc(ch)}" aria-pressed="false">${icon("plus", 14, "pl-off")}${icon("check", 14, "pl-on")}${esc(ch)}</button>`).join("");

    // Menu habis → tawarkan menu lain yang tersedia di kategori yang sama
    const alts = m.is_available ? [] : MENUS.filter((x) => x.category_id === m.category_id && x.is_available && x.id !== m.id).slice(0, 3);
    $("alt").hidden = !alts.length;
    $("alt-list").innerHTML = alts.map((x) => `<li><button type="button" data-alt="${x.id}" aria-label="${esc(x.name)}, ${rp(x.price)}. Lihat detail">
        <span class="pl-thumb" aria-hidden="true"><img src="${esc(x.image_url)}" alt="" loading="lazy" decoding="async"></span><b>${esc(x.name)}</b><span>${rp(x.price)}</span>${icon("chevron-right", 16)}</button></li>`).join("");

    const reason = $("reason");
    reason.hidden = ok;
    if (!m.is_available) reason.innerHTML = `${icon("circle-slash", 16)}<span>Menu ini sedang habis hari ini, jadi belum bisa dipesan. Pilih menu lain di atas, ya.</span>`;
    else if (blocked) reason.innerHTML = `${icon("clock", 16)}<span>Kafe sedang tutup · buka lagi ${esc(nextOpenLabel())}. Kamu masih bisa melihat menu, tapi belum bisa memesan.</span>`;
    const save = $("save");
    save.disabled = !ok;
    if (ok) save.removeAttribute("aria-describedby"); else save.setAttribute("aria-describedby", "pelanggan-menu-reason");
    syncNote();
    syncQty();
    document.title = `${m.name} — Kedai Senja | IUL FnB`;
  }
  function syncQty() {
    $("qty").textContent = qty;
    root.querySelector('[data-step="-1"]').disabled = qty <= 1;
    root.querySelector('[data-step="1"]').disabled = qty >= MAX_QTY;
    const save = $("save");
    if (!m.is_available) save.textContent = "Menu sedang habis";
    else if (blocked) save.textContent = "Kafe sedang tutup";
    else save.innerHTML = `${editLine ? "Simpan perubahan" : "Tambah ke keranjang"} <span class="pl-sep" aria-hidden="true">·</span> ${rp(m.price * qty)}`;
  }
  const noteParts = () => $("note").value.split(",").map((s) => s.trim()).filter(Boolean);
  function syncNote() {
    const parts = noteParts().map((s) => s.toLowerCase());
    $$(".pl-nchip", $("chips")).forEach((ch) => ch.setAttribute("aria-pressed", String(parts.includes(ch.dataset.chip.toLowerCase()))));
    $("count").textContent = $("note").value.length;
  }

  /* ===== Simpan ke keranjang (logika sama dengan lembar detail lama) ===== */
  function save() {
    const n = qty, note = $("note").value.trim().slice(0, NOTE_MAX);
    load(); // baca ulang sesi terbaru (tab lain / halaman lain bisa sudah mengubahnya)
    if (!orderable()) { render(); toast(m.is_available ? "Kafe sedang tutup — belum bisa memesan" : `Maaf, ${m.name} sedang habis`); return; }
    const key = lineKey(m.id, note);
    const back = backHash();
    let msg;
    const idx = c.edit_key ? c.cart.findIndex((l) => l.key === c.edit_key && l.menu_id === m.id) : -1;
    if (idx >= 0) {
      // Ubah baris di tempat; gabungkan bila catatan baru sama dengan baris lain
      const dup = c.cart.findIndex((l, i) => l.key === key && i !== idx);
      if (dup >= 0) { c.cart[dup].qty = Math.min(MAX_QTY, c.cart[dup].qty + n); c.cart.splice(idx, 1); msg = `✓ ${m.name} digabung dengan catatan yang sama`; }
      else { c.cart[idx] = { key, menu_id: m.id, qty: n, note }; msg = `✓ Perubahan ${m.name} disimpan`; }
    } else {
      const ex = c.cart.find((l) => l.key === key);
      if (ex) ex.qty = Math.min(MAX_QTY, ex.qty + n);
      else c.cart.push({ key, menu_id: m.id, qty: n, note });
      msg = `✓ ${n}× ${m.name} masuk keranjang`;
    }
    c.edit_key = null;
    c.flash = msg;
    saveCust(c);
    location.hash = back;
  }

  /* ===== Event ===== */
  root.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || !root.contains(b)) return;
    const d = b.dataset;
    if (d.step) {
      qty = Math.max(1, Math.min(MAX_QTY, qty + Number(d.step)));
      syncQty();
      return;
    }
    if (d.chip) {
      const chip = d.chip;
      let parts = noteParts();
      const has = parts.some((p) => p.toLowerCase() === chip.toLowerCase());
      parts = has ? parts.filter((p) => p.toLowerCase() !== chip.toLowerCase()) : parts.concat(chip);
      $("note").value = parts.join(", ").slice(0, NOTE_MAX);
      syncNote();
      return;
    }
    if (d.alt) {
      c = loadCust();
      c.selected = d.alt; c.edit_key = null;
      saveCust(c);
      load(); render();
      scrollTo({ top: 0 });
      $("name").focus({ preventScroll: true });
      motion($("hero"), [{ opacity: 0.4, transform: "scale(.98)" }, { opacity: 1, transform: "none" }], { duration: 240 });
    }
  }, { signal });
  $("save").addEventListener("click", save, { signal });
  $("note").addEventListener("input", syncNote, { signal });
  // Kembali tanpa menyimpan: lupakan baris yang sedang diubah
  $("back").addEventListener("click", () => {
    const cur = ls.get(KEY.cust, null);
    if (cur && cur.edit_key) { cur.edit_key = null; saveCust(cur); }
  }, { signal });
  // Sesi diubah di tab lain → sinkronkan (tanpa menimpa catatan yang sedang diketik)
  addEventListener("storage", (e) => {
    if (e.key !== KEY.cust && e.key !== null) return;
    const note = $("note").value, n = qty, prevId = m.id;
    load();
    render();
    if (m.id === prevId) { $("note").value = note; qty = n; syncNote(); syncQty(); }
  }, { signal });

  /* ===== Mulai ===== */
  const prevTitle = document.title;
  onCleanup(() => { document.title = prevTitle; });
  load();
  render();
  scrollTo({ top: 0 });
  $("name").focus({ preventScroll: true });
  if (c.flash) { const f = c.flash; c.flash = null; saveCust(c); toast(f); }
</script>
